<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading Screen</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <div
    id="sb-load-host"
    style="position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#ffffff;"
  ></div>

  <script>
    (function () {
      // 1. Image List (Full Screen Backgrounds)
      const IMAGES = [
        "/aS/assets/images/loading1.jpg",
        "/aS/assets/images/loading2.jpg",
        "/aS/assets/images/loading3.jpg",
        "/aS/assets/images/loading4.jpg",
        "/aS/assets/images/loading5.jpg",
        "/aS/assets/images/loading6.jpg",
        "/aS/assets/images/loading7.jpg",
        "/aS/assets/images/loading8.jpg",
        "/aS/assets/images/loading9.jpg",
        "/aS/assets/images/loading10.jpg",
        "/aS/assets/images/loading11.jpg",
        "/aS/assets/images/loading12.jpg",
        "/aS/assets/images/loading13.jpg",
        "/aS/assets/images/loading14.jpg",
        "/aS/assets/images/loading15.jpg",
        "/aS/assets/images/loading16.jpg",
        "/aS/assets/images/loading17.jpg",
        "/aS/assets/images/loading18.jpg",
        "/aS/assets/images/loading19.jpg"
      ];

      // 2. JSON for the 3 Text Types (Tips)
      const TEXT_DATA = {
  breaks: [
    "Been on a while? Step away for a bit — even a short break helps.",
    "If you said one game and you’re still here, that’s your cue.",
    "If it’s hard to stop, that’s usually when you should."
  ],

  credentials: [
    "Don’t pass your login around — it’s meant for you.",
    "If your account gets shared, it can get restricted.",
    "If it’s already been shared, let us know at studybase.site/legal."
  ],

  safeguarding: [
    "If something on here — or outside of it — is worrying you, tell us at studybase.site/legal and we’ll pass it on anonymously.",
    "Worried about something? Report it at studybase.site/legal — we’ll forward it on anonymously.",
    "Seen something concerning? Let us know at studybase.site/legal so it can be looked into."
  ],

  tips: [
    "Set a timer before you start — it helps you stay in control.",
    "If you’re stuck, step away and come back later.",
    "Doing one thing properly beats rushing through loads."
  ],

  focus: [
    "Too many tabs open? Close a few and focus on one thing.",
    "You’ll get more done focusing for 10 minutes than drifting for 30.",
    "Focus first, then relax after."
  ],

  time: [
    "Time goes quickly on here — check in with yourself.",
    "Set a limit before you start — it’s easier than stopping later.",
    "A quick session can turn into an hour. Keep track of it."
  ],

  fairuse: [
    "Use the site properly so it stays working for everyone.",
    "Trying to bypass systems can lead to access being removed.",
    "Keep things fair — it helps keep everything running smoothly."
  ],

  responsibility: [
    "Use it in a way you’d be fine explaining if asked.",
    "If you have to hide it, it’s probably not the right time.",
    "Be smart about when and where you’re on here."
  ]
};

      const host = document.getElementById("sb-load-host");
      const shadow = host.attachShadow({ mode: "open" });

      shadow.innerHTML = `
        <style>
          :host, * {
            box-sizing: border-box;
          }

          .sbl-root {
            width: 100%;
            height: 100%;
            position: relative;
            background: #ffffff;
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Aligns content to bottom */
          }

          /* Full Screen Background */
          .sbl-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            z-index: 1;
          }

          .sbl-bg.sbl-loaded {
            opacity: 1;
          }

          /* Light gradient overlay to ensure the banner stands out */
          .sbl-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
              to bottom, 
              rgba(255, 255, 255, 0.2) 0%, 
              rgba(255, 255, 255, 0.5) 60%, 
              rgba(255, 255, 255, 0.9) 100%
            );
            z-index: 2;
          }

          /* Bottom Container (holds loader bar + tip banner) */
          .sbl-bottom-wrap {
            position: relative;
            width: 100%;
            z-index: 10;
            transform: translateY(20px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
          }

          .sbl-ready .sbl-bottom-wrap {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
          }

          /* Indeterminate Loading Bar (Sits immediately above the banner) */
          .sbl-progress-container {
            width: 100%;
            height: 4px;
            background: rgba(37, 99, 235, 0.1); /* Very faint blue track */
            position: relative;
            overflow: hidden;
          }

          .sbl-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30%;
            background: #2563eb; /* Primary blue */
            border-radius: 4px;
            animation: sbl-slide 1.5s infinite ease-in-out;
          }

          @keyframes sbl-slide {
            0% { left: -30%; width: 30%; }
            50% { width: 50%; }
            100% { left: 100%; width: 30%; }
          }

          /* Banner at the bottom */
          .sbl-banner {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            padding: 20px 24px;
            background: #ffffff;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.04);
          }

          .sbl-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
          }

          /* Lightbulb-esque inner square */
          .sbl-badge::before {
            content: "";
            width: 18px;
            height: 18px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.95);
          }

          .sbl-banner-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
          }

          .sbl-banner-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2563eb;
            margin-bottom: 4px;
          }

          .sbl-banner-desc {
            font-size: 15px;
            font-weight: 500;
            color: #1f2937;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
          }

          @media (max-width: 640px) {
            .sbl-banner { padding: 16px; }
          }
        </style>

        <div id="sbl-wrapper" class="sbl-root">
          <div id="sbl-bg" class="sbl-bg"></div>
          <div class="sbl-overlay"></div>

          <div class="sbl-bottom-wrap">
            <div class="sbl-progress-container">
              <div class="sbl-progress-bar"></div>
            </div>
            
            <div class="sbl-banner">
              <div class="sbl-badge"></div>
              <div class="sbl-banner-text">
                <div id="sbl-banner-title" class="sbl-banner-title">Category</div>
                <div id="sbl-banner-desc" class="sbl-banner-desc">Loading tip...</div>
              </div>
            </div>
          </div>
        </div>
      `;

      const wrapper = shadow.getElementById("sbl-wrapper");
      const bgElement = shadow.getElementById("sbl-bg");
      const bannerTitle = shadow.getElementById("sbl-banner-title");
      const bannerDesc = shadow.getElementById("sbl-banner-desc");

      function pickRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function loadScreenContent() {
        // 1. Pick random tip data
        const categories = Object.keys(TEXT_DATA);
        const randomCategory = pickRandom(categories);
        const randomText = pickRandom(TEXT_DATA[randomCategory]);
        
        // Populate text
        bannerTitle.textContent = randomCategory + " Tip";
        bannerDesc.textContent = randomText;

        // Show the UI wrappers immediately
        wrapper.classList.add("sbl-ready");

        // 2. Pick random image and preload it smoothly
        const randomImage = pickRandom(IMAGES);
        const img = new Image();
        
        img.onload = () => {
          bgElement.style.backgroundImage = `url('${randomImage}')`;
          // Fade in the background once it's fully downloaded
          bgElement.classList.add("sbl-loaded");
        };

        img.src = randomImage;
      }

      // Initialize
      loadScreenContent();
    })();
  </script>
</body>
</html>
