<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Loading & Safeguarding</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes rise {
            0% { transform: translateY(10vh) scale(0.5); opacity: 0; }
            15% { opacity: 0.7; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            backdrop-filter: blur(2px);
            animation: rise infinite ease-in;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .bubble:hover {
            transform: scale(1.4);
            background: rgba(255, 255, 255, 0.5);
        }

        .bubble.popped {
            transform: scale(3);
            opacity: 0;
            pointer-events: none;
        }

        /* Loading border animation around the card */
        .loading-border-container {
            position: relative;
            padding: 4px; /* Space for the border */
            border-radius: 2.25rem;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .loading-border-container::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, transparent, transparent, #3b82f6);
            animation: rotate 2s linear infinite;
            top: -25%;
            left: -25%;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .inner-card {
            position: relative;
            background: white;
            border-radius: 2rem;
            z-index: 1;
        }
    </style>
</head>
<body class="m-0 p-0 h-screen w-screen overflow-hidden bg-sky-600 flex flex-col items-center justify-center font-sans px-4">

    <!-- Background Layer (Lighter Blue Gradient) -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-sky-400 via-sky-600 to-blue-700 z-0"></div>
    <div id="bubbles-container" class="absolute inset-0 z-0"></div>

    <!-- Main Container -->
    <div class="z-10 w-full max-w-xl">
        
        <!-- Loading Border Wrapper -->
        <div class="loading-border-container shadow-[0_20px_60px_rgba(0,0,0,0.2)]">
            <!-- Announcement Card -->
            <div class="inner-card overflow-hidden">
                <div class="p-8 md:p-10 text-center flex flex-col items-center">
                    
                    <!-- Icon Header -->
                    <div id="icon-box" class="w-16 h-16 rounded-2xl bg-blue-50 flex items-center justify-center mb-6 text-blue-600 transition-colors duration-500">
                        <i id="msg-icon" data-lucide="shield-check" class="w-8 h-8"></i>
                    </div>

                    <!-- Label -->
                    <span id="badge" class="text-[10px] font-black tracking-[0.2em] uppercase text-blue-500 mb-2">SAFEGUARDING</span>
                    
                    <!-- Content -->
                    <h2 id="msg-title" class="text-2xl md:text-3xl text-slate-900 font-extrabold tracking-tight mb-4"></h2>
                    <p id="msg-subtitle" class="text-slate-600 text-sm md:text-base leading-relaxed mb-8 max-w-md"></p>
                    
                    <!-- Action Button -->
                    <a id="msg-btn" target="_blank" rel="noopener noreferrer" class="hidden px-10 py-3.5 text-sm font-bold text-white bg-blue-600 rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 active:scale-95 flex items-center gap-2">
                        <span>Get Help Now</span>
                        <i data-lucide="external-link" class="w-4 h-4"></i>
                    </a>
                </div>
            </div>
        </div>

        <!-- Loading Section (Under the card) -->
        <div class="flex flex-col items-center mt-8">
            <h1 class="text-lg font-black tracking-[0.5em] text-white uppercase drop-shadow-md">Loading</h1>
            <div class="flex gap-1 mt-2">
                <div class="w-2 h-2 bg-white rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                <div class="w-2 h-2 bg-white rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                <div class="w-2 h-2 bg-white rounded-full animate-bounce"></div>
            </div>
        </div>
    </div>

    <!-- Footer Security Brand -->
    <div class="absolute bottom-8 z-10 flex items-center gap-2 opacity-60">
        <i data-lucide="shield-check" class="w-4 h-4 text-white"></i>
        <span class="text-[10px] text-white tracking-widest uppercase font-bold">Secure Gaming Environment</span>
    </div>

    <script>
        const announcements = [
            {
                id: 1,
                category: "Support",
                icon: "heart-handshake",
                color: "bg-rose-50 text-rose-600",
                title: "You Are Not Alone",
                subtitle: "Life can be tough, but you don't have to face it by yourself. Friendly support is available 24/7 if you need a chat.",
                btnText: "Talk to Someone",
                btnUrl: "https://www.childline.org.uk/get-support/"
            },
            {
                id: 2,
                category: "Wellbeing",
                icon: "droplets",
                color: "bg-blue-50 text-blue-600",
                title: "Stay Hydrated",
                subtitle: "Even mild dehydration can make you feel tired or lose focus. Grab a glass of water before you jump into the game!",
                btnText: "Health Tips",
                btnUrl: "https://www.activehealth.sg/read/screen-time/how-to-keep-your-eyes-healthy-the-20-20-20-rule"
            },
            {
                id: 3,
                category: "Safety",
                icon: "lock",
                color: "bg-amber-50 text-amber-600",
                title: "Protect Your Privacy",
                subtitle: "Never share your real name, address, or passwords. Keeping your personal info private is the best way to stay safe.",
                btnText: "Stay Safe",
                btnUrl: "https://www.internetmatters.org/resources/online-safety-guide/"
            },
            {
                id: 4,
                category: "Balance",
                icon: "clock",
                color: "bg-emerald-50 text-emerald-600",
                title: "Take a Breather",
                subtitle: "Games are great, but fresh air is too. Try the 20-20-20 rule: every 20 mins, look at something 20ft away for 20 seconds.",
                btnText: "Rest Advice",
                btnUrl: "https://www.specsavers.co.uk/eye-health/computer-vision-syndrome"
            }
        ];

        function getSeenMessages() {
            try { return JSON.parse(localStorage.getItem('safeguard_rotation') || '[]'); } 
            catch (e) { return []; }
        }

        function saveSeenMessages(arr) {
            try { localStorage.setItem('safeguard_rotation', JSON.stringify(arr)); } 
            catch (e) { }
        }

        function displayRandomAnnouncement() {
            let seen = getSeenMessages();
            // If all seen, we reset the rotation to pick a fresh one
            if (seen.length >= announcements.length) seen = [];

            const available = announcements.filter(a => !seen.includes(a.id));
            const picked = available[Math.floor(Math.random() * available.length)];

            seen.push(picked.id);
            saveSeenMessages(seen);

            const iconBox = document.getElementById('icon-box');
            const msgIcon = document.getElementById('msg-icon');
            
            iconBox.className = `w-16 h-16 rounded-2xl flex items-center justify-center mb-6 transition-colors duration-500 ${picked.color}`;
            msgIcon.setAttribute('data-lucide', picked.icon);
            
            document.getElementById('badge').textContent = picked.category;
            document.getElementById('msg-title').textContent = picked.title;
            document.getElementById('msg-subtitle').textContent = picked.subtitle;

            const btn = document.getElementById('msg-btn');
            if (picked.btnText && picked.btnUrl) {
                btn.querySelector('span').textContent = picked.btnText;
                btn.href = picked.btnUrl;
                btn.classList.remove('hidden');
            } else {
                btn.classList.add('hidden');
            }

            lucide.createIcons();
        }

        document.addEventListener("DOMContentLoaded", () => {
            displayRandomAnnouncement();

            // Bubble Logic
            const container = document.getElementById('bubbles-container');
            for (let i = 0; i < 40; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                const size = Math.random() * 50 + 15;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}vw`;
                bubble.style.animationDuration = `${Math.random() * 10 + 5}s`;
                bubble.style.animationDelay = `-${Math.random() * 15}s`;
                
                bubble.addEventListener('click', function() {
                    this.classList.add('popped');
                    setTimeout(() => this.remove(), 400);
                });
                
                container.appendChild(bubble);
            }
            
            lucide.createIcons();
        });
    </script>
</body>
</html>
