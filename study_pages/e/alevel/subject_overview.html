<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                const isDark = String(localStorage.getItem('darkMode') || '').toLowerCase() === 'true';
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/assets/css/dark-mode.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBase | ALevel Specification</title>
    <link rel="icon" href="/assets/siteIcons/main.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/navbar.js" defer></script>
    <script src="/assets/js/footer.js" defer></script>
    <script src="/assets/js/adminUi.js" defer></script>
    <script src="/assets/js/services.js"></script>
    <script src="/assets/js/sessionManager.js" defer></script>
    
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        img { -webkit-user-drag: none; user-select: none; pointer-events: none; }
        .topic-card { transition: all 0.3s ease; }
        .topic-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
    </style>
</head>
<body class="bg-[#fafafa] text-slate-900 flex flex-col min-h-screen">

    <header class="relative pt-24 pb-12 lg:pt-32 lg:pb-20 overflow-hidden bg-white border-b border-slate-100 flex-none">
    
        <div class="max-w-7xl mx-auto px-6 relative z-10 flex flex-col lg:flex-row items-center gap-12">
            <div class="w-full lg:w-1/2">
                <div id="hero-badge" class="inline-flex items-center gap-3 px-4 py-2 rounded-full border mb-6 text-xs font-bold uppercase tracking-widest bg-slate-50 border-slate-200 text-slate-500">
                    Loading...
                </div>
                <h1 class="text-5xl md:text-7xl font-black tracking-tighter leading-[1.1] mb-6">
                    <span id="hero-title">Subject</span><br>
                    <span id="hero-highlight" class="text-transparent bg-clip-text bg-gradient-to-r from-slate-400 to-slate-600">Overview</span>
                </h1>
                <p id="hero-desc" class="text-lg text-slate-500 max-w-lg mb-8 leading-relaxed">
                    Fetching syllabus data...
                </p>
            </div>
            <div class="w-full lg:w-1/2 relative">
                <div class="rounded-3xl overflow-hidden shadow-2xl border-8 border-white bg-slate-100 h-[350px]">
                    <img id="hero-image" src="" alt="Subject Hero" class="w-full h-full object-cover opacity-0 transition-opacity duration-500">
                </div>
            </div>
        </div>
    </header>

    <main class="py-16 flex-1">
        <div class="max-w-7xl mx-auto px-6">
            
            <h2 class="text-3xl font-extrabold mb-8 tracking-tight text-slate-900">Course Content</h2>
            
            <div id="sections-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-16">
                </div>

            <div id="links-container" class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm hidden">
                <h2 class="text-2xl font-bold mb-6 text-slate-900 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    Useful Links
                </h2>
                <div id="links-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    </div>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Get the subject from the URL, e.g., ?subject=maths
            const urlParams = new URLSearchParams(window.location.search);
            const subject = urlParams.get('subject');

            if (!subject) {
                document.getElementById('hero-title').innerText = "404";
                document.getElementById('hero-desc').innerText = "No subject parameter found in the URL. Please use ?subject=maths etc.";
                return;
            }

            try {
                // Fetch the JSON file from data/[subject].json
                const response = await fetch(`data/${subject}.json`);
                if (!response.ok) throw new Error("Could not load subject data.");
                const data = await response.json();

                // Set Global Page ID
                window.PAGE_ID = data.pageId;

                // 1. Populate Hero Section
                document.getElementById('hero-badge').className = `inline-flex items-center gap-3 px-4 py-2 rounded-full border mb-6 text-xs font-bold uppercase tracking-widest ${data.badgeClass}`;
                document.getElementById('hero-badge').innerText = data.badgeText;
                document.getElementById('hero-title').innerText = data.title;
                
                const highlightEl = document.getElementById('hero-highlight');
                highlightEl.innerText = data.highlight;
                highlightEl.className = `text-transparent bg-clip-text ${data.highlightClass}`;

                document.getElementById('hero-desc').innerText = data.description;
                
                const imgEl = document.getElementById('hero-image');
                imgEl.src = data.heroImage;
                imgEl.onload = () => imgEl.classList.remove('opacity-0');

                // 2. Populate Course Content Sections
                const sectionsGrid = document.getElementById('sections-grid');
                if (data.sections && data.sections.length > 0) {
                    sectionsGrid.innerHTML = data.sections.map((sec, index) => `
                        <div class="topic-card bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col h-full">
                            <div class="w-10 h-10 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-500 font-bold mb-4">
                                ${index + 1}
                            </div>
                            <h3 class="text-xl font-bold mb-3 text-slate-800">${sec.title}</h3>
                            <p class="text-slate-500 leading-relaxed text-sm flex-1">${sec.text}</p>
                        </div>
                    `).join('');
                }

                // 3. Populate Useful Links
                const linksContainer = document.getElementById('links-container');
                const linksGrid = document.getElementById('links-grid');
                
                if (data.usefulLinks && data.usefulLinks.length > 0) {
                    linksContainer.classList.remove('hidden'); // Show the container
                    linksGrid.innerHTML = data.usefulLinks.map(link => `
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="group flex items-center justify-between p-4 rounded-2xl bg-slate-50 hover:bg-slate-100 border border-slate-200 transition-colors">
                            <span class="font-semibold text-slate-700 group-hover:text-blue-600 transition-colors">${link.title}</span>
                            <svg class="w-5 h-5 text-slate-400 group-hover:text-blue-600 group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </a>
                    `).join('');
                }

            } catch (error) {
    console.error(error);
    window.location.replace("/index.html?error=NAV_002");
}
        });
    </script>
</body>
</html>
