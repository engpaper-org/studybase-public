<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">

    <meta name="educational-use" content="Revision, exam preparation, independent study" data-studybase-education-meta="true">
    <meta name="learning-resource-type" content="Revision resource" data-studybase-education-meta="true">

<script src="/assets/js/config/siteConfig.js"></script>
    <link rel="stylesheet" href="/assets/css/main/studybase.css?v=20260509-dark3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCSE Countdown | StudyBase</title>
    <link rel="icon" href="/assets/images/site-icons/main.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/assets/js/layout/navbar.js" defer></script>
    <script src="/assets/js/layout/footer.js" defer></script>
    <style>
        .gcse-countdown-body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 0%, rgba(37, 99, 235, 0.12), transparent 28rem), radial-gradient(circle at 88% 8%, rgba(20, 184, 166, 0.10), transparent 24rem), linear-gradient(180deg, #f8fafc 0%, #eef2ff 48%, #f8fafc 100%);
        }
        .text-gradient { background: linear-gradient(135deg, #2563eb, #0f766e 54%, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .exam-card { border-radius: 8px; border: 1px solid rgba(203, 213, 225, 0.82); background: rgba(255, 255, 255, 0.9); box-shadow: 0 18px 42px rgba(15, 23, 42, 0.08); transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; }
        .exam-card:hover { transform: translateY(-2px); border-color: rgba(37, 99, 235, 0.34); box-shadow: 0 24px 52px rgba(15, 23, 42, 0.12); }
        .exam-card.is-next { border-color: rgba(37, 99, 235, 0.42); box-shadow: 0 24px 58px rgba(37, 99, 235, 0.14); }
        .exam-card.is-past { opacity: 0.72; }
        :root.dark .gcse-countdown-body { background: radial-gradient(circle at 10% 0%, rgba(59, 130, 246, 0.14), transparent 28rem), radial-gradient(circle at 88% 8%, rgba(45, 212, 191, 0.10), transparent 24rem), #0b1120; }
        :root.dark .exam-card { background: rgba(15, 23, 42, 0.92); border-color: rgba(51, 65, 85, 0.78); box-shadow: 0 18px 42px rgba(2, 6, 23, 0.52); }
        :root.dark .exam-card.is-next { border-color: rgba(96, 165, 250, 0.46); box-shadow: 0 24px 58px rgba(37, 99, 235, 0.18); }
    </style>
</head>
<body class="gcse-countdown-body min-h-screen text-slate-900 font-sans overflow-x-hidden">
    <main class="mx-auto max-w-6xl px-6 py-14 md:py-20">
        <section class="mb-10 grid gap-8 lg:grid-cols-[1fr_20rem] lg:items-end">
            <div>
                <div class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white/86 px-3 py-1 text-[11px] font-black uppercase tracking-[0.18em] text-blue-700 shadow-sm"><i class="fa-solid fa-hourglass-half text-[10px]"></i> GCSE Countdown</div>
                <h1 class="mt-5 max-w-3xl text-4xl font-black tracking-tight text-slate-950 md:text-6xl">Exam <span class="text-gradient">Countdown</span></h1>
                <p class="mt-4 max-w-3xl text-base leading-relaxed text-slate-600 md:text-lg font-body">Track upcoming GCSE exam dates in one clean list. Schools can still adjust dates for clashes or local arrangements, so always check your official timetable.</p>
            </div>
            <aside class="rounded-lg border border-slate-200 bg-white/86 p-5 shadow-sm backdrop-blur">
                <p class="text-xs font-black uppercase tracking-[0.18em] text-slate-500">Next exam</p>
                <div id="nextSummary" class="mt-3 text-sm text-slate-600 font-body">Loading countdown...</div>
            </aside>
        </section>
        <section class="grid gap-8 lg:grid-cols-[1fr_0.82fr]">
            <div>
                <div class="mb-4 flex items-center justify-between gap-4"><h2 class="text-sm font-black uppercase tracking-[0.18em] text-slate-600">Upcoming</h2><span id="upcomingCount" class="rounded-lg bg-blue-50 px-3 py-1 text-xs font-black text-blue-700">0 exams</span></div>
                <div id="upcoming-container" class="grid gap-4"></div>
            </div>
            <div>
                <div class="mb-4 flex items-center justify-between gap-4"><h2 class="text-sm font-black uppercase tracking-[0.18em] text-slate-600">Completed</h2><span id="pastCount" class="rounded-lg bg-slate-100 px-3 py-1 text-xs font-black text-slate-600">0 exams</span></div>
                <div id="past-container" class="grid gap-4"></div>
            </div>
        </section>
    </main>
    <script>
        const examsJSON = "[\n{ \"subject\": \"English Literature\", \"paper\": \"Paper 1 (Shakespeare & 19th Century Novel)\", \"examBoard\": \"AQA\", \"date\": \"2026-05-11\" },\n\n{ \"subject\": \"Biology\", \"paper\": \"Paper 1 (Cell Biology, Organisation, Infection, Bioenergetics)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-05-12\" },\n\n{ \"subject\": \"Religious Studies\", \"paper\": \"Paper 1 (Beliefs & Teachings)\", \"examBoard\": \"AQA\", \"date\": \"2026-05-12\" },\n\n{ \"subject\": \"Geography\", \"paper\": \"Paper 1 (Physical Geography)\", \"examBoard\": \"AQA\", \"date\": \"2026-05-13\" },\n\n{ \"subject\": \"Computer Science\", \"paper\": \"Component 1 (Computer Systems)\", \"examBoard\": \"OCR\", \"date\": \"2026-05-13\" },\n\n{ \"subject\": \"Mathematics\", \"paper\": \"Paper 1 (Non-Calculator)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-05-14\" },\n\n{ \"subject\": \"Citizenship\", \"paper\": \"Paper 2 (Rights & Responsibilities)\", \"examBoard\": \"OCR\", \"date\": \"2026-05-14\" },\n\n{ \"subject\": \"History\", \"paper\": \"Paper 1 (Understanding the Modern World)\", \"examBoard\": \"AQA\", \"date\": \"2026-05-15\" },\n\n{ \"subject\": \"Chemistry\", \"paper\": \"Paper 1 (Atomic Structure, Bonding, Quantitative Chemistry)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-05-18\" },\n\n{ \"subject\": \"Economics\", \"paper\": \"Paper 1 (Microeconomics)\", \"examBoard\": \"OCR\", \"date\": \"2026-05-18\" },\n\n{ \"subject\": \"English Literature\", \"paper\": \"Paper 2 (Modern Texts & Poetry)\", \"examBoard\": \"AQA\", \"date\": \"2026-05-19\" },\n\n{ \"subject\": \"Computer Science\", \"paper\": \"Component 2 (Algorithms & Programming)\", \"examBoard\": \"OCR\", \"date\": \"2026-05-19\" },\n\n{ \"subject\": \"French\", \"paper\": \"Listening\", \"examBoard\": \"AQA\", \"date\": \"2026-05-20\" },\n\n{ \"subject\": \"Religious Studies\", \"paper\": \"Paper 2 (Themes)\", \"examBoard\": \"AQA\", \"date\": \"2026-05-20\" },\n\n{ \"subject\": \"English Language\", \"paper\": \"Paper 1 (Creative Reading & Writing)\", \"examBoard\": \"AQA\", \"date\": \"2026-05-21\" },\n\n{ \"subject\": \"Physical Education\", \"paper\": \"Component 1 (Fitness & Body Systems)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-05-22\" },\n\n{ \"subject\": \"Physics\", \"paper\": \"Paper 1 (Energy, Electricity, Particle Model)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-06-02\" },\n\n{ \"subject\": \"Mathematics\", \"paper\": \"Paper 2 (Calculator)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-06-03\" },\n\n{ \"subject\": \"Geography\", \"paper\": \"Paper 2 (Human Geography)\", \"examBoard\": \"AQA\", \"date\": \"2026-06-03\" },\n\n{ \"subject\": \"History\", \"paper\": \"Paper 2 (Shaping the Nation)\", \"examBoard\": \"AQA\", \"date\": \"2026-06-04\" },\n\n{ \"subject\": \"French\", \"paper\": \"Reading\", \"examBoard\": \"AQA\", \"date\": \"2026-06-04\" },\n\n{ \"subject\": \"English Language\", \"paper\": \"Paper 2 (Writers’ Viewpoints & Perspectives)\", \"examBoard\": \"AQA\", \"date\": \"2026-06-05\" },\n\n{ \"subject\": \"Music\", \"paper\": \"Listening & Appraising\", \"examBoard\": \"Edexcel\", \"date\": \"2026-06-05\" },\n\n{ \"subject\": \"Biology\", \"paper\": \"Paper 2 (Homeostasis, Ecology, Evolution)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-06-08\" },\n\n{ \"subject\": \"French\", \"paper\": \"Writing\", \"examBoard\": \"AQA\", \"date\": \"2026-06-08\" },\n\n{ \"subject\": \"Spanish\", \"paper\": \"Listening\", \"examBoard\": \"AQA\", \"date\": \"2026-06-09\" },\n\n{ \"subject\": \"Design Technology\", \"paper\": \"Written Exam (Core Technical Principles)\", \"examBoard\": \"AQA\", \"date\": \"2026-06-10\" },\n\n{ \"subject\": \"Mathematics\", \"paper\": \"Paper 3 (Calculator)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-06-10\" },\n\n{ \"subject\": \"Geography\", \"paper\": \"Paper 3 (Fieldwork & Issue Evaluation)\", \"examBoard\": \"AQA\", \"date\": \"2026-06-11\" },\n\n{ \"subject\": \"Chemistry\", \"paper\": \"Paper 2 (Rates, Organic Chemistry, Analysis)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-06-12\" },\n\n{ \"subject\": \"Physics\", \"paper\": \"Paper 2 (Forces, Waves, Magnetism)\", \"examBoard\": \"Edexcel\", \"date\": \"2026-06-15\" },\n\n{ \"subject\": \"Spanish\", \"paper\": \"Reading\", \"examBoard\": \"AQA\", \"date\": \"2026-06-16\" },\n\n{ \"subject\": \"Spanish\", \"paper\": \"Writing\", \"examBoard\": \"AQA\", \"date\": \"2026-06-17\" }\n]";
        const exams = JSON.parse(examsJSON);
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const styleMap = [
            { test: /math/i, icon: "fa-calculator", color: "text-blue-600" },
            { test: /english/i, icon: "fa-book-open", color: "text-amber-600" },
            { test: /bio/i, icon: "fa-dna", color: "text-emerald-600" },
            { test: /chem/i, icon: "fa-flask", color: "text-violet-600" },
            { test: /phys/i, icon: "fa-atom", color: "text-cyan-600" },
            { test: /history/i, icon: "fa-landmark", color: "text-orange-600" },
            { test: /computer|cs/i, icon: "fa-laptop-code", color: "text-indigo-600" },
            { test: /french|spanish/i, icon: "fa-language", color: "text-pink-600" }
        ];
        function getStyle(subject) { return styleMap.find(function(item) { return item.test.test(subject); }) || { icon: "fa-pen-nib", color: "text-slate-500" }; }
        function plural(value, noun) { return value + " " + noun + (value === 1 ? "" : "s"); }
        function escapeHtml(value) { return String(value).replace(/[&<>"']/g, function(ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[ch] || ch; }); }
        function formatDate(dateString) { return new Date(dateString).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" }); }
        const enrichedExams = exams.map(function(exam) {
            const examDay = new Date(exam.date);
            const diffTime = examDay.getTime() - today.getTime();
            return Object.assign({}, exam, { daysRemaining: Math.ceil(diffTime / (1000 * 3600 * 24)) });
        });
        const upcomingExams = enrichedExams.filter(function(exam) { return exam.daysRemaining >= 0; }).sort(function(a, b) { return a.daysRemaining - b.daysRemaining; });
        const pastExams = enrichedExams.filter(function(exam) { return exam.daysRemaining < 0; }).sort(function(a, b) { return b.daysRemaining - a.daysRemaining; });
        function renderEmpty(container, message) { container.innerHTML = '<div class="rounded-lg border border-slate-200 bg-white/80 p-5 text-center text-sm font-bold text-slate-500">' + escapeHtml(message) + '</div>'; }
        function renderExams(examArray, containerId, isPast) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
            if (examArray.length === 0) { renderEmpty(container, isPast ? "No completed exams yet." : "No upcoming exams found."); return; }
            examArray.forEach(function(exam, index) {
                const style = getStyle(exam.subject);
                const isNext = !isPast && index === 0;
                const statusText = isPast ? plural(Math.abs(exam.daysRemaining), "day") + " ago" : exam.daysRemaining === 0 ? "Today" : plural(exam.daysRemaining, "day");
                const card = document.createElement("article");
                card.className = "exam-card " + (isNext ? "is-next " : "") + (isPast ? "is-past " : "") + "p-5 md:p-6";
                card.innerHTML = '<div class="flex items-start justify-between gap-5"><div class="flex min-w-0 gap-4"><div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg border border-slate-200 bg-slate-50 text-xl ' + style.color + '"><i class="fa-solid ' + style.icon + '"></i></div><div class="min-w-0"><div class="flex flex-wrap items-center gap-2"><h3 class="text-lg font-black text-slate-950">' + escapeHtml(exam.subject) + '</h3>' + (isNext ? '<span class="rounded-md bg-blue-50 px-2 py-1 text-[10px] font-black uppercase tracking-[0.16em] text-blue-700">Next</span>' : '') + '</div><p class="mt-2 text-sm font-bold text-slate-700">' + escapeHtml(exam.paper) + '</p><div class="mt-3 flex flex-wrap gap-2 text-[11px] font-black uppercase tracking-[0.14em]"><span class="rounded-md border border-slate-200 bg-slate-50 px-2 py-1 text-slate-600">' + escapeHtml(exam.examBoard) + '</span><span class="rounded-md border border-slate-200 bg-white px-2 py-1 text-slate-500">' + escapeHtml(formatDate(exam.date)) + '</span></div></div></div><div class="shrink-0 text-right"><div class="text-2xl font-black ' + (isPast ? 'text-slate-500' : 'text-slate-950') + '">' + escapeHtml(statusText) + '</div><div class="mt-1 text-[10px] font-black uppercase tracking-[0.16em] text-slate-400">' + (isPast ? 'Completed' : 'Remaining') + '</div></div></div>';
                container.appendChild(card);
            });
        }
        document.getElementById("upcomingCount").textContent = plural(upcomingExams.length, "exam");
        document.getElementById("pastCount").textContent = plural(pastExams.length, "exam");
        if (upcomingExams[0]) {
            const next = upcomingExams[0];
            document.getElementById("nextSummary").innerHTML = '<strong class="block text-lg text-slate-950">' + escapeHtml(next.subject) + '</strong><span class="mt-1 block">' + escapeHtml(next.paper) + '</span><span class="mt-3 inline-flex rounded-md bg-blue-50 px-2 py-1 text-xs font-black text-blue-700">' + escapeHtml(next.daysRemaining === 0 ? "Today" : plural(next.daysRemaining, "day")) + '</span>';
        } else {
            document.getElementById("nextSummary").textContent = "All listed exams have passed.";
        }
        renderExams(upcomingExams, "upcoming-container", false);
        renderExams(pastExams, "past-container", true);
    </script>
    <div id="footer-placeholder"></div>
</body>
</html>
