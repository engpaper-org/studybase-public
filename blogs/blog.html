    <script>
        async function loadBlog() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const category = params.get('category'); // Retrieve category param

            if (!id) {
                showError();
                return;
            }

            // Determine which files to search based on category
            let sources = [];
            
            if (category === 'gcse') {
                sources = ['/assets/data/blogs/gcse.json'];
                updateBreadcrumbs('GCSE', '/blogs/index.html?category=gcse');
            } else if (category === 'alevel') {
                sources = ['/assets/data/blogs/alevel.json'];
                updateBreadcrumbs('A-Level', '/blogs/index.html?category=alevel');
            } else {
                // Fallback: No category provided, check both
                sources = ['/assets/data/blogs/gcse.json', '/assets/data/blogs/alevel.json'];
                updateBreadcrumbs('General', '/blogs/index.html');
            }

            let blogData = null;

            try {
                // Iterate through sources to find the blog ID
                for (const source of sources) {
                    const response = await fetch(source);
                    if (!response.ok) continue; // Skip if file not found
                    
                    const data = await response.json();
                    const found = data.blogs.find(b => b.id === id);
                    
                    if (found) {
                        blogData = found;
                        break; // Stop looking if found
                    }
                }

                if (blogData) {
                    renderBlog(blogData);
                } else {
                    showError();
                }
            } catch (error) {
                console.error("Error fetching blog:", error);
                showError();
            }
        }

        function renderBlog(blog) {
            document.title = `${blog.title} | ${window.SiteConfig?.get("brand.name", "RevisionBase") || "RevisionBase"}`;
            
            // Text Content
            setText('title', blog.title);
            setText('subtitle', blog.subtitle || 'Insight');
            setText('body1', blog.body1);
            
            // Conditional Sections
            handleSection('subtitle2', 'body2', blog.subtitle2, blog.body2);
            handleSection('subtitle3', 'body3', blog.subtitle3, blog.body3);

            // Images
            const hero = document.getElementById('heroImage');
            hero.src = blog.heroImage || '/assets/images/site/home-workflow.jpg';
            hero.onerror = () => hero.src = 'https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=1000'; // Fallback

            if (blog.image2) {
                const img2 = document.getElementById('image2');
                img2.src = blog.image2;
                document.getElementById('image2-container').classList.remove('hidden');
            }

            // Reveal
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('blog-content').classList.remove('hidden');
        }

        function updateBreadcrumbs(name, link) {
            const crumb = document.getElementById('category-crumb');
            crumb.innerText = name;
            crumb.href = link;
            // Adjust Breadcrumb link for blog index with filter
            const blogIndexLink = document.querySelector('a[href="/blogs/index.html"]');
            if(name === 'GCSE') blogIndexLink.href = '/blogs/index.html?category=gcse';
            if(name === 'A-Level') blogIndexLink.href = '/blogs/index.html?category=alevel';
        }

        function setText(id, text) {
            const el = document.getElementById(id);
            if(el) el.innerText = text || '';
        }

        function handleSection(subId, bodyId, subText, bodyText) {
            if (subText && bodyText) {
                setText(subId, subText);
                setText(bodyId, bodyText);
            } else {
                document.getElementById(subId)?.classList.add('hidden');
                document.getElementById(bodyId)?.classList.add('hidden');
            }
        }

        function showError() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('error-message').classList.remove('hidden');
        }

        // Initialize
        loadBlog();
    </script>
