<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/privacy/checkCookieConsent.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Editor • Doc Tools</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
    
    body { font-family: 'Inter', system-ui, sans-serif; }
    
    .editor-textarea {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      line-height: 1.7;
      font-size: 15px;
    }
    
    .doc-item { transition: all 0.1s ease; }
    .doc-item:hover { background-color: #f1f5f9; }
    .doc-item.active { background-color: #e0e7ff; color: #1e40af; font-weight: 600; }

    /* Dark mode for document list */
    #editor-app.dark .doc-item:hover { background-color: #1e293b; }
    #editor-app.dark .doc-item.active { 
      background-color: #1e3a8a; 
      color: #bfdbfe; 
    }

    /* Editor-only dark mode - completely isolated from the rest of the site */
    #editor-app.dark { background-color: #0f172a; color: #f1f5f9; }
    #editor-app.dark .bg-white { background-color: #1e293b; }
    #editor-app.dark .border-slate-200 { border-color: #334155; }
    #editor-app.dark .text-slate-900 { color: #f1f5f9; }
    #editor-app.dark .text-slate-600 { color: #94a3b8; }
    #editor-app.dark .bg-slate-50 { background-color: #1e293b; }

    /* Form controls in dark mode */
    #editor-app.dark #doc-title {
      color: #f1f5f9;
      background-color: #1e293b;
      border-color: #475569;
    }
    #editor-app.dark #doc-title:hover {
      border-color: #64748b;
      background-color: #334155;
    }
    #editor-app.dark #doc-title:focus {
      background-color: #1e293b;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    #editor-app.dark #editor {
      background-color: #0f172a;
      color: #e2e8f0;
    }

    /* Make sure the editor container respects dark mode */
    #editor-app.dark #editor-container {
      background-color: #0f172a;
    }

    /* Force light backgrounds in light mode (stronger override) */
    #editor-app:not(.dark) #rich-toolbar,
    #editor-app:not(.dark) #editor-container,
    #editor-app:not(.dark) .bg-white,
    #editor-app:not(.dark) .bg-slate-50 {
      background-color: #ffffff !important;
    }
    #editor-app:not(.dark) .border-b {
      border-color: #e2e8f0 !important;
    }

    /* Force black text for everything inside the editor in light mode.
       This overrides any light text that was created while in dark mode. */
    #editor-app:not(.dark) #editor,
    #editor-app:not(.dark) #editor * {
      color: #0f172a !important;
    }
  </style>
</head>
<body>
  <div id="editor-app" class="min-h-screen bg-slate-50 text-slate-900">
    
    <!-- Header -->
    <div class="border-b border-slate-200 bg-white dark:bg-slate-800 w-full">
      <div class="px-4 h-14 flex items-center justify-between max-w-screen-2xl mx-auto">
        <div class="flex items-center gap-x-3">
          <a href="/docs/" class="flex items-center gap-x-2 px-3 py-1.5 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Doc Tools</span>
          </a>
          <div class="h-5 w-px bg-slate-200"></div>
          <div class="flex items-center gap-x-2">
            <button onclick="toggleSidebar()" class="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-700" title="Toggle documents sidebar">
              <i data-lucide="panel-left" class="w-4 h-4"></i>
            </button>
            <i data-lucide="file-text" class="w-5 h-5 text-indigo-600"></i>
            <span class="font-semibold text-lg tracking-tight">Text Editor</span>
          </div>
        </div>

        <div class="flex items-center gap-x-2">
          <button onclick="newDocument()" class="flex items-center gap-x-2 px-3 py-1.5 text-sm font-medium border border-slate-200 rounded-lg hover:bg-slate-50">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>New</span>
          </button>

          <button onclick="toggleFocusMode()" class="flex items-center gap-x-2 px-3 py-1.5 text-sm font-medium border border-slate-200 rounded-lg hover:bg-slate-50">
            <i data-lucide="maximize" class="w-4 h-4"></i>
            <span>Focus</span>
          </button>

          <!-- Editor-only theme toggle -->
          <button onclick="toggleTheme()" 
                  class="flex items-center gap-x-2 px-3 py-1.5 text-sm font-medium border border-slate-200 rounded-lg hover:bg-slate-50 min-w-[92px]">
            <i data-lucide="moon" class="w-4 h-4" id="theme-icon"></i>
            <span id="theme-text">Dark</span>
          </button>
        </div>
      </div>
    </div>

    <div class="flex h-[calc(100vh-56px)]">
      
      <!-- Sidebar (collapsible) -->
      <div id="sidebar" class="w-72 border-r border-slate-200 bg-white dark:bg-slate-800 dark:border-slate-700 flex flex-col transition-all duration-200">
        <div class="p-4 border-b border-slate-200">
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Documents</span>
            <button onclick="newDocument()"><i data-lucide="plus-circle" class="w-4 h-4 text-indigo-600 dark:text-indigo-400"></i></button>
          </div>
          <div class="relative">
            <input type="text" id="search-input" placeholder="Search documents..." 
                   class="w-full bg-slate-100 border border-slate-200 text-sm rounded-lg pl-8 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                   oninput="filterDocuments()">
            <i data-lucide="search" class="w-4 h-4 absolute left-2.5 top-2 text-slate-400"></i>
          </div>
        </div>
        <div id="doc-list" class="flex-1 overflow-auto p-2 text-sm"></div>
      </div>

      <!-- Main Editor (takes remaining space) -->
      <div id="main-editor-area" class="flex-1 flex flex-col min-w-0">
        <div class="flex items-center justify-between px-4 py-2 border-b bg-white dark:bg-slate-800">
          <div class="flex items-center gap-x-3">
            <input type="text" id="doc-title" 
                   class="font-medium text-lg focus:outline-none focus:ring-1 focus:ring-indigo-500 rounded px-2 py-0.5 border border-slate-200 bg-slate-50 hover:bg-white focus:bg-white focus:border-indigo-400 transition-colors" 
                   placeholder="Untitled document"
                   onchange="renameCurrentDocument()">
            <span id="last-edited" class="text-xs text-slate-500"></span>
          </div>
          <div class="flex items-center gap-x-1 text-sm">
            <button onclick="duplicateCurrent()" class="px-3 py-1.5 hover:bg-slate-100 rounded">Duplicate</button>
            <button onclick="deleteCurrent()" class="px-3 py-1.5 text-red-600 hover:bg-red-50 rounded">Delete</button>
            <div class="w-px h-5 bg-slate-200 mx-2"></div>

            <!-- Explicit Save to device -->
            <button onclick="saveCurrentDocumentLocally()" 
                    class="px-3 py-1.5 text-xs font-medium flex items-center gap-x-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded transition-colors">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              <span>Save to device</span>
            </button>

            <button onclick="exportDocument('txt')" class="px-3 py-1.5 hover:bg-slate-100 rounded">Export</button>
            <button onclick="showImportModal()" class="px-3 py-1.5 hover:bg-slate-100 rounded">Import</button>
          </div>
        </div>

        <!-- Rich Text Toolbar -->
        <div class="flex items-center gap-1 px-4 py-2 border-b bg-white dark:bg-slate-800 text-sm flex-wrap" id="rich-toolbar">
          <button onclick="formatDoc('bold')" class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded" title="Bold (Ctrl+B)"><strong>B</strong></button>
          <button onclick="formatDoc('italic')" class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded italic" title="Italic (Ctrl+I)">I</button>
          <button onclick="formatDoc('underline')" class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded underline" title="Underline">U</button>
          
          <div class="w-px h-5 bg-slate-300 dark:bg-slate-600 mx-1"></div>
          
          <!-- Much clearer heading buttons with actual size preview -->
          <button onclick="formatDoc('h1')" 
                  class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded flex flex-col items-center text-slate-700 dark:text-slate-200" 
                  title="Heading 1 - Largest title">
            <span class="font-bold text-xl leading-none">Aa</span>
            <span class="text-[9px] font-bold tracking-widest mt-0.5">H1</span>
          </button>
          <button onclick="formatDoc('h2')" 
                  class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded flex flex-col items-center text-slate-700 dark:text-slate-200" 
                  title="Heading 2 - Section title">
            <span class="font-semibold text-lg leading-none">Aa</span>
            <span class="text-[9px] font-semibold tracking-widest mt-0.5">H2</span>
          </button>
          <button onclick="formatDoc('h3')" 
                  class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded flex flex-col items-center text-slate-700 dark:text-slate-200" 
                  title="Heading 3 - Subsection">
            <span class="font-medium text-base leading-none">Aa</span>
            <span class="text-[9px] font-medium tracking-widest mt-0.5">H3</span>
          </button>

          <div class="w-px h-5 bg-slate-300 dark:bg-slate-600 mx-1"></div>

          <button onclick="formatDoc('insertUnorderedList')" class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded flex items-center gap-1" title="Bullet List">
            <i data-lucide="list" class="w-4 h-4"></i>
            <span class="hidden sm:inline text-xs">Bullets</span>
          </button>
          <button onclick="formatDoc('insertOrderedList')" class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded flex items-center gap-1" title="Numbered List">
            <i data-lucide="list-ordered" class="w-4 h-4"></i>
            <span class="hidden sm:inline text-xs">Numbers</span>
          </button>

          <div class="w-px h-5 bg-slate-300 dark:bg-slate-600 mx-1"></div>

          <button onclick="insertTable()" class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded flex items-center gap-1" title="Insert Table">
            <span>Table</span>
          </button>

          <button onclick="formatDoc('removeFormat')" class="px-2 py-1 hover:bg-slate-200 dark:hover:bg-slate-700 rounded text-xs" title="Clear Formatting">Clear</button>
        </div>

        <div class="flex-1 flex overflow-hidden bg-white dark:bg-slate-900" id="editor-container">
          <div id="editor" contenteditable="true"
               class="editor-textarea flex-1 w-full p-6 md:p-10 focus:outline-none text-[15.5px] leading-relaxed overflow-auto"
               style="min-height: 400px;"
               placeholder="Start writing..."></div>

          <div id="markdown-preview" 
               class="hidden flex-1 p-8 overflow-auto bg-slate-50 dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 prose prose-slate dark:prose-invert"></div>
        </div>

        <div class="h-9 border-t bg-white dark:bg-slate-800 px-4 flex items-center text-xs text-slate-500 dark:text-slate-400 gap-x-4">
          <div class="flex items-center gap-x-3">
            <span id="word-count">0 words</span> • 
            <span id="char-count">0 characters</span> • 
            <span id="reading-time">0 min read</span>
          </div>

          <!-- QOL Controls -->
          <div class="flex items-center gap-x-2 ml-4 border-l pl-4">
            <!-- Font Size -->
            <div class="flex items-center gap-x-1 text-slate-400">
              <span class="text-[10px] font-medium">A</span>
              <button id="font-size-small" onclick="setFontSize('small')" class="px-1.5 py-0.5 hover:bg-slate-100 rounded text-xs">S</button>
              <button id="font-size-medium" onclick="setFontSize('medium')" class="px-1.5 py-0.5 hover:bg-slate-100 rounded text-xs font-semibold">M</button>
              <button id="font-size-large" onclick="setFontSize('large')" class="px-1.5 py-0.5 hover:bg-slate-100 rounded text-xs">L</button>
            </div>

            <!-- Word Wrap -->
            <button onclick="toggleWordWrap()" id="wrap-btn"
                    class="px-2 py-0.5 text-xs hover:bg-slate-100 rounded flex items-center gap-x-1" title="Toggle word wrap">
              <i data-lucide="wrap-text" class="w-3.5 h-3.5"></i>
              <span class="hidden sm:inline">Wrap</span>
            </button>
          </div>

          <div class="ml-auto flex gap-x-4">
            <button onclick="toggleMarkdownPreview()" class="hover:text-slate-700 flex items-center gap-x-1">
              <i data-lucide="eye" class="w-3.5 h-3.5"></i> <span>Preview</span>
            </button>
            <button onclick="showSearchReplace()" class="hover:text-slate-700 flex items-center gap-x-1">
              <i data-lucide="search" class="w-3.5 h-3.5"></i> <span>Find &amp; Replace</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Import Modal -->
  <div id="import-modal" onclick="hideImportModal()" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
    <div onclick="event.stopImmediatePropagation()" class="bg-white rounded-2xl p-6 w-full max-w-md">
      <h3 class="font-semibold text-lg mb-4">Import Document</h3>
      <input type="file" id="import-file" accept=".txt,.md,.html" class="mb-4">
      <div class="flex justify-end gap-x-3">
        <button onclick="hideImportModal()" class="px-4 py-2 text-sm rounded-lg hover:bg-slate-100">Cancel</button>
        <button onclick="importDocument()" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Import</button>
      </div>
    </div>
  </div>

  <!-- Recovery Modal -->
  <div id="recovery-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center">
    <div onclick="event.stopImmediatePropagation()" class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-md shadow-xl">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900 flex items-center justify-center flex-shrink-0">
          <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600 dark:text-amber-400"></i>
        </div>
        <div class="flex-1">
          <h3 class="font-semibold text-lg">Recover unsaved changes?</h3>
          <p id="recovery-message" class="text-sm text-slate-600 dark:text-slate-400 mt-1">
            You had unsaved changes in a document when you last closed this page.
          </p>
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="discardRecovery()" 
                class="flex-1 px-4 py-2.5 text-sm font-medium rounded-xl border border-slate-300 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700">
          Discard
        </button>
        <button onclick="recoverDocument()" 
                class="flex-1 px-4 py-2.5 text-sm font-medium rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white">
          Recover Changes
        </button>
      </div>
    </div>
  </div>

  <!-- Load JS in correct order (main first for shared state) -->
  <script src="js/main.js"></script>
  <script src="js/documents.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
