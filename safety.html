<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                const isDark = String(localStorage.getItem('darkMode') || '').toLowerCase() === 'true';
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/assets/css/dark-mode.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Notice | StudyBase</title>

    <!--Cookie consent banner and google analytics-->
    <script src="/assets/js/checkCookieConsent.js"></script>

    <script>
        window.dataLayer = window.dataLayer || [];
     function gtag(){dataLayer.push(arguments);}

        // 1. Determine current state
        const hasConsented = localStorage.getItem('site_consent_granted') === 'true';

        // 2. Set default based on that state
        gtag('consent', 'default', {
            'ad_storage': hasConsented ? 'granted' : 'denied',
            'ad_user_data': hasConsented ? 'granted' : 'denied',
            'ad_personalization': hasConsented ? 'granted' : 'denied',
            'analytics_storage': hasConsented ? 'granted' : 'denied'
        });

        gtag('js', new Date());
        gtag('config', 'G-N7LHC0S1T1');
    </script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N7LHC0S1T1"></script>

    <script src="/assets/js/cookieConsent.js"></script>
    <!-- End of consent and analytics -->

    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/assets/siteIcons/main.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        #page2 { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 100; }
        @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-enter { animation: fade-in-up 0.6s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 shadow-sm border-b border-blue-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-center h-16 items-center">
                <div class="text-xl md:text-2xl font-extrabold text-blue-600 tracking-tight">
                    StudyBase<span class="text-slate-400">.site</span>
                    <span class="text-slate-800 font-semibold ml-2">Safety Portal</span>
                </div>
            </div>
        </div>
    </nav>

    <div id="page1" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 max-w-lg w-full text-left animate-enter">

            <div id="iconContainer" class="w-16 h-16 bg-blue-50 border border-blue-200 text-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-sm">
                <i id="mainIcon" class="fas fa-shield-alt text-2xl"></i>
            </div>

            <h1 class="text-3xl font-bold text-slate-900 mb-2 text-center">Content Notice</h1>
            <p class="text-slate-500 text-center mb-6">Review the following safety information.</p>

            <div class="bg-slate-50 rounded-xl p-5 mb-6 border border-slate-100">
                <p class="text-slate-700 font-semibold mb-3">Important for <span id="serviceDisplay" class="text-blue-600">this content</span>:</p>
                <ul id="warningList" class="space-y-4 text-slate-600 text-sm"></ul>
            </div>

            <button id="continueButton" disabled
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition-all duration-300 transform active:scale-95
                       disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed disabled:transform-none">
                Please wait (3s)
            </button>

            <p class="text-slate-400 text-[10px] text-center mt-4 uppercase tracking-widest font-semibold">Study Base Safety Protocol</p>
        </div>
    </div>

    <div id="page2" class="hidden bg-slate-900">
        <iframe id="serviceFrame" src="about:blank" class="w-full h-full border-0" allowfullscreen></iframe>
    </div>

    <script>
        const warningData = {
            '01': { icon: 'fa-users', title: 'Online Interaction', desc: 'Interact with others safely. Never share personal details.' },
            '02': { icon: 'fa-external-link-alt', title: 'External Service', desc: 'Not owned by study base. Their specific terms and policies apply.' },
            '03': { icon: 'fa-microchip', title: 'High Resource Usage', desc: 'Requires significant power; may lag on older devices.' },
            '04': { icon: 'fa-bolt', title: 'Photosensitivity', desc: 'Warning: Contains flashing lights or patterns.' },
            '05': { icon: 'fa-ghost', title: 'Disturbing Content', desc: 'May contain horror elements or jumpscares.' },
            '06': { icon: 'fa-exclamation-circle', title: 'Mature Language', desc: 'Contains strong language or adult themes.' },
            '07': { icon: 'fa-user-edit', title: 'User Content', desc: 'Content is user-created and not actively moderated.' },
            '08': { icon: 'fa-fire', title: 'Overheating Risk', desc: 'May cause device to run hot or drain battery quickly.' }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const types = urlParams.get('types') ? urlParams.get('types').split(',') : [];
        const serviceUrl = urlParams.get('url');
        const provider = urlParams.get('provider');
        const name = urlParams.get('name') || 'External Content';

        const warningList = document.getElementById('warningList');
        const serviceDisplay = document.getElementById('serviceDisplay');
        const continueButton = document.getElementById('continueButton');
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const serviceFrame = document.getElementById('serviceFrame');
        const mainIcon = document.getElementById('mainIcon');

        // --- Check content warning setting ---
// --- Check content warning setting ---
const showWarningsSetting = (localStorage.getItem("sb_showContentWarnings") || "").toLowerCase().trim();
// Default = enabled if not set
const showWarnings = showWarningsSetting !== "false";

if (!showWarnings && serviceUrl) {
    // Skip warning screen completely
    page1.classList.add("hidden");
    page2.classList.remove("hidden");
    serviceFrame.src = serviceUrl;

    // IMPORTANT: don't run the rest of the warning-page logic
} else {
    // normal behaviour continues below

        serviceDisplay.textContent = provider || name;

        if (types.length > 0) {
            mainIcon.className = `fas ${warningData[types[0].trim()]?.icon || 'fa-info-circle'} text-2xl`;
            types.forEach(type => {
                const data = warningData[type.trim()];
                if (data) {
                    const li = document.createElement('li');
                    li.className = 'flex gap-3 animate-enter';
                    li.innerHTML = `<i class="fas ${data.icon} text-blue-500 mt-1 w-5 text-center"></i><span><strong>${data.title}:</strong> ${data.desc}</span>`;
                    warningList.appendChild(li);
                }
            });
        }

        let countdown = 3;
        const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                continueButton.textContent = `Please wait (${countdown}s)`;
            } else {
                clearInterval(timer);
                continueButton.disabled = false;
                continueButton.textContent = `Continue to ${name}`;
            }
        }, 1000);

        continueButton.addEventListener('click', () => {
            page1.classList.add('hidden');
            page2.classList.remove('hidden');
            serviceFrame.src = serviceUrl;
        });
    }
    </script>
</body>
</html>
