<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Countdowns | StudyBase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-grid-slate { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='%23f1f5f9'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e"); }
    </style>
</head>
<body class="bg-[#f4f7f9] text-slate-800 min-h-screen relative">
    <div class="absolute inset-0 bg-grid-slate pointer-events-none -z-10"></div>

    <div class="max-w-6xl mx-auto px-6 py-12">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-6">
            <div>
                <a href="/toolkit/index.html" class="text-fuchsia-500 font-bold text-sm flex items-center mb-4 hover:text-fuchsia-600 transition-colors">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Back to Toolkit
                </a>
                <h1 class="text-3xl font-black text-slate-900">Exam Countdowns</h1>
                <p class="text-slate-500 mt-1">Track exactly how much time you have left for each specific paper.</p>
            </div>
            
            <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 flex items-center gap-2 w-full md:w-auto">
                <input type="text" id="exam-name" placeholder="Paper Name (e.g. AQA Bio P1)" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 outline-none focus:border-fuchsia-400 text-sm font-bold w-full md:w-48">
                <input type="date" id="exam-date" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 outline-none focus:border-fuchsia-400 text-sm text-slate-500">
                <button onclick="addCountdown()" class="bg-fuchsia-100 hover:bg-fuchsia-200 text-fuchsia-700 w-10 h-10 rounded-xl flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>

        <div id="countdown-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

    </div>

    <script>
        let countdowns = [];
        let timerInterval;

        function addCountdown() {
            const name = document.getElementById('exam-name').value.trim();
            const dateVal = document.getElementById('exam-date').value;
            
            if(!name || !dateVal) return alert("Please enter both a name and a date.");
            
            // Set time to 9:00 AM on the exam day
            const targetDate = new Date(dateVal + 'T09:00:00').getTime();
            
            countdowns.push({ id: Date.now(), name, targetDate });
            
            document.getElementById('exam-name').value = '';
            document.getElementById('exam-date').value = '';
            
            renderCountdowns();
            if(!timerInterval) timerInterval = setInterval(updateAllCountdowns, 1000);
        }

        function removeCountdown(id) {
            countdowns = countdowns.filter(c => c.id !== id);
            renderCountdowns();
        }

        function renderCountdowns() {
            const grid = document.getElementById('countdown-grid');
            grid.innerHTML = '';
            
            countdowns.forEach(item => {
                grid.innerHTML += `
                    <div id="card-${item.id}" class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 relative group animate-[fadeIn_0.3s_ease-out]">
                        <button onclick="removeCountdown(${item.id})" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-trash text-sm"></i>
                        </button>
                        <div class="w-12 h-12 bg-fuchsia-100 text-fuchsia-600 rounded-2xl flex items-center justify-center text-xl mb-4">
                            <i class="fa-solid fa-hourglass-half animate-pulse"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-900 mb-4 truncate pr-6" title="${item.name}">${item.name}</h3>
                        <div class="flex justify-between items-center bg-slate-50 rounded-xl p-3 border border-slate-100 text-center">
                            <div><div id="d-${item.id}" class="text-2xl font-black text-fuchsia-600">--</div><div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Days</div></div>
                            <div class="text-slate-300 font-black">:</div>
                            <div><div id="h-${item.id}" class="text-2xl font-black text-slate-700">--</div><div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hrs</div></div>
                            <div class="text-slate-300 font-black">:</div>
                            <div><div id="m-${item.id}" class="text-2xl font-black text-slate-700">--</div><div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Mins</div></div>
                        </div>
                    </div>
                `;
            });
            updateAllCountdowns();
        }

        function updateAllCountdowns() {
            const now = new Date().getTime();
            
            countdowns.forEach(item => {
                const distance = item.targetDate - now;
                
                const dEl = document.getElementById(`d-${item.id}`);
                const hEl = document.getElementById(`h-${item.id}`);
                const mEl = document.getElementById(`m-${item.id}`);
                
                if(!dEl) return;

                if(distance < 0) {
                    dEl.innerText = "0"; hEl.innerText = "0"; mEl.innerText = "0";
                    dEl.classList.replace('text-fuchsia-600', 'text-emerald-500');
                    return;
                }
                
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                
                dEl.innerText = days;
                hEl.innerText = hours.toString().padStart(2, '0');
                mEl.innerText = minutes.toString().padStart(2, '0');
            });
        }
    </script>
</body>
</html>
