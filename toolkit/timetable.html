<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Generator | StudyBase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/assets/siteIcons/main.ico">
  <script src="/assets/js/navbar.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-grid-slate { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='%23f1f5f9'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e"); }
    </style>
</head>
<body class="bg-[#f4f7f9] text-slate-800 min-h-screen relative">
    <div class="absolute inset-0 bg-grid-slate pointer-events-none -z-10"></div>

    <div class="max-w-7xl mx-auto px-6 py-12 flex flex-col lg:flex-row gap-8">
        
        <div class="w-full lg:w-1/3 bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 h-fit">
            <a href="/toolkit/index.html" class="text-blue-500 font-bold text-sm flex items-center mb-6 hover:text-blue-600 transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to Toolkit
            </a>
            <h2 class="text-2xl font-black mb-2">Timetable Builder</h2>
            <p class="text-slate-500 text-sm mb-6">Add your subjects and allocate weekly hours.</p>

            <div id="subject-inputs" class="space-y-4 mb-6">
                </div>

            <button onclick="addSubjectInput()" class="w-full border-2 border-dashed border-slate-300 text-slate-500 hover:border-blue-500 hover:text-blue-600 font-bold py-3 rounded-xl transition-colors mb-6">
                + Add Subject
            </button>

            <button onclick="generateTimetable()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-md transition-all">
                Generate Schedule
            </button>
        </div>

        <div class="w-full lg:w-2/3 bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 overflow-x-auto">
            <div class="flex justify-between items-center mb-6 min-w-[600px]">
                <h3 class="text-xl font-bold text-slate-800">Your Weekly Plan</h3>
                <button onclick="window.print()" class="text-slate-500 hover:text-blue-600 font-bold text-sm bg-slate-100 px-4 py-2 rounded-lg transition-colors">
                    <i class="fa-solid fa-print mr-2"></i> Print
                </button>
            </div>

            <div id="timetable-grid" class="grid grid-cols-7 gap-2 min-w-[600px]">
                <div class="font-bold text-center text-slate-400 text-sm py-2">Mon</div>
                <div class="font-bold text-center text-slate-400 text-sm py-2">Tue</div>
                <div class="font-bold text-center text-slate-400 text-sm py-2">Wed</div>
                <div class="font-bold text-center text-slate-400 text-sm py-2">Thu</div>
                <div class="font-bold text-center text-slate-400 text-sm py-2">Fri</div>
                <div class="font-bold text-center text-slate-400 text-sm py-2">Sat</div>
                <div class="font-bold text-center text-slate-400 text-sm py-2">Sun</div>
                
                </div>
            
            <div id="calendar-empty" class="text-center py-20 text-slate-400">
                <i class="fa-regular fa-calendar text-5xl mb-4 text-slate-200"></i>
                <p class="font-medium">Add subjects and click generate to build your plan.</p>
            </div>
        </div>
    </div>

    <script>
        const colors = ['bg-blue-100 text-blue-700 border-blue-200', 'bg-purple-100 text-purple-700 border-purple-200', 'bg-emerald-100 text-emerald-700 border-emerald-200', 'bg-rose-100 text-rose-700 border-rose-200', 'bg-amber-100 text-amber-700 border-amber-200'];
        let colorIndex = 0;

        function addSubjectInput() {
            const container = document.getElementById('subject-inputs');
            const div = document.createElement('div');
            div.className = "flex gap-2 animate-[fadeIn_0.2s_ease-out]";
            div.innerHTML = `
                <input type="text" placeholder="Subject name" class="subject-name flex-1 bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 outline-none focus:border-blue-500 font-medium text-sm">
                <input type="number" placeholder="Hrs" min="1" max="10" class="subject-hours w-20 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 outline-none focus:border-blue-500 text-sm">
                <button onclick="this.parentElement.remove()" class="w-10 flex items-center justify-center text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
            `;
            container.appendChild(div);
        }

        function generateTimetable() {
            const names = document.querySelectorAll('.subject-name');
            const hours = document.querySelectorAll('.subject-hours');
            let subjects = [];

            names.forEach((input, index) => {
                const name = input.value.trim();
                const hrs = parseInt(hours[index].value);
                if (name && hrs > 0) {
                    subjects.push({ name, hrs, color: colors[colorIndex % colors.length] });
                    colorIndex++;
                }
            });

            if (subjects.length === 0) return alert("Please add at least one subject with hours.");

            const grid = document.getElementById('timetable-grid');
            document.getElementById('calendar-empty').classList.add('hidden');
            
            // Clear previous entries (keep headers)
            while (grid.children.length > 7) {
                grid.removeChild(grid.lastChild);
            }

            // Simple distribution algorithm for visual mockup
            let blocks = [];
            subjects.forEach(sub => {
                for(let i=0; i<sub.hrs; i++) {
                    blocks.push(sub);
                }
            });
            
            // Shuffle blocks slightly for a realistic spread
            blocks = blocks.sort(() => 0.5 - Math.random());

            // Assuming 3 study blocks a day max for visual simplicity (21 total slots)
            for (let i = 0; i < 21; i++) {
                const blockDiv = document.createElement('div');
                blockDiv.className = "h-20 rounded-xl border p-2 text-xs font-bold flex flex-col justify-center items-center text-center transition-all hover:scale-105 cursor-default ";
                
                if (blocks[i]) {
                    blockDiv.className += blocks[i].color;
                    blockDiv.innerHTML = `<span class="truncate w-full">${blocks[i].name}</span><span class="opacity-60 mt-1">1 hr</span>`;
                } else {
                    blockDiv.className += "bg-slate-50 border-slate-100 text-slate-300";
                    blockDiv.innerText = "Free";
                }
                grid.appendChild(blockDiv);
            }
        }

        // Init with 3 slots
        addSubjectInput(); addSubjectInput(); addSubjectInput();
    </script>
</body>
</html>
