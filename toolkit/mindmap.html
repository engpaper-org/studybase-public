<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Map Sandbox | StudyBase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
        
        /* Grid Canvas */
        #canvas {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            cursor: crosshair;
        }

        /* Draggable Nodes */
        .node {
            position: absolute;
            background: white;
            border: 2px solid #84cc16; /* Lime 500 */
            border-radius: 12px;
            padding: 10px 16px;
            min-width: 120px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            cursor: grab;
            user-select: none;
        }
        .node:active { cursor: grabbing; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); z-index: 50; }
        .node-input {
            width: 100%; border: none; outline: none; font-weight: bold; color: #1e293b; background: transparent; text-align: center;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col selection:bg-lime-200 selection:text-lime-900">

    <div class="h-16 border-b border-slate-200 flex items-center justify-between px-6 bg-white z-10 shadow-sm">
        <a href="/toolkit/index.html" class="text-lime-600 hover:text-lime-500 font-bold text-sm flex items-center transition-colors">
            <i class="fa-solid fa-arrow-left mr-2"></i> Toolkit
        </a>
        <div class="flex items-center gap-4">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest"><i class="fa-solid fa-computer-mouse mr-1"></i> Double-click canvas to add node</span>
            <button onclick="clearCanvas()" class="text-slate-400 hover:text-red-500 text-sm font-bold transition-colors ml-4 border-l border-slate-200 pl-4">
                Clear
            </button>
        </div>
    </div>

    <div id="canvas" class="flex-1 relative w-full h-full overflow-hidden">
        <div class="node" style="left: calc(50% - 75px); top: calc(50% - 25px);">
            <input type="text" class="node-input" value="Main Topic" placeholder="Topic...">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        let isDragging = false;
        let activeNode = null;
        let offsetX, offsetY;

        // 1. Create Nodes on Double Click
        canvas.addEventListener('dblclick', function(e) {
            if (e.target.classList.contains('node') || e.target.classList.contains('node-input')) return;
            
            const node = document.createElement('div');
            node.className = 'node animate-[fadeIn_0.2s_ease-out]';
            node.style.left = e.clientX - 75 + 'px'; // Center roughly
            node.style.top = e.clientY - 64 - 25 + 'px'; // Offset for header (64px) and node height
            
            node.innerHTML = `<input type="text" class="node-input" placeholder="Subtopic..." autofocus>`;
            canvas.appendChild(node);
        });

        // 2. Drag Logic
        canvas.addEventListener('mousedown', function(e) {
            if (e.target.classList.contains('node') || (e.target.classList.contains('node-input') && document.activeElement !== e.target)) {
                isDragging = true;
                activeNode = e.target.classList.contains('node') ? e.target : e.target.parentElement;
                
                // Calculate offset
                const rect = activeNode.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
            }
        });

        document.addEventListener('mousemove', function(e) {
            if (isDragging && activeNode) {
                // Prevent going off top navbar
                let newY = e.clientY - offsetY - 64; 
                if (newY < 0) newY = 0;

                activeNode.style.left = (e.clientX - offsetX) + 'px';
                activeNode.style.top = newY + 'px';
            }
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
            activeNode = null;
        });

        function clearCanvas() {
            if(confirm("Clear entire mind map?")) {
                canvas.innerHTML = '';
            }
        }
    </script>
</body>
</html>
