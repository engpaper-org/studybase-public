<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
        <script src="/assets/js/siteConfig.js"></script>
<script>
        (function () {
            try {
                const isDark = String(localStorage.getItem('darkMode') || '').toLowerCase() === 'true';
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/assets/css/dark-mode.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Builder | RevisionBase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/assets/siteIcons/main.ico">
  <script src="/assets/js/navbar.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* 3D Flip Effects */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .bg-grid-slate {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='%23f1f5f9'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen relative">
    <div class="absolute inset-0 bg-grid-slate pointer-events-none -z-10"></div>

    <div class="max-w-6xl mx-auto px-6 py-12 flex flex-col md:flex-row gap-10">
        
        <div class="w-full md:w-1/3 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-fit">
            <a href="/toolkit/index.html" class="text-purple-500 font-bold text-sm flex items-center mb-6 hover:text-purple-600">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to Toolkit
            </a>
            <h2 class="text-2xl font-black mb-6">Create Cards</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">Front (Question)</label>
                    <textarea id="card-front" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-purple-500 resize-none h-24"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">Back (Answer)</label>
                    <textarea id="card-back" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-purple-500 resize-none h-24"></textarea>
                </div>
                <button onclick="addCard()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition-colors">
                    Add to Deck
                </button>
            </div>
            
            <div class="mt-8 pt-6 border-t border-slate-100 flex justify-between items-center">
                <span class="text-sm font-bold text-slate-500">Total Cards: <span id="card-count" class="text-purple-600">0</span></span>
                <button onclick="clearDeck()" class="text-xs text-red-500 font-bold hover:underline">Clear Deck</button>
            </div>
        </div>

        <div class="w-full md:w-2/3 flex flex-col items-center justify-center min-h-[500px]">
            
            <div id="empty-state" class="text-center text-slate-400">
                <i class="fa-solid fa-layer-group text-6xl mb-4 text-slate-200"></i>
                <p class="font-medium">Your deck is empty. Add a card to start studying.</p>
            </div>

            <div id="card-container" class="hidden w-full max-w-lg perspective-1000 cursor-pointer" onclick="flipCard()">
                <div id="active-card" class="relative w-full h-80 transition-transform duration-500 transform-style-3d shadow-xl rounded-3xl">
                    
                    <div class="absolute inset-0 w-full h-full bg-white border border-slate-200 rounded-3xl backface-hidden flex flex-col items-center justify-center p-8 text-center">
                        <span class="absolute top-4 left-6 text-xs font-bold text-slate-400 uppercase tracking-widest">Question</span>
                        <h3 id="display-front" class="text-2xl font-bold text-slate-800"></h3>
                        <span class="absolute bottom-6 text-sm text-slate-400 font-medium"><i class="fa-solid fa-hand-pointer mr-1"></i> Click to flip</span>
                    </div>

                    <div class="absolute inset-0 w-full h-full bg-purple-600 rounded-3xl backface-hidden rotate-y-180 flex flex-col items-center justify-center p-8 text-center text-white">
                        <span class="absolute top-4 left-6 text-xs font-bold text-purple-300 uppercase tracking-widest">Answer</span>
                        <h3 id="display-back" class="text-xl font-medium"></h3>
                    </div>

                </div>
            </div>

            <div id="controls" class="hidden mt-8 flex items-center gap-6 bg-white px-6 py-3 rounded-full border border-slate-200 shadow-sm">
                <button onclick="prevCard()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 transition-colors"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="card-progress" class="font-bold text-slate-600 text-sm w-16 text-center">1 / 1</span>
                <button onclick="nextCard()" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

        </div>
    </div>

    <script>
        let deck = [];
        let currentIndex = 0;
        let isFlipped = false;

        function addCard() {
            const front = document.getElementById('card-front').value.trim();
            const back = document.getElementById('card-back').value.trim();
            if(!front || !back) return alert("Please fill out both sides of the card.");
            
            deck.push({ front, back });
            document.getElementById('card-front').value = '';
            document.getElementById('card-back').value = '';
            
            document.getElementById('card-count').innerText = deck.length;
            if(deck.length === 1) {
                currentIndex = 0;
                updateView();
            } else {
                updateProgress();
            }
        }

        function updateView() {
            if(deck.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('card-container').classList.add('hidden');
                document.getElementById('controls').classList.add('hidden');
                return;
            }
            
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('card-container').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            
            isFlipped = false;
            document.getElementById('active-card').classList.remove('rotate-y-180');
            
            setTimeout(() => {
                document.getElementById('display-front').innerText = deck[currentIndex].front;
                document.getElementById('display-back').innerText = deck[currentIndex].back;
                updateProgress();
            }, 150); // wait for un-flip animation
        }

        function updateProgress() {
            document.getElementById('card-progress').innerText = `${currentIndex + 1} / ${deck.length}`;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            const card = document.getElementById('active-card');
            if(isFlipped) {
                card.classList.add('rotate-y-180');
            } else {
                card.classList.remove('rotate-y-180');
            }
        }

        function nextCard() {
            if(deck.length === 0) return;
            currentIndex = (currentIndex + 1) % deck.length;
            updateView();
        }

        function prevCard() {
            if(deck.length === 0) return;
            currentIndex = (currentIndex - 1 + deck.length) % deck.length;
            updateView();
        }

        function clearDeck() {
            deck = [];
            currentIndex = 0;
            document.getElementById('card-count').innerText = 0;
            updateView();
        }
    </script>
</body>
</html>
