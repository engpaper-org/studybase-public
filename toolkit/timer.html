<!DOCTYPE html>
<html lang="en">
<head>
    
  <meta charset="UTF-8" />
    <script>
        (function () {
            try {
                const isDark = String(localStorage.getItem('darkMode') || '').toLowerCase() === 'true';
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/assets/css/dark-mode.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/assets/siteIcons/main.ico">
  <script src="/assets/js/navbar.js" defer></script>
  <style>
    :root {
      --bg1: #1f1147;
      --bg2: #ff5f6d;
      --bg3: #ffc371;
      --panel: rgba(255,255,255,0.11);
      --panel-border: rgba(255,255,255,0.18);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.78);
      --accent: #fff4e8;
      --accent-text: #38150d;
      --glow: rgba(255, 187, 120, 0.34);
      --bar: linear-gradient(90deg, #fff7ed, #ffd29d, #ff8a80);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 18%, color-mix(in srgb, var(--bg3) 45%, transparent), transparent 24%),
        radial-gradient(circle at 85% 20%, color-mix(in srgb, var(--bg2) 50%, transparent), transparent 26%),
        radial-gradient(circle at 50% 85%, color-mix(in srgb, var(--bg1) 36%, white 8%), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      overflow: hidden;
      transition: background 0.35s ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 34vw;
      height: 34vw;
      border-radius: 999px;
      filter: blur(48px);
      opacity: 0.26;
      pointer-events: none;
      animation: blobFloat 16s ease-in-out infinite;
    }

    body::before {
      top: -8vw;
      left: -7vw;
      background: color-mix(in srgb, var(--bg2) 70%, white 8%);
    }

    body::after {
      right: -8vw;
      bottom: -10vw;
      background: color-mix(in srgb, var(--bg3) 70%, white 6%);
      animation-delay: -8s;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(1.8vw, 1.8vw) scale(1.08); }
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow:
        0 18px 55px rgba(0,0,0,0.18),
        inset 0 1px 0 rgba(255,255,255,0.10);
    }

    .status {
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .timer-wrap {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      text-shadow:
        0 10px 30px rgba(0,0,0,0.18),
        0 0 36px var(--glow);
      line-height: 0.92;
      user-select: none;
    }

    .time-part {
      display: inline-block;
      min-width: 2.15ch;
      text-align: center;
    }

    .time-colon {
      display: inline-block;
      opacity: 0.72;
      margin: 0 0.06em;
      transform: translateY(-0.02em);
      font-weight: 500;
    }

    .control-fade {
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }

    .hidden-ui {
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      pointer-events: none;
      position: absolute;
    }

    .shown-ui {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
      position: relative;
    }

    .theme-menu {
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s ease;
      transform-origin: top center;
    }

    .theme-menu.hidden {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.98);
      pointer-events: none;
    }

    .theme-swatch {
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
      flex: 0 0 auto;
    }

    .progress-wrap {
      width: min(88vw, 920px);
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 999px;
      background: var(--bar);
      transition: width 0.16s linear;
      box-shadow: 0 0 20px rgba(255,255,255,0.22);
    }

    .btn {
      transition:
        transform 0.16s ease,
        background-color 0.16s ease,
        border-color 0.16s ease,
        filter 0.16s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .primary-btn {
      background: var(--accent);
      color: var(--accent-text);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow:
        0 12px 28px rgba(0,0,0,0.16),
        inset 0 1px 0 rgba(255,255,255,0.76);
    }

    .secondary-btn {
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .secondary-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.22);
    }

    .primary-btn:hover {
      filter: brightness(1.03);
    }

    .time-input {
      width: clamp(78px, 10vw, 110px);
      background: transparent;
      border: 0;
      outline: none;
      color: white;
      text-align: center;
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .time-input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    .sep {
      opacity: 0.56;
      font-size: clamp(1.4rem, 2.3vw, 1.95rem);
      font-weight: 400;
      transform: translateY(-1px);
    }

    .done {
      animation: donePulse 0.9s ease 4;
    }

    @keyframes donePulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.015); opacity: 0.78; }
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }

    @media (max-width: 640px) {
      .theme-menu {
        width: min(92vw, 360px);
      }
    }
  </style>
</head>
<body>
  <main class="relative h-screen w-screen flex flex-col items-center justify-center px-4">
    <div class="absolute top-4 sm:top-6 left-1/2 -translate-x-1/2 z-20">
      <div class="relative">
        <button id="themeToggle" class="glass btn rounded-full h-11 px-4 sm:px-5 flex items-center gap-3 text-sm font-semibold">
          <span id="themePreview" class="theme-swatch"></span>
          <span id="themeLabel">Sunset</span>
          <svg class="w-4 h-4 opacity-80" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.51a.75.75 0 01-1.08 0l-4.25-4.51a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
          </svg>
        </button>

        <div id="themeMenu" class="theme-menu hidden glass absolute top-full mt-3 left-1/2 -translate-x-1/2 w-[340px] rounded-3xl p-2">
          <button class="theme-option btn w-full rounded-2xl px-3 py-3 flex items-center gap-3 text-left hover:bg-white/10" data-theme="sunset">
            <span class="theme-swatch" style="background: linear-gradient(135deg,#1f1147,#ff5f6d,#ffc371)"></span>
            <span class="flex-1">
              <span class="block font-semibold">Sunset</span>
              <span class="block text-xs text-white/65">Warm, playful, bright</span>
            </span>
          </button>

          <button class="theme-option btn w-full rounded-2xl px-3 py-3 flex items-center gap-3 text-left hover:bg-white/10" data-theme="ocean">
            <span class="theme-swatch" style="background: linear-gradient(135deg,#082032,#2c74b3,#00c2ff)"></span>
            <span class="flex-1">
              <span class="block font-semibold">Ocean</span>
              <span class="block text-xs text-white/65">Cool, clean, lively</span>
            </span>
          </button>

          <button class="theme-option btn w-full rounded-2xl px-3 py-3 flex items-center gap-3 text-left hover:bg-white/10" data-theme="berry">
            <span class="theme-swatch" style="background: linear-gradient(135deg,#2a1037,#8b1e5d,#ff4f8b)"></span>
            <span class="flex-1">
              <span class="block font-semibold">Berry</span>
              <span class="block text-xs text-white/65">Bold, fun, vibrant</span>
            </span>
          </button>

          <button class="theme-option btn w-full rounded-2xl px-3 py-3 flex items-center gap-3 text-left hover:bg-white/10" data-theme="neon">
            <span class="theme-swatch" style="background: linear-gradient(135deg,#050816,#5b21b6,#00f5d4)"></span>
            <span class="flex-1">
              <span class="block font-semibold">Neon</span>
              <span class="block text-xs text-white/65">Electric, modern, energetic</span>
            </span>
          </button>

          <button class="theme-option btn w-full rounded-2xl px-3 py-3 flex items-center gap-3 text-left hover:bg-white/10" data-theme="mint">
            <span class="theme-swatch" style="background: linear-gradient(135deg,#0b1f1a,#10b981,#7dd3fc)"></span>
            <span class="flex-1">
              <span class="block font-semibold">Mint</span>
              <span class="block text-xs text-white/65">Fresh, light, upbeat</span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <div id="statusText" class="status mb-3 sm:mb-4">Ready</div>

    <div class="timer-wrap text-[22vw] sm:text-[17vw] lg:text-[14vw] font-extrabold">
      <span id="hoursDisplay" class="time-part">00</span>
      <span class="time-colon">:</span>
      <span id="minutesDisplay" class="time-part">05</span>
      <span class="time-colon">:</span>
      <span id="secondsDisplay" class="time-part">00</span>
    </div>

    <div class="mt-5 sm:mt-6">
      <div class="progress-wrap">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </div>

    <div class="mt-7 sm:mt-8 w-full flex items-center justify-center">
      <div id="setupUI" class="control-fade shown-ui flex flex-col items-center gap-5">
        <div class="glass rounded-full px-4 sm:px-5 py-3 flex items-center justify-center gap-3 sm:gap-4">
          <div class="flex flex-col items-center min-w-[84px] sm:min-w-[98px]">
            <span class="text-[11px] uppercase tracking-[0.18em] text-white/65 font-bold mb-1">Hours</span>
            <input id="hoursInput" class="time-input" type="number" min="0" value="0" />
          </div>

          <span class="sep">:</span>

          <div class="flex flex-col items-center min-w-[84px] sm:min-w-[98px]">
            <span class="text-[11px] uppercase tracking-[0.18em] text-white/65 font-bold mb-1">Minutes</span>
            <input id="minutesInput" class="time-input" type="number" min="0" value="5" />
          </div>

          <span class="sep">:</span>

          <div class="flex flex-col items-center min-w-[84px] sm:min-w-[98px]">
            <span class="text-[11px] uppercase tracking-[0.18em] text-white/65 font-bold mb-1">Seconds</span>
            <input id="secondsInput" class="time-input" type="number" min="0" value="0" />
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button id="setBtn" class="btn secondary-btn glass rounded-full h-12 px-6 sm:px-8 text-sm sm:text-base font-semibold">
            Set
          </button>
          <button id="startBtn" class="btn primary-btn rounded-full h-12 px-8 sm:px-10 text-sm sm:text-base font-bold">
            Start
          </button>
        </div>
      </div>

      <div id="runUI" class="control-fade hidden-ui flex items-center gap-3">
        <button id="pauseBtn" class="btn secondary-btn glass rounded-full h-12 px-8 sm:px-10 text-sm sm:text-base font-semibold">
          Pause
        </button>
        <button id="stopBtn" class="btn primary-btn rounded-full h-12 px-8 sm:px-10 text-sm sm:text-base font-bold">
          Stop
        </button>
      </div>
    </div>
  </main>

  <script>
    const themes = {
      sunset: {
        label: "Sunset",
        bg1: "#1f1147",
        bg2: "#ff5f6d",
        bg3: "#ffc371",
        panel: "rgba(255,255,255,0.11)",
        panelBorder: "rgba(255,255,255,0.18)",
        text: "#ffffff",
        muted: "rgba(255,255,255,0.78)",
        accent: "#fff4e8",
        accentText: "#38150d",
        glow: "rgba(255, 187, 120, 0.34)",
        bar: "linear-gradient(90deg, #fff7ed, #ffd29d, #ff8a80)",
        preview: "linear-gradient(135deg,#1f1147,#ff5f6d,#ffc371)"
      },
      ocean: {
        label: "Ocean",
        bg1: "#082032",
        bg2: "#2c74b3",
        bg3: "#00c2ff",
        panel: "rgba(255,255,255,0.09)",
        panelBorder: "rgba(255,255,255,0.15)",
        text: "#ffffff",
        muted: "rgba(255,255,255,0.76)",
        accent: "#eaf8ff",
        accentText: "#082032",
        glow: "rgba(90, 220, 255, 0.34)",
        bar: "linear-gradient(90deg, #ffffff, #9ae6ff, #38bdf8)",
        preview: "linear-gradient(135deg,#082032,#2c74b3,#00c2ff)"
      },
      berry: {
        label: "Berry",
        bg1: "#2a1037",
        bg2: "#8b1e5d",
        bg3: "#ff4f8b",
        panel: "rgba(255,255,255,0.10)",
        panelBorder: "rgba(255,255,255,0.17)",
        text: "#ffffff",
        muted: "rgba(255,255,255,0.76)",
        accent: "#fff0f7",
        accentText: "#3b0f2c",
        glow: "rgba(255, 95, 162, 0.32)",
        bar: "linear-gradient(90deg, #fff1f7, #ff9dc6, #ff4f8b)",
        preview: "linear-gradient(135deg,#2a1037,#8b1e5d,#ff4f8b)"
      },
      neon: {
        label: "Neon",
        bg1: "#050816",
        bg2: "#5b21b6",
        bg3: "#00f5d4",
        panel: "rgba(255,255,255,0.08)",
        panelBorder: "rgba(255,255,255,0.14)",
        text: "#f8fffe",
        muted: "rgba(248,255,254,0.76)",
        accent: "#dffff8",
        accentText: "#04121a",
        glow: "rgba(0, 245, 212, 0.34)",
        bar: "linear-gradient(90deg, #ffffff, #7cf9ff, #00f5d4)",
        preview: "linear-gradient(135deg,#050816,#5b21b6,#00f5d4)"
      },
      mint: {
        label: "Mint",
        bg1: "#0b1f1a",
        bg2: "#10b981",
        bg3: "#7dd3fc",
        panel: "rgba(255,255,255,0.10)",
        panelBorder: "rgba(255,255,255,0.16)",
        text: "#ffffff",
        muted: "rgba(255,255,255,0.76)",
        accent: "#effff9",
        accentText: "#07291d",
        glow: "rgba(90, 255, 210, 0.28)",
        bar: "linear-gradient(90deg, #ffffff, #bbf7d0, #67e8f9)",
        preview: "linear-gradient(135deg,#0b1f1a,#10b981,#7dd3fc)"
      }
    };

    const root = document.documentElement;

    const themeToggle = document.getElementById("themeToggle");
    const themeMenu = document.getElementById("themeMenu");
    const themePreview = document.getElementById("themePreview");
    const themeLabel = document.getElementById("themeLabel");
    const themeOptions = document.querySelectorAll(".theme-option");

    const hoursInput = document.getElementById("hoursInput");
    const minutesInput = document.getElementById("minutesInput");
    const secondsInput = document.getElementById("secondsInput");

    const hoursDisplay = document.getElementById("hoursDisplay");
    const minutesDisplay = document.getElementById("minutesDisplay");
    const secondsDisplay = document.getElementById("secondsDisplay");

    const statusText = document.getElementById("statusText");
    const progressBar = document.getElementById("progressBar");
    const setupUI = document.getElementById("setupUI");
    const runUI = document.getElementById("runUI");

    const setBtn = document.getElementById("setBtn");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const stopBtn = document.getElementById("stopBtn");

    let totalSeconds = 0;
    let remainingSeconds = 0;
    let timer = null;
    let endAt = 0;
    let isRunning = false;
    let isPaused = false;
    let pausedLeft = 0;
    let audioContext = null;

    function applyTheme(name) {
      const theme = themes[name] || themes.sunset;

      root.style.setProperty("--bg1", theme.bg1);
      root.style.setProperty("--bg2", theme.bg2);
      root.style.setProperty("--bg3", theme.bg3);
      root.style.setProperty("--panel", theme.panel);
      root.style.setProperty("--panel-border", theme.panelBorder);
      root.style.setProperty("--text", theme.text);
      root.style.setProperty("--muted", theme.muted);
      root.style.setProperty("--accent", theme.accent);
      root.style.setProperty("--accent-text", theme.accentText);
      root.style.setProperty("--glow", theme.glow);
      root.style.setProperty("--bar", theme.bar);

      themePreview.style.background = theme.preview;
      themeLabel.textContent = theme.label;

      localStorage.setItem("countdown_theme", name);
    }

    function openThemeMenu() {
      themeMenu.classList.remove("hidden");
    }

    function closeThemeMenu() {
      themeMenu.classList.add("hidden");
    }

    function toggleThemeMenu() {
      themeMenu.classList.toggle("hidden");
    }

    function clampInt(value) {
      const n = Math.floor(Number(value) || 0);
      return Math.max(0, n);
    }

    function parseInputs() {
      const h = clampInt(hoursInput.value);
      const m = clampInt(minutesInput.value);
      const s = clampInt(secondsInput.value);
      return (h * 3600) + (m * 60) + s;
    }

    function normaliseInputs() {
      const total = parseInputs();
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;

      hoursInput.value = h;
      minutesInput.value = m;
      secondsInput.value = s;

      return total;
    }

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function setDisplay(total) {
      const safe = Math.max(0, Math.floor(total));
      const h = Math.floor(safe / 3600);
      const m = Math.floor((safe % 3600) / 60);
      const s = safe % 60;

      hoursDisplay.textContent = pad(h);
      minutesDisplay.textContent = pad(m);
      secondsDisplay.textContent = pad(s);
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function showSetup() {
      setupUI.classList.remove("hidden-ui");
      setupUI.classList.add("shown-ui");
      runUI.classList.remove("shown-ui");
      runUI.classList.add("hidden-ui");
    }

    function showRun() {
      setupUI.classList.remove("shown-ui");
      setupUI.classList.add("hidden-ui");
      runUI.classList.remove("hidden-ui");
      runUI.classList.add("shown-ui");
    }

    function updateProgress() {
      if (!totalSeconds || totalSeconds <= 0) {
        progressBar.style.width = "0%";
        return;
      }

      const elapsed = totalSeconds - remainingSeconds;
      const progress = Math.max(0, Math.min(100, (elapsed / totalSeconds) * 100));
      progressBar.style.width = progress + "%";
    }

    function applySet() {
      totalSeconds = normaliseInputs();
      remainingSeconds = totalSeconds;
      setDisplay(remainingSeconds);
      setStatus("Ready");
      updateProgress();

      [hoursDisplay, minutesDisplay, secondsDisplay].forEach(el => {
        el.classList.remove("done");
      });
    }

    function clearTimer() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function subtleBeep() {
      try {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const now = audioContext.currentTime;

        [784, 1046].forEach((freq, i) => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();

          osc.type = "sine";
          osc.frequency.value = freq;

          gain.gain.setValueAtTime(0.0001, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.05, now + 0.02 + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28 + i * 0.08);

          osc.connect(gain);
          gain.connect(audioContext.destination);

          osc.start(now + i * 0.08);
          osc.stop(now + 0.32 + i * 0.08);
        });
      } catch (e) {}
    }

    function finishTimer() {
      clearTimer();
      isRunning = false;
      isPaused = false;
      pausedLeft = 0;
      remainingSeconds = 0;
      setDisplay(0);
      setStatus("Finished");
      updateProgress();
      pauseBtn.textContent = "Pause";
      showSetup();
      subtleBeep();

      [hoursDisplay, minutesDisplay, secondsDisplay].forEach(el => {
        el.classList.remove("done");
        void el.offsetWidth;
        el.classList.add("done");
      });
    }

    function tick() {
      const secondsLeft = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      remainingSeconds = secondsLeft;
      setDisplay(remainingSeconds);
      updateProgress();

      if (secondsLeft <= 0) {
        finishTimer();
      }
    }

    function startTimer() {
      applySet();
      if (totalSeconds <= 0) return;

      isRunning = true;
      isPaused = false;
      pausedLeft = 0;
      endAt = Date.now() + (totalSeconds * 1000);

      setStatus("Running");
      pauseBtn.textContent = "Pause";
      showRun();

      clearTimer();
      tick();
      timer = setInterval(tick, 180);
    }

    function togglePause() {
      if (!isRunning && !isPaused) return;

      if (isRunning) {
        pausedLeft = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
        remainingSeconds = pausedLeft;
        isRunning = false;
        isPaused = true;
        clearTimer();
        setDisplay(remainingSeconds);
        setStatus("Paused");
        pauseBtn.textContent = "Resume";
        updateProgress();
        return;
      }

      if (isPaused) {
        if (pausedLeft <= 0) return finishTimer();

        remainingSeconds = pausedLeft;
        endAt = Date.now() + (pausedLeft * 1000);
        isRunning = true;
        isPaused = false;
        setStatus("Running");
        pauseBtn.textContent = "Pause";
        clearTimer();
        tick();
        timer = setInterval(tick, 180);
      }
    }

    function stopTimer() {
      clearTimer();
      isRunning = false;
      isPaused = false;
      pausedLeft = 0;
      pauseBtn.textContent = "Pause";
      showSetup();
      applySet();
    }

    [hoursInput, minutesInput, secondsInput].forEach(input => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/[^\d]/g, "");
      });
    });

    themeToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleThemeMenu();
    });

    themeOptions.forEach(btn => {
      btn.addEventListener("click", () => {
        applyTheme(btn.dataset.theme);
        closeThemeMenu();
      });
    });

    document.addEventListener("click", (e) => {
      if (!themeMenu.contains(e.target) && !themeToggle.contains(e.target)) {
        closeThemeMenu();
      }
    });

    setBtn.addEventListener("click", applySet);
    startBtn.addEventListener("click", startTimer);
    pauseBtn.addEventListener("click", togglePause);
    stopBtn.addEventListener("click", stopTimer);

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (isRunning || isPaused) togglePause();
        else startTimer();
      }

      if (e.key === "Enter" && !isRunning && !isPaused) {
        startTimer();
      }

      if (e.key === "Escape") {
        closeThemeMenu();
        stopTimer();
      }
    });

    const savedTheme = localStorage.getItem("countdown_theme") || "sunset";
    applyTheme(savedTheme);
    applySet();
  </script>
</body>
</html>
