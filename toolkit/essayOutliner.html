<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                const isDark = String(localStorage.getItem('darkMode') || '').toLowerCase() === 'true';
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/assets/css/dark-mode.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essay Outliner | StudyBase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/assets/siteIcons/main.ico">
  <script src="/assets/js/navbar.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-grid-slate { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='%23f1f5f9'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e"); }
    </style>
</head>
<body class="bg-[#f4f7f9] text-slate-800 min-h-screen relative">
    <div class="absolute inset-0 bg-grid-slate pointer-events-none -z-10"></div>

    <div class="max-w-4xl mx-auto px-6 py-12">
        
        <div class="flex justify-between items-end mb-8">
            <div>
                <a href="/toolkit/index.html" class="text-rose-500 font-bold text-sm flex items-center mb-4 hover:text-rose-600 transition-colors">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Back to Toolkit
                </a>
                <h1 class="text-3xl font-black text-slate-900">Essay Outliner</h1>
                <p class="text-slate-500 mt-1">Structure your arguments using the PEEL framework.</p>
            </div>
            <button onclick="window.print()" class="bg-white border border-slate-200 text-slate-600 font-bold py-2 px-6 rounded-lg shadow-sm hover:bg-slate-50 transition-colors">
                <i class="fa-solid fa-download mr-2"></i> Export
            </button>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <input type="text" placeholder="Essay Prompt / Title..." class="w-full text-2xl font-bold outline-none placeholder-slate-300 text-slate-800 border-b border-transparent focus:border-rose-200 pb-2 transition-colors mb-4">
            <textarea placeholder="Thesis Statement (Your main overarching argument)..." class="w-full bg-rose-50 border border-rose-100 rounded-xl p-4 outline-none focus:border-rose-300 text-rose-900 resize-none h-24 font-medium"></textarea>
        </div>

        <div id="paragraph-container" class="space-y-8">
            </div>

        <button onclick="addParagraph()" class="mt-8 w-full border-2 border-dashed border-rose-300 text-rose-500 hover:bg-rose-50 hover:border-rose-400 font-bold py-4 rounded-2xl transition-all flex items-center justify-center text-lg">
            <i class="fa-solid fa-plus mr-2"></i> Add Paragraph
        </button>

    </div>

    <script>
        let paraCount = 0;

        function addParagraph() {
            paraCount++;
            const container = document.getElementById('paragraph-container');
            const div = document.createElement('div');
            div.className = "bg-white p-8 rounded-2xl shadow-sm border border-slate-200 relative group animate-[fadeIn_0.3s_ease-out]";
            
            div.innerHTML = `
                <div class="absolute -left-4 top-8 w-8 h-8 bg-rose-600 text-white rounded-full flex items-center justify-center font-black shadow-md border-4 border-[#f4f7f9]">${paraCount}</div>
                <button onclick="this.parentElement.remove()" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa-solid fa-trash"></i></button>
                
                <div class="space-y-4">
                    <div class="flex gap-4">
                        <div class="w-1/4 pt-2 text-right text-sm font-bold text-slate-400 uppercase tracking-widest">Point</div>
                        <textarea placeholder="What is the main point of this paragraph?" class="w-3/4 bg-slate-50 border border-slate-200 rounded-lg p-3 outline-none focus:border-rose-400 resize-none h-16"></textarea>
                    </div>
                    <div class="flex gap-4">
                        <div class="w-1/4 pt-2 text-right text-sm font-bold text-slate-400 uppercase tracking-widest">Evidence</div>
                        <textarea placeholder="Quotes, statistics, or references..." class="w-3/4 bg-slate-50 border border-slate-200 rounded-lg p-3 outline-none focus:border-rose-400 resize-none h-20 font-mono text-sm text-slate-600"></textarea>
                    </div>
                    <div class="flex gap-4">
                        <div class="w-1/4 pt-2 text-right text-sm font-bold text-slate-400 uppercase tracking-widest">Explain</div>
                        <textarea placeholder="How does the evidence prove your point?" class="w-3/4 bg-slate-50 border border-slate-200 rounded-lg p-3 outline-none focus:border-rose-400 resize-none h-24"></textarea>
                    </div>
                    <div class="flex gap-4">
                        <div class="w-1/4 pt-2 text-right text-sm font-bold text-slate-400 uppercase tracking-widest">Link</div>
                        <textarea placeholder="How does this link back to the prompt/thesis?" class="w-3/4 bg-slate-50 border border-slate-200 rounded-lg p-3 outline-none focus:border-rose-400 resize-none h-16"></textarea>
                    </div>
                </div>
            `;
            container.appendChild(div);
        }

        // Initialize with two paragraphs
        addParagraph();
        addParagraph();
    </script>
</body>
</html>
