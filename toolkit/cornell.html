<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                const isDark = String(localStorage.getItem('darkMode') || '').toLowerCase() === 'true';
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/assets/css/dark-mode.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornell Templates | StudyBase</title>
    <link rel="icon" href="/assets/siteIcons/main.ico">
  <script src="/assets/js/navbar.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-grid-slate { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='%23f1f5f9'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e"); }
        
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
            .print-border { border-color: #cbd5e1 !important; }
            textarea { resize: none; overflow: hidden; }
        }
    </style>
</head>
<body class="bg-[#f4f7f9] text-slate-800 min-h-screen relative">
    <div class="absolute inset-0 bg-grid-slate pointer-events-none -z-10 no-print"></div>

    <div class="max-w-5xl mx-auto px-6 py-12">
        
        <div class="flex justify-between items-end mb-8 no-print">
            <div>
                <a href="/toolkit/index.html" class="text-sky-500 font-bold text-sm flex items-center mb-4 hover:text-sky-600 transition-colors">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Back to Toolkit
                </a>
                <h1 class="text-3xl font-black text-slate-900">Cornell Notes</h1>
                <p class="text-slate-500 mt-1">Type your notes or print blank templates for handwritten revision.</p>
            </div>
            <div class="flex gap-3">
                <button onclick="clearNotes()" class="bg-white border border-slate-200 text-slate-600 font-bold py-2 px-4 rounded-lg shadow-sm hover:bg-slate-50 transition-colors">
                    Clear
                </button>
                <button onclick="window.print()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-colors">
                    <i class="fa-solid fa-print mr-2"></i> Print / Save PDF
                </button>
            </div>
        </div>

        <div class="bg-white rounded-none md:rounded-xl shadow-none md:shadow-md border-0 md:border md:border-slate-200 print-border min-h-[800px] flex flex-col mx-auto bg-white" style="width: 100%; max-width: 21cm;">
            
            <div class="flex border-b-2 border-slate-800 print-border p-6">
                <div class="w-2/3 pr-4 border-r border-slate-300 print-border">
                    <input type="text" id="note-topic" placeholder="Topic / Module..." class="w-full text-2xl font-black text-slate-900 outline-none placeholder-slate-300 mb-2">
                    <input type="text" placeholder="Subject..." class="w-full text-sm font-bold text-sky-600 outline-none placeholder-sky-200">
                </div>
                <div class="w-1/3 pl-4 flex flex-col justify-end">
                    <input type="date" class="w-full text-sm font-medium text-slate-500 outline-none text-right">
                </div>
            </div>

            <div class="flex flex-1 border-b-2 border-slate-800 print-border">
                <div class="w-1/3 border-r-2 border-slate-800 print-border p-6 bg-slate-50 print:bg-white">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Cues / Keywords / Questions</h3>
                    <textarea id="cues-area" placeholder="- Main ideas&#10;- Vocabulary&#10;- Exam questions" class="w-full h-[500px] bg-transparent outline-none resize-none text-slate-700 font-medium leading-loose"></textarea>
                </div>
                
                <div class="w-2/3 p-6">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Detailed Notes</h3>
                    <textarea id="notes-area" placeholder="Take notes here. Use bullet points, abbreviations, and keep it concise." class="w-full h-[500px] bg-transparent outline-none resize-none text-slate-800 leading-loose"></textarea>
                </div>
            </div>

            <div class="p-6 h-48 bg-sky-50 print:bg-white">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Summary</h3>
                <textarea id="summary-area" placeholder="Write a brief 2-3 sentence summary of the entire page here to consolidate your learning." class="w-full h-24 bg-transparent outline-none resize-none text-slate-700 font-medium"></textarea>
            </div>

        </div>

    </div>

    <script>
        function clearNotes() {
            if(confirm("Clear all text from this template?")) {
                document.getElementById('note-topic').value = '';
                document.getElementById('cues-area').value = '';
                document.getElementById('notes-area').value = '';
                document.getElementById('summary-area').value = '';
            }
        }
    </script>
</body>
</html>
