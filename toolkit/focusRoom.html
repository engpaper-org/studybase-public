<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-12 relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-12 flex justify-between items-end border-b border-slate-800 pb-6">
            <div>
                <a href="/toolkit/index.html" class="text-indigo-400 hover:text-indigo-300 text-sm font-bold flex items-center mb-4 transition-colors">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Back to Toolkit
                </a>
                <h1 class="text-3xl md:text-4xl font-black text-white">The Focus Room</h1>
            </div>
            <div class="hidden md:flex gap-3">
                <button class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center transition-colors tooltip" title="Lofi Beats">
                    <i class="fa-solid fa-music"></i>
                </button>
                <button class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center transition-colors tooltip" title="Rain Sounds">
                    <i class="fa-solid fa-cloud-rain"></i>
                </button>
            </div>
        </div>

        <div class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-800/30 border border-slate-700/50 rounded-[2.5rem] p-10 backdrop-blur-sm">
            
            <div class="flex p-1 bg-slate-900/80 rounded-xl mb-12 shadow-inner border border-slate-800">
                <button onclick="setMode('pomodoro')" id="btn-pomodoro" class="px-6 py-2.5 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-md transition-all">Pomodoro</button>
                <button onclick="setMode('shortBreak')" id="btn-shortBreak" class="px-6 py-2.5 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all">Short Break</button>
                <button onclick="setMode('longBreak')" id="btn-longBreak" class="px-6 py-2.5 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all">Long Break</button>
            </div>

            <div class="relative flex items-center justify-center w-72 h-72 rounded-full border-[8px] border-slate-800 shadow-[0_0_50px_rgba(79,70,229,0.1)] mb-12 bg-slate-900/50">
                <div class="absolute inset-2 rounded-full border-2 border-indigo-500/30 border-dashed animate-[spin_60s_linear_infinite]"></div>
                <h2 id="timer-display" class="text-7xl font-mono text-white tracking-tighter">25:00</h2>
            </div>

            <div class="flex gap-4">
                <button onclick="toggleTimer()" id="start-btn" class="w-40 py-4 rounded-xl bg-white text-slate-900 font-black text-lg hover:bg-slate-200 hover:scale-105 transition-all shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                    START
                </button>
                <button onclick="resetTimer()" class="w-16 py-4 rounded-xl bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700 transition-all flex items-center justify-center text-xl">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
            
            <p class="text-slate-500 text-sm mt-8 font-medium">Session <span id="session-count" class="text-indigo-400 font-bold">1</span> / 4</p>
        </div>

        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <div class="bg-slate-800/30 border border-slate-700/50 rounded-3xl p-6 backdrop-blur-sm flex-1 flex flex-col">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center">
                    <i class="fa-solid fa-list-check mr-2 text-indigo-400"></i> Session Goals
                </h3>
                
                <div class="flex gap-2 mb-6">
                    <input type="text" id="task-input" placeholder="What are you working on?" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
                    <button onclick="addTask()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 rounded-lg transition-colors">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <ul id="task-list" class="space-y-3 flex-1 overflow-y-auto pr-2 no-scrollbar">
                    <li class="flex items-center justify-between p-3 bg-slate-800/80 rounded-lg border border-slate-700 group">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" class="w-4 h-4 rounded border-slate-600 text-indigo-500 focus:ring-indigo-500 bg-slate-700 cursor-pointer">
                            <span class="text-sm text-slate-300">Complete Biology Past Paper 1</span>
                        </div>
                        <button class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all"><i class="fa-solid fa-trash"></i></button>
                    </li>
                </ul>
            </div>

            <div class="bg-indigo-900/20 border border-indigo-500/20 rounded-3xl p-6 backdrop-blur-sm">
                <h3 class="text-lg font-bold text-white mb-4">Today's Focus</h3>
                <div class="flex items-end gap-2">
                    <span class="text-4xl font-black text-indigo-400">0</span>
                    <span class="text-slate-400 font-medium mb-1">hours logged</span>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Timer Variables
        let timer;
        let isRunning = false;
        let timeLeft = 25 * 60; // Default 25 mins
        let currentMode = 'pomodoro'; // pomodoro, shortBreak, longBreak
        let sessionCount = 1;

        const display = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');
        const sessionDisplay = document.getElementById('session-count');

        const modes = {
            pomodoro: 25 * 60,
            shortBreak: 5 * 60,
            longBreak: 15 * 60
        };

        // Format time as MM:SS
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            display.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timer);
                startBtn.innerText = "RESUME";
                startBtn.classList.replace('bg-red-500', 'bg-white');
                startBtn.classList.replace('text-white', 'text-slate-900');
            } else {
                startBtn.innerText = "PAUSE";
                startBtn.classList.replace('bg-white', 'bg-red-500');
                startBtn.classList.replace('text-slate-900', 'text-white');
                timer = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        playAlarm();
                        autoSwitchMode();
                    }
                }, 1000);
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            timeLeft = modes[currentMode];
            updateDisplay();
            startBtn.innerText = "START";
            startBtn.classList.replace('bg-red-500', 'bg-white');
            startBtn.classList.replace('text-white', 'text-slate-900');
        }

        function setMode(mode) {
            currentMode = mode;
            timeLeft = modes[mode];
            updateDisplay();
            
            if(isRunning) toggleTimer(); // Pause if running while switching

            // Update UI buttons
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
                btn.className = "px-6 py-2.5 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition-all";
            });
            const activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.className = "px-6 py-2.5 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow-md transition-all";
        }

        function autoSwitchMode() {
            if (currentMode === 'pomodoro') {
                sessionCount++;
                sessionDisplay.innerText = sessionCount;
                if (sessionCount > 4) {
                    setMode('longBreak');
                    sessionCount = 1; // Reset after long break
                } else {
                    setMode('shortBreak');
                }
            } else {
                setMode('pomodoro');
            }
        }

        function playAlarm() {
            // In a real app, link this to an audio file
            alert("Time's up!");
        }

        // --- Task Logic ---
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');

        function addTask() {
            const text = taskInput.value.trim();
            if(!text) return;

            const li = document.createElement('li');
            li.className = "flex items-center justify-between p-3 bg-slate-800/80 rounded-lg border border-slate-700 group animate-[fadeIn_0.3s_ease-out]";
            li.innerHTML = `
                <div class="flex items-center gap-3">
                    <input type="checkbox" onchange="toggleTask(this)" class="w-4 h-4 rounded border-slate-600 text-indigo-500 bg-slate-700 cursor-pointer">
                    <span class="text-sm text-slate-300 transition-all">${text}</span>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            taskList.prepend(li);
            taskInput.value = '';
        }

        function toggleTask(checkbox) {
            const span = checkbox.nextElementSibling;
            if(checkbox.checked) {
                span.classList.add('line-through', 'text-slate-500');
            } else {
                span.classList.remove('line-through', 'text-slate-500');
            }
        }

        // Allow 'Enter' key to add task
        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addTask();
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
