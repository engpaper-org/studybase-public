<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCAS Calculator | RevisionBase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-grid-slate { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='%23f1f5f9'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e"); }
    </style>
</head>
<body class="bg-[#f4f7f9] text-slate-800 min-h-screen relative flex items-center justify-center">
    <div class="absolute inset-0 bg-grid-slate pointer-events-none -z-10"></div>

    <div class="w-full max-w-4xl mx-auto px-6 py-12 flex flex-col md:flex-row gap-8">
        
        <div class="w-full md:w-2/3 bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
            <a href="/toolkit/index.html" class="text-emerald-500 font-bold text-sm flex items-center mb-6 hover:text-emerald-600">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to Toolkit
            </a>
            <h2 class="text-3xl font-black mb-2">UCAS Tariff Calculator</h2>
            <p class="text-slate-500 mb-8 text-sm">Add your predicted or target A-Level grades below.</p>

            <div id="subject-list" class="space-y-4 mb-6">
                </div>

            <button onclick="addSubject()" class="w-full border-2 border-dashed border-slate-300 text-slate-500 hover:border-emerald-500 hover:text-emerald-600 font-bold py-4 rounded-xl transition-colors flex items-center justify-center">
                <i class="fa-solid fa-plus mr-2"></i> Add A-Level Subject
            </button>
        </div>

        <div class="w-full md:w-1/3">
            <div class="sticky top-12 bg-emerald-600 text-white p-8 rounded-[2rem] shadow-xl text-center">
                <i class="fa-solid fa-graduation-cap text-4xl text-emerald-300 mb-4"></i>
                <h3 class="text-emerald-100 font-bold uppercase tracking-wider text-sm mb-2">Total UCAS Points</h3>
                <div id="total-points" class="text-7xl font-black mb-6">0</div>
                <div class="bg-emerald-700/50 rounded-xl p-4 text-sm text-emerald-100">
                    <p>Usually requires:</p>
                    <ul class="mt-2 space-y-1 font-bold">
                        <li>Oxford/Cambridge: 144+</li>
                        <li>Russell Group: 112 - 144</li>
                        <li>Standard Uni: 96 - 112</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ucasMap = { 'A*': 56, 'A': 48, 'B': 40, 'C': 32, 'D': 24, 'E': 16 };
        let subjectCount = 0;

        function calculateTotal() {
            let total = 0;
            const selects = document.querySelectorAll('.grade-select');
            selects.forEach(select => {
                if(select.value !== 'None') {
                    total += ucasMap[select.value];
                }
            });
            document.getElementById('total-points').innerText = total;
        }

        function addSubject() {
            subjectCount++;
            const list = document.getElementById('subject-list');
            
            const div = document.createElement('div');
            div.className = "flex gap-4 items-center bg-slate-50 p-2 rounded-xl border border-slate-200 animate-[fadeIn_0.2s_ease-out]";
            
            div.innerHTML = `
                <input type="text" placeholder="Subject (e.g. Maths)" class="flex-1 bg-transparent px-4 py-2 outline-none font-bold text-slate-700">
                <select class="grade-select bg-white border border-slate-300 rounded-lg px-4 py-2 font-bold text-emerald-600 outline-none" onchange="calculateTotal()">
                    <option value="None">- Grade -</option>
                    <option value="A*">A* (56 pts)</option>
                    <option value="A">A (48 pts)</option>
                    <option value="B">B (40 pts)</option>
                    <option value="C">C (32 pts)</option>
                    <option value="D">D (24 pts)</option>
                    <option value="E">E (16 pts)</option>
                </select>
                <button onclick="this.parentElement.remove(); calculateTotal();" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-500 transition-colors">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            list.appendChild(div);
        }

        // Initialize with 3 empty subjects
        addSubject();
        addSubject();
        addSubject();
    </script>
</body>
</html>
