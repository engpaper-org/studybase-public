<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBase Loader</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css?v=20260526-remaster">
</head>
<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden h-screen w-screen m-0 select-none">

    <div id="loader-container" class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden">
        
        <div id="curtain-left" class="absolute inset-y-0 left-0 w-1/2 bg-slate-900 border-r border-slate-800 transition-transform duration-[1200ms] cubic-bezier(0.85, 0, 0.15, 1)"></div>
        <div id="curtain-right" class="absolute inset-y-0 right-0 w-1/2 bg-slate-900 border-l border-slate-800 transition-transform duration-[1200ms] cubic-bezier(0.85, 0, 0.15, 1)"></div>

        <div id="loader-content" class="relative z-10 flex flex-col items-center space-y-6 transition-all duration-700 ease-out">
            <div class="relative flex items-center justify-center w-20 h-20">
                <div class="absolute inset-0 border-2 border-indigo-500/30 rounded-2xl animate-pulse"></div>
                <div class="absolute inset-2 border-2 border-t-indigo-400 border-r-transparent border-b-indigo-400 border-l-transparent rounded-xl animate-spin speed-[3s]"></div>
                <div class="w-8 h-8 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-lg shadow-[0_0_20px_rgba(99,102,241,0.5)]"></div>
            </div>

            <div class="text-center space-y-2">
                <h1 class="text-3xl font-black tracking-[0.2em] text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-slate-400 uppercase">
                    StudyBase
                </h1>
                <p class="text-xs tracking-[0.4em] text-indigo-400 font-medium uppercase animate-pulse">
                    Connecting to Node
                </p>
            </div>

            <div class="w-48 h-[2px] bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 w-1/3 rounded-full animate-[loading_2s_infinite_ease-in-out]"></div>
            </div>
        </div>
    </div>

    <main id="main-content" class="relative w-full h-full flex flex-col items-center justify-center px-6 opacity-0 scale-95 transition-all duration-[1000ms] delay-300 ease-out">
        <div class="max-w-2xl text-center space-y-6">
            <span class="px-3 py-1 text-xs font-semibold tracking-widest text-indigo-400 bg-indigo-500/10 border border-indigo-500/20 rounded-full uppercase">
                Dashboard Ready
            </span>
            <h2 class="text-5xl font-bold tracking-tight bg-gradient-to-b from-white to-slate-400 text-transparent bg-clip-text">
                Welcome to studybase.site
            </h2>
            <p class="text-slate-400 text-lg max-w-md mx-auto leading-relaxed">
                Your centralized environment for structural learning, data tracking, and cognitive workflows.
            </p>
            <div class="flex items-center justify-center gap-4 pt-4">
                <button class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 shadow-lg shadow-indigo-600/20 text-white font-medium rounded-xl transition-all hover:-translate-y-0.5 cursor-pointer">
                    Get Started
                </button>
                <button class="px-6 py-2.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium rounded-xl transition-all cursor-pointer">
                    Documentation
                </button>
            </div>
        </div>
    </main>

    <button onclick="triggerReveal()" class="fixed bottom-4 right-4 z-50 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg shadow-lg cursor-pointer transition-colors">
        Simulate Parent Push
    </button>

    <style>
        @keyframes loading {
            0% { transform: translateX(-100%); width: 30%; }
            50% { width: 60%; }
            100% { transform: translateX(250%); width: 30%; }
        }
        .cubic-bezier\(0\.85\,\ 0\,\ 0\.15\,\ 1\) {
            transition-timing-function: cubic-bezier(0.85, 0, 0.15, 1);
        }
    </style>

    <script>
        // Core function that handles the "Cool Opening"
        function triggerReveal() {
            const loaderContent = document.getElementById('loader-content');
            const curtainLeft = document.getElementById('curtain-left');
            const curtainRight = document.getElementById('curtain-right');
            const mainContent = document.getElementById('main-content');
            const loaderContainer = document.getElementById('loader-container');

            // Stage 1: Fade and shrink the logo/text quickly
            loaderContent.classList.add('opacity-0', 'scale-75');

            // Stage 2: After a brief delay, snap open the background curtains
            setTimeout(() => {
                curtainLeft.classList.add('-translate-x-full');
                curtainRight.classList.add('translate-x-full');
                
                // Stage 3: Smoothly ease in and scale up the actual landing page content
                mainContent.classList.remove('opacity-0', 'scale-95');
                mainContent.classList.add('opacity-100', 'scale-100');
            }, 300);

            // Clean up: Remove the loader from DOM completely after animation finishes to free up cursor events
            setTimeout(() => {
                loaderContainer.remove();
            }, 1500);
        }

        // Parent Message Event Listener
        window.addEventListener('message', function(event) {
            // Security Best Practice: Un-comment and change to your exact domain if needed
            // if (event.origin !== 'https://studybase.site') return;

            // Expecting parent to send a string 'reveal' or a specific action object
            if (event.data === 'reveal' || event.data.action === 'PAGE_LOADED') {
                triggerReveal();
            }
        });
    </script>
</body>
</html>
