            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(226,232,240,0.8);
            box-shadow: 0 10px 35px rgba(15,23,42,0.05);
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        body: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        };
    </script>
</head>
<body class="min-h-screen bg-[#f4f7f9] text-slate-900 font-sans selection:bg-indigo-100 selection:text-indigo-900 overflow-x-hidden">
    <div class="fixed inset-0 bg-grid-slate-100 [mask-image:linear-gradient(180deg,white,rgba(255,255,255,0.72))] -z-30"></div>
    <div class="fixed inset-0 -z-20 pointer-events-none">
        <div class="absolute top-0 left-10 w-72 h-72 bg-indigo-300 rounded-full mix-blend-multiply blur-3xl opacity-30"></div>
        <div class="absolute top-0 right-10 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply blur-3xl opacity-30"></div>
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-72 h-72 bg-fuchsia-300 rounded-full mix-blend-multiply blur-3xl opacity-30"></div>
    </div>

    <main class="relative z-10 min-h-screen flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-3xl">
            <div class="inline-flex items-center gap-3 px-5 py-2.5 rounded-full surface-glass border border-slate-200 mb-6 text-slate-600 text-xs font-bold uppercase tracking-widest shadow-md">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-purple-500"></span>
                </span>
                <span>Invite page</span>
            </div>

            <div class="soft-card rounded-[2rem] overflow-hidden">
                <div class="bg-slate-50/90 border-b border-slate-200 px-5 py-4 flex items-center justify-between">
                    <div class="flex space-x-2">
                        <div class="w-3 h-3 rounded-full bg-red-400"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                        <div class="w-3 h-3 rounded-full bg-green-400"></div>
                    </div>
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-widest">Bingo invite</div>
                    <div class="w-10"></div>
                </div>

                <div class="p-6 md:p-10">
                    <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-100/80 border border-indigo-200 text-indigo-700 rounded-lg text-xs font-bold uppercase tracking-widest mb-5">
                        Invitation
                    </div>

                    <h1 id="inviteTitle" class="text-4xl md:text-5xl font-black tracking-tight leading-[1.03] mb-4 text-slate-900">
                        You’ve been invited to <span class="text-gradient">play bingo.</span>
                    </h1>

                    <p id="inviteSubtitle" class="text-lg text-slate-500 max-w-2xl leading-relaxed font-body mb-6">
                        Continue to join this activity. Your board will contain 15 random squares from the creator’s full event list.
                    </p>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-7">
                        <div class="rounded-[1.5rem] border border-slate-200 bg-white/70 p-5">
                            <div class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Created</div>
                            <div id="createdText" class="font-bold text-slate-900">Checking…</div>
                        </div>
                        <div class="rounded-[1.5rem] border border-slate-200 bg-white/70 p-5">
                            <div class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Possible events</div>
                            <div id="poolText" class="font-bold text-slate-900">—</div>
                        </div>
                        <div class="rounded-[1.5rem] border border-slate-200 bg-white/70 p-5">
                            <div class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Board size</div>
                            <div class="font-bold text-slate-900">15 random squares</div>
                        </div>
                    </div>

                    <div id="inviteLinkWrap" class="rounded-[1.5rem] border border-slate-200 bg-slate-50 p-4 mb-7">
                        <div class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-2">Invite link</div>
                        <div class="flex flex-col sm:flex-row gap-3">
                            <input id="inviteLinkInput" readonly class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white text-slate-700 text-sm focus:outline-none">
                            <button id="copyInviteBtn" class="whitespace-nowrap bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3 rounded-2xl shadow-lg hover:shadow-indigo-500/30 transition-all">
                                Copy link
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <button id="continueBtn" class="bg-slate-900 hover:bg-indigo-600 text-white font-bold py-4 px-5 rounded-2xl transition-all">
                            Yes, continue
                        </button>
                        <a href="/" class="text-center surface-glass hover:bg-white text-slate-700 border border-slate-200 font-bold py-4 px-5 rounded-2xl shadow-sm transition-all">
                            No thanks
                        </a>
                        <button id="copyInviteBtnSecondary" class="surface-glass hover:bg-white text-slate-700 border border-slate-200 font-bold py-4 px-5 rounded-2xl shadow-sm transition-all">
                            Copy link
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const rawData = new URLSearchParams(location.search).get("data");
        const MATERIAL_ID = "LW8tLXYtQ3VzdG9tIEJpbmdv";
        const MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;

        const inviteTitle = document.getElementById("inviteTitle");
        const inviteSubtitle = document.getElementById("inviteSubtitle");
        const createdText = document.getElementById("createdText");
        const poolText = document.getElementById("poolText");
        const inviteLinkInput = document.getElementById("inviteLinkInput");
        const copyInviteBtn = document.getElementById("copyInviteBtn");
        const copyInviteBtnSecondary = document.getElementById("copyInviteBtnSecondary");
        const continueBtn = document.getElementById("continueBtn");

        function redirect404() {
            window.location.replace("/404.html");
        }

        function decodePayload(raw) {
            let b64 = raw.replace(/-/g, "+").replace(/_/g, "/");
            while (b64.length % 4) b64 += "=";
            const binary = atob(b64);
            const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
            const json = new TextDecoder().decode(bytes);
            return JSON.parse(json);
        }

        function formatDateTime(iso) {
            const date = new Date(iso);
            if (Number.isNaN(date.getTime())) return "Unknown";
            return date.toLocaleString(undefined, {
                year: "numeric",
                month: "short",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit"
            });
        }

        async function copyText(value, button) {
            try {
                await navigator.clipboard.writeText(value);
            } catch {
                const temp = document.createElement("textarea");
                temp.value = value;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand("copy");
                temp.remove();
            }

            const original = button.textContent;
            button.textContent = "Copied";
            setTimeout(() => button.textContent = original, 1400);
        }

        function isValidPayload(payload) {
            if (!payload || typeof payload !== "object") return false;
            if (!Array.isArray(payload.entries)) return false;
            if (payload.entries.length < 15 || payload.entries.length > 25) return false;
            if (typeof payload.createdAt !== "string" || !payload.createdAt.trim()) return false;

            const createdMs = new Date(payload.createdAt).getTime();
            if (!Number.isFinite(createdMs)) return false;

            const age = Date.now() - createdMs;
            if (age < 0) return false;
            if (age > MAX_AGE_MS) return false;

            for (const entry of payload.entries) {
                if (typeof entry !== "string") return false;
                if (!entry.trim()) return false;
            }

            return true;
        }

        if (!rawData) {
            redirect404();
        } else {
            try {
                const payload = decodePayload(rawData);

                if (!isValidPayload(payload)) {
                    redirect404();
                } else {
                    if (payload.name && payload.name.trim()) {
                        inviteTitle.innerHTML = `You’ve been invited to <span class="text-gradient">${payload.name.trim()}</span>.`;
                    }

                    inviteSubtitle.textContent = "Would you like to continue and generate your player board? You’ll receive 15 random squares from the creator’s full event list.";
                    createdText.textContent = formatDateTime(payload.createdAt);
                    poolText.textContent = `${payload.entries.length} possible events`;

                    const inviteLink = location.href;
                    inviteLinkInput.value = inviteLink;

                    copyInviteBtn.addEventListener("click", () => copyText(inviteLink, copyInviteBtn));
                    copyInviteBtnSecondary.addEventListener("click", () => copyText(inviteLink, copyInviteBtnSecondary));

                    continueBtn.addEventListener("click", () => {
                        location.href = `/resource_database/material.html?material-ID=${encodeURIComponent(MATERIAL_ID)}&data=${encodeURIComponent(rawData)}#primary-access`;
                    });
                }
            } catch {
                redirect404();
            }
        }
    </script>
</body>
</html>
