<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBase Resource Loader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #f8fafc; /* Slate-50 */
            color: #0f172a; /* Slate-900 */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        /* --- COOLER ANIMATION: ELASTIC SNAP --- */
        .cinematic-entry {
            animation: snap-in 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            white-space: nowrap;
            position: relative;
        }

        @keyframes snap-in {
            0% {
                letter-spacing: 1.5em; /* Start VERY far apart */
                opacity: 0;
                filter: blur(20px); /* Motion Blur */
                transform: scale(1.2);
            }
            50% {
                opacity: 1;
                filter: blur(0px);
            }
            70% {
                letter-spacing: -0.08em; /* Overshoot: Too close/Squish */
                transform: scale(1);
            }
            100% {
                letter-spacing: -0.02em; /* Settle: Perfect */
            }
        }

        /* --- SHIMMER EFFECT --- */
        /* A light beam that passes over the text after it lands */
        .shimmer-mask {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        
        .shimmer-mask::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(to right, transparent 0%, rgba(59, 130, 246, 0.4) 50%, transparent 100%);
            transform: skewX(-20deg) translateX(-150%);
            z-index: 10;
            animation: shimmer-pass 2.5s infinite;
            animation-delay: 1s; /* Wait for text to land */
        }

        @keyframes shimmer-pass {
            0% { transform: skewX(-20deg) translateX(-150%); }
            20% { transform: skewX(-20deg) translateX(150%); } /* Fast pass */
            100% { transform: skewX(-20deg) translateX(150%); }
        }

        /* --- UTILS --- */
        .logo-text {
            font-size: 5rem; /* Big and bold */
            font-weight: 900;
            color: #0f172a;
            line-height: 1;
        }
        
        .blue-dot { color: #3b82f6; }

        /* Background Blob */
        .bg-glow {
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse-glow 3s infinite alternate;
        }
        @keyframes pulse-glow { 0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } }

        /* Loader Line */
        .loader-line {
            width: 0%; height: 4px;
            background: #3b82f6;
            position: absolute; top: 0; left: 0;
            box-shadow: 0 0 20px rgba(59,130,246,0.6);
            transition: width 0.1s linear;
        }

        /* Mobile Responsive */
        @media (max-width: 640px) {
            .logo-text { font-size: 2.5rem; }
            @keyframes snap-in {
                0% { letter-spacing: 0.8em; opacity: 0; filter: blur(10px); }
                70% { letter-spacing: -0.05em; }
                100% { letter-spacing: normal; }
            }
        }
    </style>
</head>
<body class="relative selection:bg-blue-200">

    <div id="loader-line" class="loader-line"></div>

    <div class="bg-glow"></div>

    <div class="z-10 flex flex-col items-center justify-center w-full px-4 text-center">
        
        <div class="shimmer-mask">
            <div class="cinematic-entry">
                <h1 class="logo-text">
                    StudyBase<span class="blue-dot">.site</span>
                </h1>
            </div>
        </div>

        <div class="mt-6 overflow-hidden h-6">
            <div class="text-slate-400 font-mono text-xs tracking-[0.3em] uppercase animate-[slideUp_0.5s_ease_1s_forwards] opacity-0 translate-y-full">
                Preparing Resource...
            </div>
        </div>

    </div>

    <div id="footer-notice" class="absolute bottom-10 w-full flex justify-center px-4 transition-all duration-700 opacity-0 translate-y-4">
        </div>

    <style>
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    </style>

    <script>
        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        const footer = document.getElementById('footer-notice');
        const loaderLine = document.getElementById('loader-line');

        // Check Verification Status
        const urlParams = new URLSearchParams(window.location.search);
        const isVerified = urlParams.get('verified')?.toLowerCase() === 'true';

        async function run() {
            // 1. Setup Footer
            if (isVerified) {
                footer.innerHTML = `
                    <div class="flex items-center gap-3 px-6 py-3 bg-white border border-blue-100 rounded-full shadow-xl shadow-blue-500/5 hover:scale-105 transition-transform duration-300">
                        <div class="bg-blue-500 rounded-full p-1 text-white shadow-lg shadow-blue-500/30">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <div>
                            <div class="text-xs font-bold text-slate-700 uppercase tracking-wider">Verified Resource</div>
                        </div>
                    </div>
                `;
            } else {
                footer.innerHTML = `
                    <div class="max-w-md w-full bg-amber-50 border border-amber-200 rounded-xl p-4 shadow-sm flex gap-4 items-center text-left">
                        <div class="bg-amber-100 p-2 rounded-full shrink-0">
                            <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        </div>
                        <div>
                            <div class="text-sm font-bold text-amber-900">Community Resource</div>
                            <div class="text-xs text-amber-700 leading-tight mt-0.5">
                                Not verified by our team. <span class="font-bold underline cursor-pointer hover:text-amber-900">Report</span> if suspicious.
                            </div>
                        </div>
                    </div>
                `;
            }
            
            // Fade in footer
            setTimeout(() => {
                footer.classList.remove('opacity-0', 'translate-y-4');
            }, 500);

            // 2. Animate Progress Bar (3 seconds)
            let width = 0;
            const interval = setInterval(() => {
                width += Math.random() * 3; 
                if (width >= 100) {
                    width = 100;
                    clearInterval(interval);
                }
                loaderLine.style.width = width + '%';
            }, 60);

            // 3. Wait & Exit
            await wait(3200);

            // Exit Transition (Zoom In through the logo)
            document.body.style.transition = "opacity 0.4s ease-in, transform 0.4s ease-in";
            document.body.style.opacity = "0";
            document.body.style.transform = "scale(1.1)";
            
            await wait(400);
            window.parent.postMessage('resource_loaded', '*');
        }

        window.onload = run;
    </script>
</body>
</html>
