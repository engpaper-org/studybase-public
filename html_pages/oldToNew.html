<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Update</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #f8fafc; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .no-select { user-select: none; -webkit-user-select: none; }

    /* ---------- timing helpers ---------- */
    .t-0    { animation-delay: 0ms; }
    .t-150  { animation-delay: 150ms; }
    .t-250  { animation-delay: 250ms; }
    .t-350  { animation-delay: 350ms; }
    .t-450  { animation-delay: 450ms; }
    .t-550  { animation-delay: 550ms; }
    .t-700  { animation-delay: 700ms; }
    .t-900  { animation-delay: 900ms; }

    /* ---------- slam text ---------- */
    @keyframes slam {
      0%   { transform: translateY(-120%) scale(1.35) rotate(-2deg); opacity: 0; filter: blur(10px); }
      55%  { transform: translateY(6%) scale(0.98) rotate(0deg); opacity: 1; filter: blur(0); }
      70%  { transform: translateY(-2%) scale(1.01); }
      100% { transform: translateY(0%) scale(1); }
    }
    @keyframes shockwave {
      0%   { transform: scale(0.6); opacity: 0; }
      25%  { opacity: .45; }
      100% { transform: scale(1.55); opacity: 0; }
    }
    @keyframes shakeTiny {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
      100% { transform: translateX(0); }
    }
    .slam { animation: slam 820ms cubic-bezier(.15,.9,.2,1) both; }
    .shock { animation: shockwave 900ms ease-out both; }
    .shake { animation: shakeTiny 260ms ease-in-out 1 both; }

    /* ---------- curtains ---------- */
    @keyframes curtainInL { from { transform: translateX(-110%); } to { transform: translateX(0%); } }
    @keyframes curtainInR { from { transform: translateX(110%); } to { transform: translateX(0%); } }
    @keyframes curtainOpenL { from { transform: translateX(0%); } to { transform: translateX(-110%); } }
    @keyframes curtainOpenR { from { transform: translateX(0%); } to { transform: translateX(110%); } }

    .curtainL.in { animation: curtainInL 520ms cubic-bezier(.2,.9,.2,1) both; }
    .curtainR.in { animation: curtainInR 520ms cubic-bezier(.2,.9,.2,1) both; }
    .curtainL.open { animation: curtainOpenL 820ms cubic-bezier(.2,.9,.2,1) both; }
    .curtainR.open { animation: curtainOpenR 820ms cubic-bezier(.2,.9,.2,1) both; }

    /* ---------- general scene transitions ---------- */
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fadeOut { from { opacity: 1 } to { opacity: 0 } }
    @keyframes floatUp { from { opacity:0; transform: translateY(18px) } to { opacity:1; transform: translateY(0) } }
    @keyframes blurIn { from { opacity:0; transform: translateY(14px) scale(.99); filter: blur(8px);} to { opacity:1; transform: translateY(0) scale(1); filter: blur(0);} }

    .fadeIn { animation: fadeIn 500ms ease both; }
    .fadeOut { animation: fadeOut 520ms ease both; }
    .floatUp { animation: floatUp 700ms cubic-bezier(.2,.85,.2,1) both; }
    .blurIn { animation: blurIn 850ms cubic-bezier(.2,.85,.2,1) both; }

    /* ---------- domain pulse ---------- */
    @keyframes glowPulse {
      0%,100% { box-shadow: 0 0 0 rgba(99,102,241,0); transform: translateY(0); }
      50%     { box-shadow: 0 18px 60px rgba(99,102,241,.22); transform: translateY(-2px); }
    }
    .glowPulse { animation: glowPulse 1.4s ease-in-out infinite; }

    /* ---------- sky + stars ---------- */
    @keyframes skyShift {
      0%   { background-position: 0% 0%, 0% 0%; }
      100% { background-position: 100% 100%, -40% 60%; }
    }
    .sky {
      background-image:
        radial-gradient(circle at 20% 15%, rgba(99,102,241,.18), transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(34,211,238,.16), transparent 50%);
      background-size: 140% 140%, 140% 140%;
      animation: skyShift 6s linear infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: .35; transform: scale(1); }
      50% { opacity: .9; transform: scale(1.18); }
    }

    /* ---------- rocket ---------- */
    @keyframes rocketEnter {
      0% { transform: translate(-20vw, 25vh) rotate(-18deg) scale(.9); opacity: 0; filter: blur(6px); }
      35% { opacity: 1; filter: blur(0); }
      100% { transform: translate(0vw, 0vh) rotate(-8deg) scale(1); opacity: 1; }
    }
    @keyframes flameFlicker {
      0%,100% { transform: scaleY(1) scaleX(1); opacity: .95; }
      50% { transform: scaleY(1.18) scaleX(.92); opacity: .8; }
    }
    @keyframes smokeRise {
      0% { transform: translateY(0) scale(1); opacity: .0; }
      15% { opacity: .45; }
      100% { transform: translateY(-120px) scale(1.8); opacity: 0; }
    }
    @keyframes rocketLaunch {
      0%   { transform: translate(0,0) rotate(-8deg) scale(1); }
      15%  { transform: translate(2vw,-4vh) rotate(-10deg) scale(1.01); }
      100% { transform: translate(70vw,-90vh) rotate(-24deg) scale(1.08); }
    }
    .rocketEnter { animation: rocketEnter 900ms cubic-bezier(.2,.9,.2,1) both; }
    .rocketLaunch { animation: rocketLaunch 1600ms cubic-bezier(.2,.9,.15,1) both; }
    .flame { animation: flameFlicker 120ms ease-in-out infinite; transform-origin: top center; }

    /* ---------- scenes ---------- */
    .scene { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
    .scene.active { opacity: 1; pointer-events: auto; }
    .center { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }

    /* reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body class="no-select">
  <!-- BACKGROUND -->
  <div class="absolute inset-0 bg-slate-50">
    <div class="absolute -top-40 left-1/2 h-[720px] w-[720px] -translate-x-1/2 rounded-full bg-indigo-200/70 blur-3xl"></div>
    <div class="absolute bottom-[-220px] right-[-220px] h-[720px] w-[720px] rounded-full bg-cyan-200/60 blur-3xl"></div>
    <div class="absolute inset-0 opacity-[0.06] [background-image:linear-gradient(to_right,rgba(15,23,42,1)_1px,transparent_1px),linear-gradient(to_bottom,rgba(15,23,42,1)_1px,transparent_1px)] [background-size:84px_84px]"></div>
  </div>

  <!-- SCENE 1: SLAM TEXT -->
  <section id="s1" class="scene active">
    <div class="center">
      <div class="relative text-center">
        <div id="shockRing" class="pointer-events-none absolute left-1/2 top-1/2 h-[420px] w-[420px] -translate-x-1/2 -translate-y-1/2 rounded-full border border-indigo-300/40 opacity-0"></div>

        <h1 id="slamText" class="slam text-6xl sm:text-7xl font-black tracking-tight text-slate-900">
          NEW UPDATE
        </h1>
        <p class="mt-4 text-slate-600 text-base sm:text-lg floatUp t-350">
          One moment…
        </p>
      </div>
    </div>
  </section>

  <!-- SCENE 2: CURTAINS OPEN -->
  <section id="s2" class="scene">
    <div class="absolute inset-0">
      <!-- curtains -->
      <div id="curtainL" class="curtainL absolute inset-y-0 left-0 w-1/2 bg-gradient-to-b from-indigo-600 to-indigo-700 shadow-2xl"></div>
      <div id="curtainR" class="curtainR absolute inset-y-0 right-0 w-1/2 bg-gradient-to-b from-indigo-600 to-indigo-700 shadow-2xl"></div>

      <!-- subtle fabric lines -->
      <div class="pointer-events-none absolute inset-y-0 left-0 w-1/2 opacity-[0.18]"
           style="background-image:linear-gradient(to_right, rgba(255,255,255,.18), transparent 10%, rgba(255,255,255,.14) 22%, transparent 40%); background-size:42px 100%;"></div>
      <div class="pointer-events-none absolute inset-y-0 right-0 w-1/2 opacity-[0.18]"
           style="background-image:linear-gradient(to_left, rgba(255,255,255,.18), transparent 10%, rgba(255,255,255,.14) 22%, transparent 40%); background-size:42px 100%;"></div>
    </div>

    <div class="center">
      <div class="relative text-center">
        <h2 class="text-4xl sm:text-5xl font-extrabold text-white blurIn">
          We’ve made some huge improvements
        </h2>
        <p class="mt-4 text-white/90 text-base sm:text-lg floatUp t-250">
          Cleaner UI, smoother navigation, and more space for new resources.
        </p>
      </div>
    </div>
  </section>

  <!-- SCENE 3: NEW DOMAIN -->
  <section id="s3" class="scene">
    <div class="center">
      <div class="max-w-3xl w-full text-center">
        <p class="text-slate-500 text-sm font-semibold tracking-wide floatUp">
          We have a new domain
        </p>

        <div class="mt-5 inline-flex items-center gap-3 rounded-3xl border border-slate-200 bg-white/80 px-6 py-4 shadow-xl glowPulse blurIn">
          <div class="h-10 w-10 rounded-2xl bg-indigo-100 grid place-items-center">
            <svg class="h-5 w-5 text-indigo-600" viewBox="0 0 24 24" fill="none">
              <path d="M12 2l7 4v12l-7 4-7-4V6l7-4Z" stroke="currentColor" stroke-width="1.8"/>
              <path d="M9.5 12h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="text-left">
            <p class="text-xs text-slate-500">New home</p>
            <p class="text-2xl sm:text-3xl font-black tracking-tight text-slate-900">studybase.site</p>
          </div>
        </div>

        <p class="mt-6 text-slate-600 text-base sm:text-lg floatUp t-250">
          Same idea, better home.
        </p>
      </div>
    </div>
  </section>

  <!-- SCENE 4: ROCKET + LAUNCH + REDIRECT -->
  <section id="s4" class="scene">
    <div class="absolute inset-0 sky"></div>

    <!-- stars -->
    <div id="stars" class="absolute inset-0 pointer-events-none"></div>

    <div class="center">
      <div class="max-w-3xl w-full text-center">
        <h3 class="text-4xl sm:text-5xl font-extrabold text-slate-900 blurIn">
          Hold on while we send you there
        </h3>
        <p class="mt-4 text-slate-700 text-base sm:text-lg floatUp t-250">
          Redirecting to <span class="font-semibold text-slate-900">studybase.site</span>
        </p>

        <div class="mt-8 mx-auto max-w-xl rounded-2xl border border-slate-200 bg-white/75 px-5 py-4 shadow-lg blurIn t-350">
          <div class="flex items-center justify-between text-xs text-slate-500">
            <span>Launching</span>
            <span id="count">3</span>s
          </div>
          <div class="mt-3 h-2 w-full rounded-full bg-slate-100 border border-slate-200 overflow-hidden">
            <div id="bar" class="h-full w-0 rounded-full bg-indigo-600"></div>
          </div>
        </div>

        <!-- Rocket stage -->
        <div class="relative mt-10 h-40 sm:h-44">
          <div id="rocketWrap" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
            <!-- Rocket -->
            <div id="rocket" class="rocketEnter relative">
              <!-- body -->
              <div class="relative h-28 w-28 sm:h-32 sm:w-32 rotate-0">
                <div class="absolute left-1/2 top-1/2 h-24 w-14 -translate-x-1/2 -translate-y-1/2 rounded-[999px] bg-white border border-slate-200 shadow-xl"></div>

                <!-- nose -->
                <div class="absolute left-1/2 top-[6px] h-10 w-10 -translate-x-1/2 rotate-45 rounded-2xl bg-indigo-600 shadow-md"></div>

                <!-- window -->
                <div class="absolute left-1/2 top-[52%] h-8 w-8 -translate-x-1/2 -translate-y-1/2 rounded-full bg-cyan-200 border border-slate-200 shadow-inner"></div>

                <!-- fins -->
                <div class="absolute left-[24%] top-[64%] h-8 w-8 -translate-x-1/2 -translate-y-1/2 rotate-12 rounded-2xl bg-indigo-500/90 shadow-md"></div>
                <div class="absolute right-[24%] top-[64%] h-8 w-8 translate-x-1/2 -translate-y-1/2 -rotate-12 rounded-2xl bg-indigo-500/90 shadow-md"></div>

                <!-- flame -->
                <div class="absolute left-1/2 bottom-[6px] -translate-x-1/2">
                  <div class="flame h-12 w-10 rounded-b-[999px] rounded-t-3xl bg-gradient-to-b from-amber-300 via-orange-400 to-rose-500 shadow-[0_18px_40px_rgba(244,63,94,.25)]"></div>
                </div>

                <!-- smoke puffs -->
                <div id="smoke" class="absolute left-1/2 bottom-[-6px] -translate-x-1/2"></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <script>
    const NEW_URL = "https://studybase.site";

    const s1 = document.getElementById("s1");
    const s2 = document.getElementById("s2");
    const s3 = document.getElementById("s3");
    const s4 = document.getElementById("s4");

    const slamText = document.getElementById("slamText");
    const shockRing = document.getElementById("shockRing");

    const curtainL = document.getElementById("curtainL");
    const curtainR = document.getElementById("curtainR");

    const rocket = document.getElementById("rocket");
    const rocketWrap = document.getElementById("rocketWrap");
    const smoke = document.getElementById("smoke");

    const stars = document.getElementById("stars");
    const bar = document.getElementById("bar");
    const countEl = document.getElementById("count");

    // Build stars
    (function makeStars() {
      const n = 38;
      for (let i = 0; i < n; i++) {
        const d = document.createElement("div");
        const size = 2 + Math.random() * 3;
        d.className = "absolute rounded-full bg-white";
        d.style.left = (Math.random() * 100) + "%";
        d.style.top = (Math.random() * 70) + "%";
        d.style.width = size + "px";
        d.style.height = size + "px";
        d.style.opacity = (0.18 + Math.random() * 0.5).toFixed(2);
        d.style.filter = "blur(0.2px)";
        d.style.animation = `twinkle ${1.6 + Math.random() * 2.4}s ease-in-out ${Math.random() * 1.5}s infinite`;
        stars.appendChild(d);
      }
    })();

    function show(from, to) {
      from.classList.remove("active");
      to.classList.add("active");
    }

    // Scene durations to total ~10s
    // s1 2.0s, s2 2.6s, s3 2.0s, s4 3.4s
    const T1 = 2000;
    const T2 = 2600;
    const T3 = 2000;
    const T4 = 3400;

    // Shock ring + tiny shake on slam
    setTimeout(() => {
      shockRing.classList.add("shock");
      slamText.classList.add("shake");
      setTimeout(() => slamText.classList.remove("shake"), 300);
    }, 220);

    // Move to scene 2
    setTimeout(() => {
      show(s1, s2);

      // curtains come in, then open
      curtainL.classList.add("in");
      curtainR.classList.add("in");

      setTimeout(() => {
        curtainL.classList.remove("in");
        curtainR.classList.remove("in");
        curtainL.classList.add("open");
        curtainR.classList.add("open");
      }, 1150);

    }, T1);

    // Move to scene 3
    setTimeout(() => {
      show(s2, s3);
    }, T1 + T2);

    // Move to scene 4 (rocket)
    setTimeout(() => {
      show(s3, s4);

      // Smoke puffs while waiting
      let smokeInterval = setInterval(() => {
        const puff = document.createElement("div");
        const size = 18 + Math.random() * 18;
        puff.className = "absolute left-1/2 -translate-x-1/2 rounded-full bg-white/70 border border-slate-200";
        puff.style.width = size + "px";
        puff.style.height = size + "px";
        puff.style.bottom = (-6 - Math.random() * 6) + "px";
        puff.style.opacity = "0";
        puff.style.filter = "blur(0.4px)";
        puff.style.animation = "smokeRise 900ms ease-out both";
        smoke.appendChild(puff);
        setTimeout(() => puff.remove(), 950);
      }, 120);

      // countdown + progress + launch
      const start = performance.now();
      const duration = T4; // 3.4s
      const launchAt = duration * 0.55; // launch mid-way

      function tick(now) {
        const elapsed = Math.min(duration, now - start);
        const pct = (elapsed / duration) * 100;
        bar.style.width = pct.toFixed(2) + "%";

        const secsLeft = Math.max(0, Math.ceil((duration - elapsed) / 1000));
        countEl.textContent = secsLeft;

        // trigger launch once
        if (elapsed >= launchAt && !rocketWrap.dataset.launched) {
          rocketWrap.dataset.launched = "1";
          // stop smoke spam soon after launch
          setTimeout(() => { clearInterval(smokeInterval); }, 350);

          // rocket flies off screen
          rocket.classList.remove("rocketEnter");
          rocket.classList.add("rocketLaunch");
        }

        if (elapsed >= duration) {
          window.location.href = NEW_URL;
          return;
        }
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);

    }, T1 + T2 + T3);
  </script>
</body>
</html>
