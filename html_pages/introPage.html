<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
        <script src="/assets/js/siteConfig.js"></script>
<script>
        (function () {
            try {
                const isDark = String(localStorage.getItem('darkMode') || '').toLowerCase() === 'true';
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/assets/css/dark-mode.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevisionBase.site - Loading</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            /* --- EDIT NAME HERE --- */
            --site-name: "RevisionBase.site";
            
            --bg-color: #f8fafc;
            --deep-blue: #0f172a;
            --electric-blue: #3b82f6;
            --accent-cyan: #06b6d4;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        #intro-stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        /* --- BACKGROUND TECH --- */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(59, 130, 246, 0.15);
            z-index: 0;
        }
        .ring-1 { width: 600px; height: 600px; animation: spin 20s linear infinite; }
        .ring-2 { width: 450px; height: 450px; border-color: rgba(6, 182, 212, 0.2); animation: spin 15s linear infinite reverse; }

        /* --- INTRO CONTENT --- */
        .intro-content {
            text-align: center;
            z-index: 10;
            /* Lifts logo up to make room for loader */
            animation: liftLogo 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 3s;
        }

        .intro-tag {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            color: var(--electric-blue);
            letter-spacing: 12px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInTrack 1s ease-out forwards 0.5s;
        }

        .logo-container {
            position: relative;
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--deep-blue);
            overflow: hidden;
            padding: 5px 20px;
        }

        .main-text {
            display: inline-block;
            transform: translateY(110%);
            animation: textRise 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.2s;
        }
        .main-text::after { content: var(--site-name); }

        .accent-line {
            height: 4px;
            background: linear-gradient(90deg, var(--electric-blue), var(--accent-cyan));
            width: 0;
            margin: 5px auto;
            box-shadow: 0 0 15px var(--electric-blue);
            animation: expandLine 0.6s ease-out forwards 1.5s;
        }

        .shine-bar {
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            transform: skewX(-20deg);
            animation: shinePass 0.8s ease-in-out forwards 2.2s;
        }

        /* --- INFINITE LOADING UI --- */
        .loading-ui {
            position: absolute;
            bottom: 25%;
            width: 320px;
            opacity: 0;
            transform: translateY(20px);
            animation: loadingFadeIn 0.5s ease-out forwards 3.3s;
            text-align: center;
        }

        /* The Infinite Pulse Bar */
        .loader-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(15, 23, 42, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
        }

        .loader-bar-glow {
            position: absolute;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, transparent, var(--electric-blue), var(--accent-cyan), transparent);
            box-shadow: 0 0 15px var(--electric-blue);
            animation: infiniteFlow 1.5s infinite linear;
        }

        .loading-status {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--deep-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Small spinning gear/icon */
        .status-icon {
            width: 14px;
            height: 14px;
            border: 2px solid var(--electric-blue);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* --- KEYFRAMES --- */
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        @keyframes fadeInTrack {
            0% { opacity: 0; letter-spacing: 25px; filter: blur(10px); }
            100% { opacity: 1; letter-spacing: 12px; filter: blur(0); }
        }

        @keyframes textRise { to { transform: translateY(0); } }
        @keyframes expandLine { to { width: 100%; } }
        @keyframes shinePass { from { left: -100%; } to { left: 200%; } }

        @keyframes liftLogo {
            to { transform: translateY(-40px) scale(0.85); }
        }

        @keyframes loadingFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* The actual infinite motion */
        @keyframes infiniteFlow {
            0% { left: -50%; }
            100% { left: 110%; }
        }

        /* Hidden Class for later */
        .hide-intro {
            opacity: 0 !important;
            visibility: hidden !important;
        }

    </style>
</head>
<body>

    <div id="intro-stage">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>

        <div class="intro-content">
            <div class="intro-tag">Brought to you by</div>
            <div class="logo-container">
                <span class="main-text"></span>
                <div class="shine-bar"></div>
            </div>
            <div class="accent-line"></div>
        </div>

        <div class="loading-ui">
            <div class="loader-bar-bg">
                <div class="loader-bar-glow"></div>
            </div>
            <div class="loading-status">
                <div class="status-icon"></div>
                <span>Loading Resource...</span>
            </div>
        </div>
    </div>

    <script>
        window.finishLoading = function() {
            document.getElementById('intro-stage').classList.add('hide-intro');
        };

        // For demo purposes, I will hide it after 10 seconds. 
        // You should remove this line and call finishLoading() when your site is ready.
        // setTimeout(window.finishLoading, 10000); 
    </script>

</body>
</html>
