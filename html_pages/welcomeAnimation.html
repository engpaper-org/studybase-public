<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study Base Intro</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f8fafc;
      overflow: hidden;
    }
  </style>
</head>
<body class="font-sans antialiased">

  <div class="relative flex flex-col items-center justify-center w-full h-full text-center px-4">
    
    <div id="hero-group" class="transition-all duration-500 ease-in-out transform">
      <div id="main-title" class="text-6xl md:text-8xl font-black text-slate-900 tracking-tight opacity-0 -translate-y-8 transition-all duration-500 ease-out">
        STUDY <span class="bg-gradient-to-r from-amber-400 to-amber-600 bg-clip-text text-transparent">BASE</span>
      </div>
      <div id="subtitle" class="mt-4 text-2xl md:text-4xl font-bold text-slate-600 opacity-0 translate-y-8 transition-all duration-500 ease-out">
        The premium way to revise.
      </div>
    </div>

    <div id="warning-msg" class="absolute text-xl md:text-3xl font-semibold text-slate-800 opacity-0 scale-90 blur-md transition-all duration-500 ease-out tracking-wide">
      Please use responsibly.
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
      
      const heroGroup = document.getElementById("hero-group");
      const mainTitle = document.getElementById("main-title");
      const subtitle = document.getElementById("subtitle");
      const warningMsg = document.getElementById("warning-msg");

      // Small initial delay so it doesn't fire before the screen paints
      await wait(100);

      // 1. Title drops in
      mainTitle.classList.remove("opacity-0", "-translate-y-8");
      
      // 2. Subtitle slides up quickly after
      await wait(200); 
      subtitle.classList.remove("opacity-0", "translate-y-8");

      // Hold on screen to read
      await wait(1400);

      // 3. Zoom/Fade out the hero group
      heroGroup.classList.add("opacity-0", "scale-110");
      
      // 4. Snap the warning message into focus
      await wait(300); // Slight overlap with the fade out
      warningMsg.classList.remove("opacity-0", "scale-90", "blur-md");

      // Hold the warning on screen
      await wait(1200);

      // 5. Fade warning out completely
      warningMsg.classList.add("opacity-0");
      await wait(500); // Wait for the fade out to finish visually

      // Tell the parent iframe/window that we are done
      window.parent.postMessage("animation_complete", "*");
    });
  </script>
</body>
</html>
