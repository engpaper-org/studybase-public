<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudyBase | Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/core/services.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <main class="mx-auto max-w-3xl px-5 py-10">
    <a href="/myaccount/account.html" class="text-sm font-bold text-purple-700">&larr; Account</a>
    <header class="mt-5"><p class="text-xs font-black uppercase tracking-[.2em] text-purple-600">Server synced</p><h1 class="mt-2 text-4xl font-black">Settings</h1><p class="mt-2 text-slate-500">These preferences follow your StudyBase account.</p></header>
    <div id="message" class="mt-6 hidden rounded-xl p-4 text-sm"></div>
    <form id="settings" class="mt-7 space-y-5 rounded-3xl border bg-white p-6 shadow-sm sm:p-8">
      <label class="block text-sm font-bold">First name<input id="firstName" name="firstName" maxlength="15" pattern="[a-z]{1,15}" required class="mt-2 w-full rounded-xl border border-slate-300 p-4"><span class="mt-2 block text-xs font-normal text-slate-500">Lowercase a-z only, no spaces, maximum 15 characters.</span></label>
      <label class="flex gap-4 rounded-2xl bg-slate-50 p-5"><input id="contentWarnings" name="contentWarnings" type="checkbox" class="mt-1 h-5 w-5 accent-purple-600"><span><strong class="block">Content warnings</strong><span class="mt-1 block text-sm text-slate-500">Show safety notices before potentially sensitive content.</span></span></label>
      <button class="w-full rounded-xl bg-purple-600 p-4 font-black text-white">Save settings</button>
    </form>
    <div class="mt-6 grid gap-4 sm:grid-cols-2"><a id="password" href="https://auth.studybase.site/change-password" class="block rounded-2xl border bg-white p-5"><strong>Change password</strong><span class="mt-1 block text-sm text-slate-500">Set a new password and sign out other sessions.</span></a><a id="delete" href="https://auth.studybase.site/delete" class="block rounded-2xl border border-amber-200 bg-amber-50 p-5"><strong class="text-amber-950">Delete account</strong><span class="mt-1 block text-sm text-amber-800">Confirm your password and permanently remove the account.</span></a></div>
  </main>
  <script>
    const form = document.getElementById("settings");
    const message = document.getElementById("message");
    const firstName = document.getElementById("firstName");
    const contentWarnings = document.getElementById("contentWarnings");
    function show(text, bad = false) {
      message.textContent = text;
      message.className = `mt-6 rounded-xl p-4 text-sm ${bad ? "bg-red-50 text-red-800" : "bg-emerald-50 text-emerald-800"}`;
    }
    async function load() {
      const result = await StudyBaseServices.request("/me");
      if (!result.ok || !result.user) { location.replace("/myaccount/login.html?sessionExpired=true"); return; }
      firstName.value = result.user.name || "";
      contentWarnings.checked = result.user.settings?.contentWarnings !== false;
      document.getElementById("delete").href = `https://auth.studybase.site/delete?username=${encodeURIComponent(result.user.username)}`;
      document.getElementById("password").href = `https://auth.studybase.site/change-password?username=${encodeURIComponent(result.user.username)}`;
      localStorage.setItem("studybase_user", JSON.stringify(result.user));
    }
    form.onsubmit = async event => {
      event.preventDefault();
      const profile = await StudyBaseServices.request("/profile", { method: "POST", body: JSON.stringify({ firstName: firstName.value }) });
      if (!profile.ok) { show(profile.error || "Could not save name", true); return; }
      const settings = await StudyBaseServices.request("/settings", { method: "POST", body: JSON.stringify({ contentWarnings: contentWarnings.checked }) });
      if (!settings.ok) { show(settings.error || "Could not save settings", true); return; }
      localStorage.setItem("studybase_user", JSON.stringify(settings.user));
      show("Settings saved.");
    };
    load().catch(() => show("Settings could not be loaded.", true));
  </script>
</body>
</html>
