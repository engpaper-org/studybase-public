<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Sign in to a StudyBase account.">
  <title>StudyBase | Login</title>
  <link rel="icon" href="/assets/images/site-icons/main.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.35); }
      50%       { box-shadow: 0 0 0 18px rgba(139, 92, 246, 0); }
    }
    @keyframes statusFadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .animate-slide-up  { animation: slideUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-fade-in   { animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .delay-100  { animation-delay: 80ms; }
    .delay-200  { animation-delay: 180ms; }
    .delay-300  { animation-delay: 280ms; }
    .delay-400  { animation-delay: 380ms; }
    .delay-500  { animation-delay: 480ms; }
    .delay-600  { animation-delay: 580ms; }

    /* ── Loading modal overlay ─────────────────────────────────── */
    #login-loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(8, 8, 20, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: overlayIn 0.35s ease both;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }
    #login-loading-overlay.active { display: flex; }

    /* Triple ring spinner */
    .login-spinner {
      position: relative;
      width: 80px;
      height: 80px;
      flex-shrink: 0;
    }
    .login-spinner-track {
      position: absolute;
      inset: 0;
      border: 4px solid rgba(255,255,255,0.08);
      border-radius: 50%;
    }
    .login-spinner-ring-1 {
      position: absolute;
      inset: 0;
      border: 4px solid transparent;
      border-top-color: #a78bfa;
      border-right-color: #a78bfa;
      border-radius: 50%;
      animation: spinRing 0.85s linear infinite;
    }
    .login-spinner-ring-2 {
      position: absolute;
      inset: 10px;
      border: 4px solid transparent;
      border-bottom-color: #38bdf8;
      border-left-color: #38bdf8;
      border-radius: 50%;
      animation: spinRing 1.25s linear infinite reverse;
    }
    .login-spinner-ring-3 {
      position: absolute;
      inset: 20px;
      border: 4px solid transparent;
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spinRing 1.65s linear infinite;
    }

    .login-loading-status {
      animation: statusFadeSlide 0.4s ease both;
    }

    /* ── Inputs ───────────────────────────────────────────────── */
    .login-input {
      width: 100%;
      border-radius: 16px;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      padding: 0.95rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .login-input:focus {
      border-color: #8b5cf6;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
    }
    .login-input:hover:not(:focus) {
      border-color: #c4b5fd;
    }

    /* ── Submit button ────────────────────────────────────────── */
    .login-btn {
      width: 100%;
      border-radius: 16px;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      padding: 1rem;
      font-weight: 900;
      font-size: 0.95rem;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      box-shadow: 0 8px 32px rgba(109, 40, 217, 0.35), 0 2px 6px rgba(109,40,217,0.25);
      animation: pulseGlow 2.8s ease-in-out infinite;
    }
    .login-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 40px rgba(109, 40, 217, 0.45), 0 2px 6px rgba(109,40,217,0.3);
    }
    .login-btn:active:not(:disabled) { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.55; cursor: not-allowed; animation: none; }

    /* ── Page background ─────────────────────────────────────── */
    body {
      background: radial-gradient(ellipse at 30% 0%, #ede9fe 0%, #f8fafc 40%, #eef2ff 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="min-h-screen text-slate-900 antialiased flex items-center justify-center p-4">

  <!-- ── Loading Modal Overlay ──────────────────────────────── -->
  <div id="login-loading-overlay" role="status" aria-live="polite" aria-label="Authenticating">
    <div class="login-spinner" aria-hidden="true">
      <div class="login-spinner-track"></div>
      <div class="login-spinner-ring-1"></div>
      <div class="login-spinner-ring-2"></div>
      <div class="login-spinner-ring-3"></div>
    </div>
    <div class="flex flex-col items-center gap-2 text-center">
      <p id="loading-status-text" class="login-loading-status text-white font-black text-lg tracking-tight">
        Initiating secure handshake...
      </p>
      <p class="text-white/45 font-semibold text-sm">Please wait — do not close this window</p>
    </div>
    <!-- Progress dots -->
    <div class="flex gap-2" aria-hidden="true">
      <span id="dot-1" class="w-2 h-2 rounded-full bg-violet-400 opacity-100 transition-opacity duration-500"></span>
      <span id="dot-2" class="w-2 h-2 rounded-full bg-sky-400 opacity-30 transition-opacity duration-500"></span>
      <span id="dot-3" class="w-2 h-2 rounded-full bg-emerald-400 opacity-30 transition-opacity duration-500"></span>
    </div>
  </div>

  <!-- ── Main Login Card ────────────────────────────────────── -->
  <main class="w-full max-w-md animate-fade-in">
    <div class="rounded-[2rem] bg-white/90 backdrop-blur-xl border border-slate-200/80 shadow-[0_32px_80px_-20px_rgba(15,23,42,0.22),0_0_0_1px_rgba(255,255,255,0.9)] p-8 sm:p-10">

      <!-- Logo + header -->
      <div class="flex flex-col items-center text-center mb-8 animate-slide-up delay-100">
        <div class="mb-5 w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-700 flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-purple-500/30">
          S
        </div>
        <p class="text-xs font-black uppercase tracking-[.22em] text-purple-600 mb-2">Secure account access</p>
        <h1 class="text-3xl font-black tracking-tight text-slate-900">Welcome back</h1>
        <p class="mt-2 text-sm text-slate-500 font-semibold">Sign in to your StudyBase workspace</p>
      </div>

      <!-- Error message -->
      <div id="message" class="hidden mb-5 rounded-2xl bg-red-50 border border-red-200 p-4 text-sm font-semibold text-red-800 flex items-start gap-2" role="alert">
        <svg class="w-4 h-4 mt-0.5 shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="message-text"></span>
      </div>

      <!-- Form -->
      <form id="login" class="space-y-5" novalidate>
        <div class="animate-slide-up delay-200">
          <label class="block text-sm font-black text-slate-700 mb-1.5" for="login-username">Username</label>
          <input
            id="login-username"
            name="username"
            type="text"
            required
            minlength="3"
            maxlength="24"
            autocomplete="username"
            placeholder="Your username"
            class="login-input"
          >
        </div>

        <div class="animate-slide-up delay-300">
          <label class="block text-sm font-black text-slate-700 mb-1.5" for="login-password">Password</label>
          <input
            id="login-password"
            name="password"
            type="password"
            required
            minlength="8"
            maxlength="128"
            autocomplete="current-password"
            placeholder="Your password"
            class="login-input"
          >
        </div>

        <div class="animate-slide-up delay-400 pt-1">
          <button id="login-submit" type="submit" class="login-btn">Sign in securely</button>
        </div>
      </form>

      <!-- Divider + signup -->
      <div class="mt-7 pt-6 border-t border-slate-100 text-center animate-slide-up delay-500">
        <p class="text-sm text-slate-500 font-semibold mb-3">New to StudyBase?</p>
        <a
          href="https://auth.studybase.site/signup"
          class="inline-flex w-full items-center justify-center rounded-xl border border-purple-200 bg-purple-50 px-4 py-3 font-black text-sm text-purple-700 hover:bg-purple-100 transition-all duration-200"
        >
          Sign up for the beta
        </a>
      </div>

      <!-- Legal links -->
      <p class="mt-5 text-center text-xs text-slate-400 animate-slide-up delay-600">
        <a class="underline hover:text-slate-600 transition-colors" href="/legal/privacy.html">Privacy</a>
        &nbsp;·&nbsp;
        <a class="underline hover:text-slate-600 transition-colors" href="/legal/tos.html">Terms</a>
      </p>
    </div>
  </main>

  <script>
    const API = "https://auth.studybase.site/api";
    const form = document.getElementById("login");
    const messageEl = document.getElementById("message");
    const messageText = document.getElementById("message-text");
    const loadingOverlay = document.getElementById("login-loading-overlay");
    const loadingStatusText = document.getElementById("loading-status-text");

    const requestedUsername = new URLSearchParams(location.search).get("username");
    if (requestedUsername) form.elements.username.value = requestedUsername;

    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

    function showMessage(msg) {
      messageText.textContent = msg;
      messageEl.classList.remove("hidden");
    }
    function hideMessage() {
      messageEl.classList.add("hidden");
    }

    function setLoadingStatus(text, activeDot) {
      loadingStatusText.style.animation = "none";
      void loadingStatusText.offsetWidth; // reflow to restart animation
      loadingStatusText.style.animation = "";
      loadingStatusText.textContent = text;
      [1, 2, 3].forEach(i => {
        document.getElementById(`dot-${i}`).style.opacity = i === activeDot ? "1" : "0.25";
      });
    }

    function showLoading() {
      loadingOverlay.classList.add("active");
    }
    function hideLoading() {
      loadingOverlay.classList.remove("active");
    }
    function showOldLoginModal(serverResponseCode) {
      document.getElementById("old-login-modal")?.remove();
      const modal = document.createElement("div");
      modal.id = "old-login-modal";
      modal.className = "fixed inset-0 z-[10000] flex items-center justify-center bg-slate-950/75 p-4 backdrop-blur-sm";
      modal.innerHTML = `
        <div class="w-full max-w-lg rounded-[2rem] bg-white p-7 text-center text-slate-900 shadow-2xl">
          <p class="text-xs font-black uppercase tracking-[.24em] text-purple-600">Old login detected</p>
          <h2 class="mt-3 text-3xl font-black">OOPS!</h2>
          <p class="mt-3 text-sm font-semibold leading-6 text-slate-600">
            This was the old way to login. Please click the signup for beta button and enter this code as the beta code:
          </p>
          <div class="mt-5 rounded-2xl border border-purple-200 bg-purple-50 p-4">
            <p class="text-xs font-black uppercase tracking-[.2em] text-purple-500">Beta code</p>
            <p data-beta-code class="mt-2 break-all font-mono text-2xl font-black text-purple-800"></p>
          </div>
          <div class="mt-6 grid gap-3 sm:grid-cols-2">
            <button data-signup type="button" class="rounded-xl bg-purple-600 px-5 py-3 font-black text-white hover:bg-purple-700">Sign up for beta</button>
            <button data-close type="button" class="rounded-xl border border-slate-200 px-5 py-3 font-black text-slate-700 hover:bg-slate-50">Close</button>
          </div>
        </div>`;
      modal.querySelector("[data-beta-code]").textContent = serverResponseCode || "Use the beta code shown by the server";
      modal.querySelector("[data-close]").onclick = () => modal.remove();
      modal.querySelector("[data-signup]").onclick = () => {
        location.href = "https://auth.studybase.site/signup";
      };
      document.body.appendChild(modal);
    }

    async function passwordPrehash(password) {
      const bytes = new TextEncoder().encode(String(password).normalize("NFKC"));
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    function decodeBase64url(value) {
      const raw = atob(String(value).replace(/-/g, "+").replace(/_/g, "/"));
      return Uint8Array.from(raw, c => c.charCodeAt(0));
    }
    async function legacyVerifier(password, salt, iterations) {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(password).normalize("NFKC")), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: decodeBase64url(salt), iterations }, material, 256);
      return btoa(String.fromCharCode(...new Uint8Array(bits))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      hideMessage();

      const button = document.getElementById("login-submit");
      button.disabled = true;

      // Show loading overlay
      showLoading();

      try {
        // Step 1 — Initiate handshake
        setLoadingStatus("🔒 Initiating secure handshake...", 1);
        await delay(1000);

        // Step 2 — Verify credentials
        setLoadingStatus("🔑 Verifying workspace credentials...", 2);
        await delay(1000);

        // Step 3 — Decrypt session
        setLoadingStatus("🛡️ Decrypting session keys...", 3);
        await delay(1000);

        // Real authentication
        const credentials = Object.fromEntries(new FormData(form));
        const rawPassword = credentials.password;
        credentials.passwordPrehash = await passwordPrehash(rawPassword);

        const challengeResponse = await fetch(`${API}/login/challenge`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: credentials.username })
        });
        const challenge = await challengeResponse.json();
        if (!challengeResponse.ok) throw new Error(challenge.error || "Could not prepare secure login");
        if (challenge.mode === "legacy-pbkdf2") {
          credentials.legacyVerifier = await legacyVerifier(rawPassword, challenge.salt, challenge.iterations);
        }
        delete credentials.password;

        const response = await fetch(`${API}/login`, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(credentials)
        });
        const data = await response.json();

        if (!response.ok && data.code === "OLD_BETA_LOGIN") {
          hideLoading();
          showOldLoginModal(data.serverResponseCode || "");
          return;
        }
        if (!response.ok && data.restricted && data.restriction?.type === "banned") {
          ["studybase_session_active", "studybase_session_expiry", "studybase_user"].forEach(k => localStorage.removeItem(k));
          const reason = String(data.restriction.reason || "This account has been banned.").slice(0, 500);
          location.replace(`https://studybase.site/?ban=true&reason=${encodeURIComponent(reason)}`);
          return;
        }
        if (!response.ok) throw new Error(data.error || "Sign in failed");

        localStorage.setItem("studybase_session_active", "1");
        localStorage.setItem("studybase_session_expiry", data.expiresAt);
        localStorage.setItem("studybase_user", JSON.stringify(data.user));

        if (window.parent !== window) {
          window.parent.postMessage({ type: "studybase:login-success", user: data.user }, location.origin);
        } else {
          location.replace(`/?login=true&username=${encodeURIComponent(data.user.username)}`);
        }

      } catch (error) {
        hideLoading();
        showMessage(error.message);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
