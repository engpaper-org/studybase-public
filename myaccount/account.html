<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudyBase | My account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/core/services.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <main class="mx-auto max-w-5xl px-5 py-10">
    <header class="flex flex-wrap items-center justify-between gap-4">
      <div><p class="text-xs font-black uppercase tracking-[.2em] text-purple-600">StudyBase account</p><h1 class="mt-2 text-4xl font-black">Your account</h1></div>
      <button id="logout" class="rounded-xl border border-slate-300 bg-white px-5 py-3 font-bold">Sign out</button>
    </header>
    <div id="message" class="mt-6 rounded-2xl border border-slate-200 bg-white p-5 text-slate-600">Loading your secure profile...</div>
    <section id="content" class="mt-6 hidden space-y-6">
      <div class="rounded-3xl bg-gradient-to-br from-purple-700 to-indigo-950 p-7 text-white shadow-xl">
        <p class="text-sm font-bold text-purple-200">Signed in as</p><h2 id="name" class="mt-2 text-3xl font-black"></h2><p id="username" class="mt-1 text-purple-200"></p>
      </div>
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <article class="rounded-2xl border bg-white p-5"><p class="text-xs font-black uppercase tracking-wider text-slate-400">User ID</p><p id="user-id" class="mt-2 break-all font-mono text-sm"></p></article>
        <article class="rounded-2xl border bg-white p-5"><p class="text-xs font-black uppercase tracking-wider text-slate-400">Date of birth</p><p id="dob" class="mt-2 font-bold"></p></article>
        <article class="rounded-2xl border bg-white p-5"><p class="text-xs font-black uppercase tracking-wider text-slate-400">Gender</p><p id="gender" class="mt-2 font-bold"></p></article>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <a target="_top" href="/myaccount/settings.html" class="rounded-2xl border bg-white p-6 transition hover:border-purple-300 hover:shadow-lg"><h3 class="text-xl font-black">Account settings</h3><p class="mt-2 text-sm text-slate-500">Manage server-synced account preferences.</p></a>
        <a id="delete-link" target="_top" href="https://auth.studybase.site/delete" class="rounded-2xl border border-amber-200 bg-amber-50 p-6 transition hover:border-amber-400"><h3 class="text-xl font-black text-amber-950">Delete account</h3><p class="mt-2 text-sm text-amber-800">Permanently delete your profile, credentials, and sessions.</p></a>
      </div>
    </section>
  </main>
  <script>
    const message = document.getElementById("message");
    async function loadAccount() {
      const result = await StudyBaseServices.request("/me");
      if (!result.ok || !result.user) { location.replace("/myaccount/login.html?sessionExpired=true"); return; }
      const user = result.user;
      if (document.referrer.startsWith("https://auth.studybase.site")) {
        await StudyBaseServices.logout();
        location.replace(`/?signup=true&username=${encodeURIComponent(user.username)}`);
        return;
      }
      localStorage.setItem("studybase_user", JSON.stringify(user));
      document.getElementById("name").textContent = user.name;
      document.getElementById("username").textContent = `@${user.username}`;
      document.getElementById("user-id").textContent = user.id;
      document.getElementById("dob").textContent = user.dateOfBirth || "Not recorded";
      document.getElementById("gender").textContent = (user.gender || "Not recorded").replaceAll("-", " ");
      document.getElementById("delete-link").href = `https://auth.studybase.site/delete?username=${encodeURIComponent(user.username)}`;
      message.classList.add("hidden"); document.getElementById("content").classList.remove("hidden");
    }
    document.getElementById("logout").onclick = async () => { await StudyBaseServices.logout(); location.replace("/"); };
    loadAccount().catch(() => { message.textContent = "Your account could not be loaded."; });
  </script>
</body>
</html>
