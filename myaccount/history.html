<meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    :root { color-scheme: light; }
    .bg-grid-slate-100 {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' fill='none' stroke='%23f1f5f9'%3e%3cpath d='M0 .5H31.5V32'/%3e%3c/svg%3e");
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            body: ['"Inter"', 'sans-serif'],
          },
        }
      }
    };
  </script>

<body class="min-h-screen bg-slate-50 text-slate-900 font-sans">
  <div class="absolute inset-0 bg-grid-slate-100 [mask-image:linear-gradient(180deg,white,rgba(255,255,255,0.5))] -z-10"></div>

  <header class="max-w-5xl mx-auto px-6 pt-10">
    
    <div class="flex items-start justify-between gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-slate-200 text-slate-600 text-xs font-bold uppercase tracking-widest shadow-sm">
          <i class="fa-solid fa-clock-rotate-left"></i>
          History
        </div>

        <h1 class="mt-4 text-3xl md:text-4xl font-black tracking-tight">
          Your history
        </h1>

        <p class="mt-2 text-slate-500 font-body">
          Recently viewed resources + your site search history.
        </p>
      </div>

      <a href="/myaccount/account.html"
         class="shrink-0 px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-bold hover:shadow-md transition-all">
        <i class="fa-solid fa-arrow-left mr-2"></i>Back
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 pb-14 pt-8">
    <section class="glass-panel rounded-[2rem] shadow-xl shadow-slate-200/60 overflow-hidden">
      <div class="px-8 py-6 border-b border-slate-200 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg border border-purple-100">
            <i class="fa-solid fa-timeline"></i>
          </div>
          <div>
            <p class="font-extrabold leading-tight">Local history</p>
            <p class="text-xs text-slate-500 font-body">This device</p>
          </div>
        </div>

        <button id="clearAllHistory"
          class="px-4 py-2 rounded-xl bg-white border border-red-200 text-red-600 font-extrabold hover:bg-red-50 transition">
          <i class="fa-solid fa-broom mr-2"></i>Clear history
        </button>
      </div>

      <div class="p-8 space-y-10">
        <!-- Recently played -->
        <section>
          <div class="flex items-end justify-between gap-4">
            <div>
              <h2 class="text-lg font-black">Recently viewed</h2>
              <p id="recentHint" class="text-sm text-slate-500 font-body mt-1">—</p>
            </div>
            <button id="clearRecent"
              class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-bold hover:bg-slate-50 transition">
              Clear
            </button>
          </div>

          <div id="recentList" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </section>

        <!-- Search history -->
        <section>
          <div class="flex items-end justify-between gap-4">
            <div>
              <h2 class="text-lg font-black">Site search history</h2>
              <p id="searchHint" class="text-sm text-slate-500 font-body mt-1">—</p>
            </div>
            <button id="clearSearch"
              class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 font-bold hover:bg-slate-50 transition">
              Clear
            </button>
          </div>

          <div id="searchList" class="mt-4 flex flex-wrap gap-2"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="/assets/js/account/sidebar.js"></script>
  <script src="/assets/js/account/checkLoggedIn.js"></script>

  <script>
    // Auth gate
    if (!window.AccountAuth?.requireAuth?.()) {
      // redirected
    }

    const K = {
      toggleRecent: "sb_saveRecentlyPlayed",
      toggleSearch: "sb_saveSearchHistory",
      recentList: "sb_recentlyPlayed",
      searchList: "sb_searchHistory"
    };

    function parseBool(v, fallback) {
      if (v === null || v === undefined) return fallback;
      const s = String(v).toLowerCase().trim();
      if (s === "true") return true;
      if (s === "false") return false;
      return fallback;
    }

    function readJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const v = JSON.parse(raw);
        return v ?? fallback;
      } catch (_) {
        return fallback;
      }
    }

    function writeJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
    }

    function render() {
      const allowRecent = parseBool(localStorage.getItem(K.toggleRecent), true);
      const allowSearch = parseBool(localStorage.getItem(K.toggleSearch), true);

      const recent = allowRecent ? readJSON(K.recentList, []) : [];
      const search = allowSearch ? readJSON(K.searchList, []) : [];

      // Hints
      document.getElementById("recentHint").textContent =
        allowRecent ? (recent.length ? `${recent.length} item(s)` : "Nothing yet") : "Disabled in Settings";

      document.getElementById("searchHint").textContent =
        allowSearch ? (search.length ? `${search.length} item(s)` : "Nothing yet") : "Disabled in Settings";

      // Recently played cards
      const recentWrap = document.getElementById("recentList");
      recentWrap.innerHTML = "";

      if (!allowRecent) {
        recentWrap.innerHTML = `<div class="text-sm text-slate-500 font-body">Recently viewed is disabled in Settings.</div>`;
      } else if (!recent.length) {
        recentWrap.innerHTML = `<div class="text-sm text-slate-500 font-body">No recently viewed items saved.</div>`;
      } else {
        recent.slice(0, 20).forEach(item => {
          // item can be string or object
          const title = (typeof item === "string") ? item : (item?.title || item?.name || "Untitled");
          const url = (typeof item === "object" && item?.url) ? item.url : null;

          const card = document.createElement("div");
          card.className = "rounded-2xl border border-slate-200 bg-white p-4 hover:bg-slate-50 transition";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <p class="font-extrabold text-slate-900 truncate">${title}</p>
                <p class="text-xs text-slate-500 font-body mt-1">${url ? url : "No URL stored"}</p>
              </div>
              ${url ? `<a href="${url}" class="px-3 py-2 rounded-xl bg-slate-900 text-white font-extrabold text-sm hover:opacity-90">Open</a>` : ""}
            </div>
          `;
          recentWrap.appendChild(card);
        });
      }

      // Search chips
      const searchWrap = document.getElementById("searchList");
      searchWrap.innerHTML = "";

      if (!allowSearch) {
        searchWrap.innerHTML = `<div class="text-sm text-slate-500 font-body">Search history is disabled in Settings.</div>`;
      } else if (!search.length) {
        searchWrap.innerHTML = `<div class="text-sm text-slate-500 font-body">No searches saved.</div>`;
      } else {
        search.slice(0, 50).forEach(q => {
          const text = (typeof q === "string") ? q : (q?.q || q?.term || "");
          if (!text) return;

          const chip = document.createElement("span");
          chip.className = "inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white border border-slate-200 text-slate-700 font-bold text-sm";
          chip.innerHTML = `<i class="fa-solid fa-magnifying-glass text-slate-400"></i>${escapeHTML(text)}`;
          searchWrap.appendChild(chip);
        });
      }
    }

    function escapeHTML(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // Clear buttons
    document.getElementById("clearRecent").addEventListener("click", () => {
      writeJSON(K.recentList, []);
      render();
    });

    document.getElementById("clearSearch").addEventListener("click", () => {
      writeJSON(K.searchList, []);
      render();
    });

    document.getElementById("clearAllHistory").addEventListener("click", () => {
      writeJSON(K.recentList, []);
      writeJSON(K.searchList, []);
      render();
    });

    render();
  </script>
</body>
</html>
