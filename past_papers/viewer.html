<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <script src="/assets/js/siteConfig.js"></script>
<script>
        (function () {
            try {
                const isDark = String(localStorage.getItem("darkMode") || "").toLowerCase() === "true";
                if (isDark) document.documentElement.classList.add("dark");
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevisionBase | Paper Viewer</title>
    <link rel="icon" href="/assets/siteIcons/main.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/assets/js/sessionManager.js" defer></script>
    <script src="/assets/js/errorCheck.js" defer></script>
    <script src="/assets/js/services.js"></script>
    <script>const PAGE_ID = "past_paper_viewer";</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * { box-sizing: border-box; }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #0f172a;
        }

        .font-body { font-family: "Inter", system-ui, -apple-system, sans-serif; }

        .viewer-app {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(280px, 28vw);
            width: 100vw;
            height: 100vh;
            background: #e2e8f0;
            transition: grid-template-columns 0.22s ease;
        }

        .viewer-app.sidebar-closed {
            grid-template-columns: minmax(0, 1fr) 0;
        }

        .side-panel {
            grid-column: 2;
            grid-row: 1;
            min-width: 0;
            height: 100vh;
            overflow: hidden;
            border-left: 1px solid rgba(203, 213, 225, 0.92);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.98));
        }

        .side-scroll {
            height: 100%;
            overflow-y: auto;
            padding: 1rem;
        }

        .sidebar-closed .side-panel {
            border-left: 0;
        }

        .sidebar-closed .side-scroll {
            visibility: hidden;
        }

        .main-panel {
            grid-column: 1;
            grid-row: 1;
            min-width: 0;
            height: 100vh;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            background: #111827;
        }

        .top-tabs {
            min-height: 4.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.9);
            background: rgba(15, 23, 42, 0.98);
            color: white;
        }

        .tab-list {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .resource-tab {
            display: inline-flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            min-height: 2.6rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(255, 255, 255, 0.06);
            padding: 0 0.9rem;
            color: #cbd5e1;
            font-size: 0.82rem;
            font-weight: 900;
            transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
        }

        .resource-tab:hover {
            border-color: rgba(147, 197, 253, 0.48);
            color: #ffffff;
        }

        .resource-tab.is-active {
            border-color: rgba(96, 165, 250, 0.8);
            background: #2563eb;
            color: white;
        }

        .viewer-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 0.5rem;
            padding-left: 0.65rem;
            border-left: 1px solid rgba(148, 163, 184, 0.22);
        }

        .icon-button {
            width: 2.6rem;
            height: 2.6rem;
            border-radius: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
        }

        .icon-button:hover {
            border-color: rgba(147, 197, 253, 0.5);
            background: rgba(255, 255, 255, 0.12);
            color: white;
        }

        .sidebar-toggle-button {
            border-color: rgba(96, 165, 250, 0.42);
            background: rgba(37, 99, 235, 0.14);
            color: #bfdbfe;
        }

        .sidebar-toggle-button:hover {
            border-color: rgba(147, 197, 253, 0.76);
            background: rgba(37, 99, 235, 0.25);
            color: #ffffff;
        }

        .frame-wrap {
            min-height: 0;
            background: #111827;
        }

        .viewer-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #f8fafc;
        }

        .panel-card {
            border: 1px solid rgba(226, 232, 240, 0.96);
            border-radius: 1rem;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border-radius: 999px;
            border: 1px solid rgba(203, 213, 225, 0.86);
            background: #f8fafc;
            padding: 0.45rem 0.72rem;
            color: #475569;
            font-size: 0.72rem;
            line-height: 1;
            font-weight: 900;
        }

        .related-card {
            display: block;
            border: 1px solid rgba(226, 232, 240, 0.96);
            border-radius: 1rem;
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            padding: 0.95rem;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .related-card:hover {
            transform: translateY(-2px);
            border-color: rgba(37, 99, 235, 0.36);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
        }

        .download-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.9rem;
            border: 1px solid rgba(37, 99, 235, 0.18);
            border-radius: 1rem;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(20, 184, 166, 0.08));
            padding: 0.95rem;
            color: #1e3a8a;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .download-card:hover {
            transform: translateY(-2px);
            border-color: rgba(37, 99, 235, 0.34);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.10);
        }

        .download-card.is-disabled {
            pointer-events: none;
            opacity: 0.45;
            filter: grayscale(0.2);
        }

        .empty-state {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #0f172a;
            text-align: center;
            padding: 2rem;
        }

        .external-warning-overlay {
            background: rgba(15, 23, 42, 0.58);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .external-warning-card {
            box-shadow: 0 30px 90px rgba(15, 23, 42, 0.28);
        }

        @media (max-width: 900px) {
            .viewer-app {
                grid-template-columns: minmax(0, 1fr) minmax(260px, 82vw);
            }

            .viewer-app.sidebar-closed {
                grid-template-columns: minmax(0, 1fr) 0;
            }

            .top-tabs {
                min-height: 4rem;
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
        }
    </style>
</head>

<body>
    <main id="viewerApp" class="viewer-app">
        <aside class="side-panel">
            <div class="side-scroll">
                <div class="flex items-center justify-between gap-3 mb-4">
                    <a href="/past_papers/index.html" class="inline-flex items-center gap-2 text-sm font-black text-slate-500 hover:text-blue-700 transition-colors">
                        <i class="fa-solid fa-arrow-left text-xs"></i>
                        Papers
                    </a>
                    <button id="closeSidebar" class="w-10 h-10 rounded-xl border border-slate-200 bg-white text-slate-600 hover:text-blue-700 hover:border-blue-200 transition-colors" type="button" aria-label="Close paper sidebar">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <section id="paperDetails" class="panel-card p-5 mb-4">
                    <div class="animate-pulse">
                        <div class="h-3 w-28 bg-slate-200 rounded mb-4"></div>
                        <div class="h-8 w-full bg-slate-200 rounded mb-3"></div>
                        <div class="h-4 w-4/5 bg-slate-200 rounded"></div>
                    </div>
                </section>

                <a id="downloadResource" class="download-card is-disabled mb-4" href="#" download aria-disabled="true">
                    <span>
                        <span class="block text-xs uppercase tracking-widest font-black text-blue-700">Download</span>
                        <span id="downloadResourceLabel" class="block mt-1 font-black text-slate-950">Current PDF</span>
                    </span>
                    <span class="w-10 h-10 rounded-2xl bg-white text-blue-700 flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-download"></i>
                    </span>
                </a>

                <section class="panel-card p-5">
                    <div class="flex items-center justify-between gap-4 mb-4">
                        <div>
                            <p class="text-xs uppercase tracking-widest font-black text-blue-700">Related</p>
                            <h2 class="text-lg font-black text-slate-950 mt-1">Same board and subject</h2>
                        </div>
                        <span class="w-10 h-10 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center">
                            <i class="fa-solid fa-layer-group"></i>
                        </span>
                    </div>
                    <div id="relatedPapers" class="space-y-3"></div>
                </section>
            </div>
        </aside>

        <section class="main-panel">
            <div class="top-tabs">
                <div id="resourceTabs" class="tab-list"></div>
                <div class="viewer-actions">
                    <a class="icon-button" href="/past_papers/index.html" aria-label="Back to past papers">
                        <i class="fa-solid fa-house"></i>
                    </a>
                    <a id="openResource" class="icon-button" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open current resource in new tab">
                        <i class="fa-solid fa-up-right-from-square"></i>
                    </a>
                    <button id="toggleSidebar" class="icon-button sidebar-toggle-button" type="button" aria-label="Toggle paper sidebar">
                        <i class="fa-solid fa-table-columns"></i>
                    </button>
                </div>
            </div>
            <div id="frameWrap" class="frame-wrap">
                <div class="empty-state">
                    <div>
                        <div class="mx-auto w-14 h-14 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center text-xl mb-4">
                            <i class="fa-solid fa-file-lines"></i>
                        </div>
                        <h1 class="text-2xl font-black">Loading paper...</h1>
                        <p class="font-body text-slate-500 mt-2">The viewer will open once the paper is found.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="externalWarningModal" class="external-warning-overlay hidden fixed inset-0 z-[1000] items-center justify-center p-4">
        <div class="external-warning-card w-full max-w-lg rounded-3xl bg-white border border-slate-200 p-6 md:p-7">
            <div class="flex items-start gap-4">
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 border border-amber-100 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </div>
                <div class="min-w-0">
                    <h2 class="text-2xl font-black text-slate-950 tracking-tight">Open external PDF?</h2>
                    <p class="mt-2 text-sm leading-6 text-slate-600 font-body">
                        This paper is hosted on <strong id="externalWarningHost" class="text-slate-950 break-all">an external site</strong>. It will open in a new browser tab.
                    </p>
                </div>
            </div>

            <div class="mt-6 flex flex-col sm:flex-row gap-3 sm:justify-end">
                <button id="externalWarningCancel" type="button" class="px-5 py-3 rounded-xl bg-slate-100 text-slate-700 font-black hover:bg-slate-200 transition-colors">
                    Cancel
                </button>
                <button id="externalWarningContinue" type="button" class="px-5 py-3 rounded-xl bg-slate-950 text-white font-black hover:bg-blue-700 transition-colors">
                    Continue
                </button>
            </div>
        </div>
    </div>

    <script>
        const DATA_URL = "/assets/pastPapers/papers.json";
        const params = new URLSearchParams(window.location.search);
        const selectedId = params.get("id") || "";
        const selectedTab = params.get("tab") || "";
        const app = document.getElementById("viewerApp");
        let activeResources = [];
        let activeResource = null;
        let pendingExternalUrl = "";

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, (char) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char]));
        }

        function resourceUrl(value) {
            if (!value) return "";
            if (typeof value === "string") return value;
            return value.url || value.href || value.pdfUrl || "";
        }

        function shouldOpenExternally(paper, resourceValue = null) {
            if (resourceValue && typeof resourceValue === "object" && resourceValue.openExternally !== undefined) {
                return resourceValue.openExternally === true;
            }

            if (paper?.resources?.openExternally !== undefined) return paper.resources.openExternally === true;
            return paper?.openExternally === true;
        }

        function getResourceHostname(url) {
            try {
                return new URL(url, window.location.origin).hostname || window.location.hostname;
            } catch (e) {
                return "the linked host";
            }
        }

        function openExternalWarning(url) {
            pendingExternalUrl = url;
            document.getElementById("externalWarningHost").textContent = getResourceHostname(url);
            document.getElementById("externalWarningModal").classList.remove("hidden");
            document.getElementById("externalWarningModal").classList.add("flex");
            document.body.classList.add("overflow-hidden");
        }

        function closeExternalWarning() {
            pendingExternalUrl = "";
            document.getElementById("externalWarningModal").classList.add("hidden");
            document.getElementById("externalWarningModal").classList.remove("flex");
            document.body.classList.remove("overflow-hidden");
        }

        function resourceList(paper) {
            const resources = paper?.resources || {};
            const paperResource = resources.paperPdfUrl || resources.pdfUrl || resources.questionPaper;
            const markSchemeResource = resources.markSchemePdfUrl || resources.markScheme;
            const examinerReportResource = resources.examinerReportPdfUrl || resources.examinerReport;

            return [
                {
                    key: "questionPaper",
                    label: "Question paper",
                    icon: "fa-file-lines",
                    url: resourceUrl(paperResource),
                    openExternally: shouldOpenExternally(paper, paperResource)
                },
                {
                    key: "markScheme",
                    label: "Mark scheme",
                    icon: "fa-check-double",
                    url: resourceUrl(markSchemeResource),
                    openExternally: shouldOpenExternally(paper, markSchemeResource)
                },
                {
                    key: "examinerReport",
                    label: "Examiner report",
                    icon: "fa-chart-simple",
                    url: resourceUrl(examinerReportResource),
                    openExternally: shouldOpenExternally(paper, examinerReportResource)
                }
            ].filter((item) => item.url);
        }

        function downloadName(resource) {
            try {
                const cleanPath = new URL(resource.url, window.location.origin).pathname;
                const filename = cleanPath.split("/").filter(Boolean).pop();
                if (filename && filename.includes(".")) return filename;
            } catch (e) {}
            return `${resource.key}.pdf`;
        }

        function setPageTitle(paper) {
            document.title = `${paper.subject} ${paper.examBoard} ${paper.year} ${paper.paper} | ${window.SiteConfig?.get("brand.name", "RevisionBase") || "RevisionBase"}`;
        }

        function renderDetails(paper) {
            document.getElementById("paperDetails").innerHTML = `
                <p class="text-xs uppercase tracking-widest font-black text-blue-700">A-Level paper viewer</p>
                <h1 class="mt-3 text-2xl font-black tracking-tight text-slate-950 leading-tight">${escapeHTML(paper.paper)}</h1>
                <p class="mt-2 text-sm text-slate-500 font-body leading-relaxed">${escapeHTML(paper.qualification)}</p>
                <div class="mt-5 flex flex-wrap gap-2">
                    <span class="meta-pill"><i class="fa-solid fa-book text-blue-600"></i>${escapeHTML(paper.subject)}</span>
                    <span class="meta-pill"><i class="fa-solid fa-building-columns text-teal-600"></i>${escapeHTML(paper.examBoard)}</span>
                    <span class="meta-pill"><i class="fa-solid fa-calendar text-violet-600"></i>${escapeHTML(paper.series)} ${escapeHTML(paper.year)}</span>
                </div>
            `;
        }

        function renderTabs(resources, initialKey = "") {
            const tabs = document.getElementById("resourceTabs");
            activeResources = resources;

            if (!resources.length) {
                tabs.innerHTML = "";
                document.getElementById("openResource").classList.add("pointer-events-none", "opacity-40");
                return;
            }

            tabs.innerHTML = resources.map((resource, index) => `
                <button class="resource-tab ${(!initialKey && index === 0) || resource.key === initialKey ? "is-active" : ""}" type="button" data-resource-key="${escapeHTML(resource.key)}">
                    <i class="fa-solid ${escapeHTML(resource.icon)} text-xs"></i>
                    ${escapeHTML(resource.label)}
                </button>
            `).join("");

            tabs.querySelectorAll("[data-resource-key]").forEach((tab) => {
                tab.addEventListener("click", () => selectResource(tab.dataset.resourceKey));
            });

            const first = resources.find((item) => item.key === initialKey) || resources[0];
            selectResource(first.key);
        }

        function selectResource(key) {
            const resource = activeResources.find((item) => item.key === key);
            if (!resource) return;
            activeResource = resource;

            document.querySelectorAll(".resource-tab").forEach((tab) => {
                tab.classList.toggle("is-active", tab.dataset.resourceKey === key);
            });

            const nextUrl = new URL(window.location.href);
            nextUrl.searchParams.set("tab", key);
            window.history.replaceState({}, "", nextUrl);

            const openLink = document.getElementById("openResource");
            openLink.href = resource.url;
            openLink.dataset.externalWarning = resource.openExternally ? "true" : "false";
            openLink.dataset.externalUrl = resource.openExternally ? resource.url : "";
            openLink.classList.remove("pointer-events-none", "opacity-40");

            const downloadLink = document.getElementById("downloadResource");
            downloadLink.href = resource.url;
            downloadLink.setAttribute("download", downloadName(resource));
            downloadLink.setAttribute("aria-disabled", "false");
            downloadLink.classList.remove("is-disabled");
            document.getElementById("downloadResourceLabel").textContent = resource.label;

            renderFrame(resource);
        }

        function renderFrame(resource) {
            const wrap = document.getElementById("frameWrap");
            wrap.innerHTML = "";

            if (resource.openExternally) {
                wrap.innerHTML = `
                    <div class="empty-state">
                        <div>
                            <div class="mx-auto w-14 h-14 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl mb-4">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </div>
                            <h1 class="text-2xl font-black">External PDF</h1>
                            <p class="font-body text-slate-500 mt-2">
                                This resource is hosted on ${escapeHTML(getResourceHostname(resource.url))}. Use the open button to continue in a new tab.
                            </p>
                            <button type="button" data-open-active-external class="mt-5 inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-slate-950 text-white font-black hover:bg-blue-700 transition-colors">
                                Open PDF <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const iframe = document.createElement("iframe");
            iframe.className = "viewer-frame";
            iframe.title = resource.label;
            iframe.src = resource.url;
            iframe.loading = "eager";
            wrap.appendChild(iframe);
        }

        function relatedMatches(paper, allPapers) {
            return allPapers
                .filter((candidate) =>
                    candidate.id !== paper.id &&
                    candidate.subject === paper.subject &&
                    candidate.examBoard === paper.examBoard
                )
                .sort((a, b) => Number(b.year) - Number(a.year) || a.paper.localeCompare(b.paper))
                .slice(0, 5);
        }

        function renderRelated(paper, allPapers) {
            const related = relatedMatches(paper, allPapers);
            const container = document.getElementById("relatedPapers");

            if (!related.length) {
                container.innerHTML = `
                    <div class="rounded-2xl border border-dashed border-slate-300 p-4 text-center">
                        <p class="font-black text-slate-900">No close matches yet</p>
                        <p class="text-sm text-slate-500 font-body mt-1">More ${escapeHTML(paper.examBoard)} ${escapeHTML(paper.subject)} papers can appear here as they are added.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = related.map((item) => `
                <a href="/past_papers/viewer.html?id=${encodeURIComponent(item.id)}" class="related-card">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <p class="text-xs uppercase tracking-widest font-black text-blue-700">${escapeHTML(item.series)} ${escapeHTML(item.year)}</p>
                            <h3 class="mt-1 font-black text-slate-950 leading-snug">${escapeHTML(item.paper)}</h3>
                            <p class="text-sm text-slate-500 font-body mt-1">${escapeHTML(item.qualification)}</p>
                        </div>
                        <i class="fa-solid fa-arrow-right text-slate-300 mt-1"></i>
                    </div>
                </a>
            `).join("");
        }

        function renderMissing(message) {
            document.getElementById("paperDetails").innerHTML = `
                <div class="text-center py-5">
                    <div class="mx-auto w-14 h-14 rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center text-xl mb-4">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <h1 class="text-2xl font-black text-slate-950">${escapeHTML(message)}</h1>
                    <p class="text-slate-500 font-body mt-2">Head back to the paper finder and choose a paper to view.</p>
                    <a href="/past_papers/index.html" class="mt-5 inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-slate-950 text-white font-black hover:bg-blue-700 transition-colors">
                        Find papers <i class="fa-solid fa-arrow-right text-xs"></i>
                    </a>
                </div>
            `;
            document.getElementById("resourceTabs").innerHTML = "";
            document.getElementById("openResource").classList.add("pointer-events-none", "opacity-40");
            document.getElementById("downloadResource").classList.add("is-disabled");
            document.getElementById("downloadResource").setAttribute("aria-disabled", "true");
            document.getElementById("frameWrap").innerHTML = `
                <div class="empty-state">
                    <div>
                        <h2 class="text-2xl font-black">${escapeHTML(message)}</h2>
                        <p class="font-body text-slate-500 mt-2">No document can be displayed yet.</p>
                    </div>
                </div>
            `;
        }

        async function loadViewer() {
            if (!selectedId) {
                renderMissing("No paper selected");
                return;
            }

            try {
                const response = await fetch(DATA_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const allPapers = Array.isArray(data.papers) ? data.papers : [];
                const paper = allPapers.find((item) => item.id === selectedId);

                if (!paper) {
                    renderMissing("Paper not found");
                    return;
                }

                const resources = resourceList(paper);
                if (!resources.length) {
                    renderMissing("No linked resources yet");
                    return;
                }

                setPageTitle(paper);
                renderDetails(paper);
                renderRelated(paper, allPapers);
                renderTabs(resources, selectedTab);
            } catch (error) {
                console.error(error);
                renderMissing("Paper viewer could not load");
            }
        }

        document.getElementById("closeSidebar").addEventListener("click", () => {
            app.classList.add("sidebar-closed");
        });

        document.getElementById("toggleSidebar").addEventListener("click", () => {
            app.classList.toggle("sidebar-closed");
        });

        document.addEventListener("click", (event) => {
            const externalLink = event.target.closest("[data-external-warning='true']");
            if (externalLink) {
                event.preventDefault();
                openExternalWarning(externalLink.dataset.externalUrl || externalLink.href);
                return;
            }

            const activeExternalButton = event.target.closest("[data-open-active-external]");
            if (activeExternalButton && activeResource?.url) {
                event.preventDefault();
                openExternalWarning(activeResource.url);
            }
        });

        document.getElementById("externalWarningCancel").addEventListener("click", closeExternalWarning);
        document.getElementById("externalWarningModal").addEventListener("click", (event) => {
            if (event.target.id === "externalWarningModal") closeExternalWarning();
        });
        document.getElementById("externalWarningContinue").addEventListener("click", () => {
            if (pendingExternalUrl) window.open(pendingExternalUrl, "_blank", "noopener,noreferrer");
            closeExternalWarning();
        });

        loadViewer();
    </script>
</body>
</html>
