<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line-by-Line SHA-256 Hasher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #cbd5e1;
    }

    textarea, pre {
      width: 100%;
      box-sizing: border-box;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #111827;
      color: #f8fafc;
      padding: 14px;
      font-size: 14px;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    pre {
      min-height: 220px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 16px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .secondary {
      background: #334155;
    }

    .secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SHA-256 Line Hasher</h1>
    <p>Paste one word or phrase per line. Each line will be hashed separately.</p>

    <textarea id="input" placeholder="apple&#10;banana&#10;cherry"></textarea>

    <div class="buttons">
      <button id="hashBtn">Hash Lines</button>
      <button id="copyBtn" class="secondary">Copy Output</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>

    <pre id="output"></pre>
  </div>

  <script>
    async function sha256(text) {
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    document.getElementById("hashBtn").addEventListener("click", async () => {
      const input = document.getElementById("input").value;
      const lines = input.split(/\r?\n/);
      const results = [];

      for (const line of lines) {
        if (!line.trim()) continue;
        const hashed = await sha256(line);
        results.push(`${hashed}`);
      }

      document.getElementById("output").textContent = results.join("\n");
    });

    document.getElementById("copyBtn").addEventListener("click", async () => {
      const output = document.getElementById("output").textContent;
      if (!output) return;
      await navigator.clipboard.writeText(output);
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("input").value = "";
      document.getElementById("output").textContent = "";
    });
  </script>
</body>
</html>
