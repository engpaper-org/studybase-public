<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Psychology Study Builder | StudyBase Tools</title>
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="sbx-shell" style="max-width:860px;padding:1.5rem 1rem 3rem;">
    <a href="/tools/sciences/" style="color:#64748b;font-size:0.9rem;">← Sciences</a>
    <div style="margin:1rem 0 1.3rem;display:flex;gap:10px;align-items:center;">
      <i data-lucide="brain" style="width:28px;height:28px;color:#0ea5e9;"></i>
      <h1 style="font-size:1.85rem;font-weight:700;margin:0;">Psychology Study Builder</h1>
    </div>
    <div style="background:white;border:1px solid #e2e8f0;border-radius:14px;padding:1.15rem;">
      <div style="margin-bottom:8px;"><strong>Build a study structure</strong></div>
      <div style="display:grid;gap:8px;">
        <input placeholder="Aim / Hypothesis" style="padding:9px;border:1px solid #cbd5e1;border-radius:10px;">
        <input placeholder="Procedure (IV, DV, sample)" style="padding:9px;border:1px solid #cbd5e1;border-radius:10px;">
        <input placeholder="Findings (stats + conclusion)" style="padding:9px;border:1px solid #cbd5e1;border-radius:10px;">
        <input placeholder="Evaluation (validity, reliability, ethics)" style="padding:9px;border:1px solid #cbd5e1;border-radius:10px;">
      </div>
      <div style="margin-top:10px;font-size:0.82rem;color:#64748b;">Use this template for every core study. Print or copy into your notes.</div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/assets/js/layout/navbar.js" defer></script>
  <script src="/assets/js/layout/footer.js" defer></script>
  <script>lucide.createIcons();</script>
</body>
</html>
