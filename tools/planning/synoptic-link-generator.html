<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synoptic Link Generator | StudyBase Tools</title>
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="sbx-shell" style="max-width:980px;padding:1.6rem 1rem 3rem;">
    <a href="/tools/planning/" style="color:#64748b;font-size:0.9rem;">← Planning tools</a>
    <div style="margin:1rem 0 1.5rem;display:flex;gap:11px;align-items:center;">
      <i data-lucide="link-2" style="width:28px;height:28px;color:#0ea5e9;"></i>
      <h1 style="font-size:1.9rem;font-weight:700;margin:0;">Synoptic Link Generator</h1>
    </div>

    <div style="max-width:720px;">
      <div style="background:white;border:1px solid #e2e8f0;border-radius:14px;padding:1.2rem;">
        <div style="margin-bottom:10px;">
          <input id="topic-a" placeholder="Topic A (e.g. Photosynthesis)" style="width:48%;padding:8px;border:1px solid #cbd5e1;border-radius:10px;">
          <input id="topic-b" placeholder="Topic B (e.g. Respiration)" style="width:48%;padding:8px;border:1px solid #cbd5e1;border-radius:10px;">
        </div>
        <button onclick="generateLinks()" style="background:#0f172a;color:white;padding:9px 20px;border-radius:12px;font-weight:700;">Generate Links</button>
        <div id="links-out" style="margin-top:14px;font-size:0.95rem;min-height:120px;"></div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/assets/js/layout/navbar.js" defer></script>
  <script src="/assets/js/layout/footer.js" defer></script>
  <script>
    lucide.createIcons();
    function generateLinks() {
      const a = document.getElementById('topic-a').value || 'Topic A';
      const b = document.getElementById('topic-b').value || 'Topic B';
      const out = document.getElementById('links-out');
      out.innerHTML = `
        <div style="padding:10px 0;border-bottom:1px solid #e2e8f0;"><strong>Core connection:</strong> How ${a} provides the energy/substrate for ${b} (or vice versa).</div>
        <div style="padding:10px 0;border-bottom:1px solid #e2e8f0;"><strong>Exam angle:</strong> “Evaluate the importance of ${a} in enabling the processes described in ${b}.”</div>
        <div style="padding:10px 0;"><strong>Quick AO3:</strong> Limitations of studying ${a} and ${b} in isolation — real biological systems are integrated.</div>
        <div style="margin-top:8px;font-size:0.8rem;color:#64748b;">Add your own subject-specific links above the line.</div>
      `;
    }
  </script>
</body>
</html>
