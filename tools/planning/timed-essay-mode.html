<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/config/privacyConfig.js?v=20260712"></script>
  <script src="/assets/js/privacy/checkCookieConsent.js?v=20260712"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting... | StudyBase</title>
  <script>
    (function() {
      var parts = window.location.pathname.split('/');
      var filename = parts.pop() || '';
      var toolName = filename.replace('.html', '');
      var redirectUrl = '/tools/index.html';
      
      var categoryMap = {
        'planning': true,
        'mathematics': true,
        'sciences': true,
        'humanities': true,
        'compsci': true,
        'languages': true
      };

      if (toolName === 'index') {
        var category = parts.pop() || '';
        if (category && category !== 'tools') {
          redirectUrl += '?category=' + category;
        }
      } else if (categoryMap[toolName]) {
        redirectUrl += '?category=' + toolName;
      } else {
        redirectUrl += '?tool=' + toolName;
      }
      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  <div style="font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 50px; color: #334155;">
    <h2>Redirecting you to the remastered StudyBase Tools Workspace...</h2>
    <p>If you are not automatically redirected, <a id="redirect-link" href="/tools/index.html" style="color: #2563eb; text-decoration: underline;">click here</a>.</p>
  </div>
  <script>
    (function() {
      var parts = window.location.pathname.split('/');
      var filename = parts.pop() || '';
      var toolName = filename.replace('.html', '');
      var redirectUrl = '/tools/index.html';
      
      var categoryMap = {
        'planning': true,
        'mathematics': true,
        'sciences': true,
        'humanities': true,
        'compsci': true,
        'languages': true
      };

      if (toolName === 'index') {
        var category = parts.pop() || '';
        if (category && category !== 'tools') {
          redirectUrl += '?category=' + category;
        }
      } else if (categoryMap[toolName]) {
        redirectUrl += '?category=' + toolName;
      } else {
        redirectUrl += '?tool=' + toolName;
      }
      document.getElementById('redirect-link').href = redirectUrl;
    })();
  </script>
</body>
</html>
