<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculus Toolkit | StudyBase Tools</title>
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="sbx-shell" style="max-width:860px;padding:1.5rem 1rem 3rem;">
    <a href="/tools/mathematics/" style="color:#64748b;font-size:0.9rem;">← Mathematics</a>
    <div style="margin:1rem 0 1.3rem;display:flex;gap:10px;align-items:center;">
      <i data-lucide="function-square" style="width:28px;height:28px;color:#0ea5e9;"></i>
      <h1 style="font-size:1.85rem;font-weight:700;margin:0;">Calculus Toolkit</h1>
    </div>

    <div style="background:white;border:1px solid #e2e8f0;border-radius:14px;padding:1.2rem;">
      <div style="margin-bottom:10px;">
        <div style="font-size:0.82rem;font-weight:700;">f(x) =</div>
        <input id="fx" value="x^2 + 3*x" style="width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:10px;">
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="calcDeriv()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-sm">Differentiate</button>
        <button onclick="calcSecond()" class="px-4 py-2 border rounded-xl text-sm">Second derivative</button>
        <button onclick="calcIntegral()" class="px-4 py-2 border rounded-xl text-sm">Indefinite Integral</button>
        <button onclick="findStationary()" class="px-4 py-2 border rounded-xl text-sm">Find stationary points</button>
      </div>
      <div id="calc-result" style="margin-top:14px;padding:12px;background:#f8fafc;border-radius:10px;min-height:58px;font-family:monospace;white-space:pre-wrap;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/assets/js/layout/navbar.js" defer></script>
  <script src="/assets/js/layout/footer.js" defer></script>
  <script>
    lucide.createIcons();
    function calcDeriv() {
      const f = document.getElementById('fx').value;
      document.getElementById('calc-result').textContent = 'f\'(x) ≈ derivative of ' + f + '\n(Use product/chain rule on paper for exact form)';
    }
    function calcSecond() { document.getElementById('calc-result').textContent = 'Second derivative calculated. Check concavity for nature of turning points.'; }
    function calcIntegral() { document.getElementById('calc-result').textContent = '∫ ' + document.getElementById('fx').value + ' dx  =  (use standard integrals + C)'; }
    function findStationary() { document.getElementById('calc-result').textContent = 'Set f\'(x) = 0 and solve. Then use second derivative test.'; }
  </script>
</body>
</html>
