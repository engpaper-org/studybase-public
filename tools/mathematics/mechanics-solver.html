<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mechanics Solver | StudyBase Tools</title>
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="sbx-shell" style="max-width:860px;padding:1.5rem 1rem 3rem;">
    <a href="/tools/mathematics/" style="color:#64748b;font-size:0.9rem;">← Mathematics</a>
    <div style="margin:1rem 0 1.3rem;display:flex;gap:10px;align-items:center;">
      <i data-lucide="compass" style="width:28px;height:28px;color:#0ea5e9;"></i>
      <h1 style="font-size:1.85rem;font-weight:700;margin:0;">Mechanics Solver</h1>
    </div>

    <div style="background:white;border:1px solid #e2e8f0;border-radius:14px;padding:1.15rem;">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;">
        <div><label style="font-size:0.78rem;font-weight:700;">u (m/s)</label><input id="u" value="0" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:9px;"></div>
        <div><label style="font-size:0.78rem;font-weight:700;">v (m/s)</label><input id="v" value="12" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:9px;"></div>
        <div><label style="font-size:0.78rem;font-weight:700;">a (m/s²)</label><input id="a" value="3" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:9px;"></div>
        <div><label style="font-size:0.78rem;font-weight:700;">t (s)</label><input id="t" value="4" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:9px;"></div>
        <div><label style="font-size:0.78rem;font-weight:700;">s (m)</label><input id="s" value="" style="width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:9px;"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
        <button onclick="solveSUVAT()" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-sm font-bold">Solve SUVAT</button>
        <button onclick="projectile()" class="px-4 py-2 border rounded-xl text-sm">Projectile range</button>
      </div>
      <div id="mech-out" style="margin-top:12px;padding:11px;background:#f8fafc;border-radius:10px;min-height:52px;white-space:pre-wrap;"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/assets/js/layout/navbar.js" defer></script>
  <script src="/assets/js/layout/footer.js" defer></script>
  <script>
    lucide.createIcons();
    function solveSUVAT() {
      const u = parseFloat(document.getElementById('u').value)||0;
      const v = parseFloat(document.getElementById('v').value)||0;
      const a = parseFloat(document.getElementById('a').value)||0;
      const t = parseFloat(document.getElementById('t').value)||0;
      const s = parseFloat(document.getElementById('s').value)||0;
      let out = '';
      if (t && a) out += 's = ' + (u*t + 0.5*a*t*t).toFixed(2) + ' m\n';
      if (v && u && t) out += 'a = ' + ((v-u)/t).toFixed(2) + ' m/s²\n';
      out += 'Use v² = u² + 2as on paper for exact values.';
      document.getElementById('mech-out').textContent = out;
    }
    function projectile() {
      const u = parseFloat(document.getElementById('u').value)||20;
      const ang = 45;
      const g=9.8;
      const R = (u*u*Math.sin(2*ang*Math.PI/180))/g;
      document.getElementById('mech-out').textContent = 'Range ≈ ' + R.toFixed(1) + ' m (45° launch, no air resistance)';
    }
  </script>
</body>
</html>
