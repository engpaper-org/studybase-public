<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Literature Essay Planner | StudyBase Tools</title>
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .back-link {
      color: #64748b;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: #0f172a; }
    a { color: #0ea5e9; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-weight: 700; border-radius: 11px; padding: 9px 16px; font-size: 0.93rem; cursor: pointer; transition: all 0.15s ease; }
  </style>
</head>
<body>
  <div class="sbx-shell" style="max-width:860px;padding:1.25rem 1rem 3rem;">
    <a href="/tools/humanities/" class="back-link">← Humanities</a>
    
    <div style="margin:1.3rem 0 1.7rem;">
      <div style="display:flex; align-items:center; gap:13px;">
        <div style="width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#0ea5e9,#67e8f9);display:flex;align-items:center;justify-content:center;">
          <i data-lucide="book-open" style="width:24px;height:24px;color:white;"></i>
        </div>
        <div>
          <h1 style="font-size:1.95rem;font-weight:900;margin:0;">English Literature Essay Planner</h1>
          <p style="color:#475569;margin:2px 0 0;font-size:0.98rem;">Build 25+ mark essays with structure and AO precision.</p>
        </div>
      </div>
    </div>

    <div style="background:white;border:1px solid #e2e8f0;border-radius:16px;padding:1.35rem;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.04);">
      <div style="margin-bottom:10px;">
        <div style="font-size:0.82rem;font-weight:800;color:#0f172a;margin-bottom:4px;">THESIS / LINE OF ARGUMENT</div>
        <input placeholder="Your central argument..." style="width:100%;padding:11px 13px;border:1px solid #cbd5e1;border-radius:11px;font-size:0.95rem;">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
        <div>
          <div style="font-size:0.78rem;font-weight:700;color:#475569;margin-bottom:3px;">Critic 1 + Quote</div>
          <input placeholder="Critic + key quotation" style="width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:0.92rem;">
        </div>
        <div>
          <div style="font-size:0.78rem;font-weight:700;color:#475569;margin-bottom:3px;">Critic 2 + Quote</div>
          <input placeholder="Critic + key quotation" style="width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:0.92rem;">
        </div>
      </div>
      <div>
        <div style="font-size:0.78rem;font-weight:700;color:#475569;margin-bottom:3px;">Paragraph Points + AO Tags</div>
        <textarea placeholder="Point 1 (AO1/AO2)..." style="width:100%;height:115px;margin-top:2px;border:1px solid #cbd5e1;border-radius:11px;padding:12px;font-size:0.95rem;"></textarea>
      </div>
      <button onclick="alert('Plan saved locally. Use Timed Essay Mode to practise.')" style="margin-top:12px;padding:11px 22px;background:#0f172a;color:white;border-radius:12px;font-weight:700;font-size:0.95rem;">Save Full Plan</button>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/assets/js/layout/navbar.js" defer></script>
  <script src="/assets/js/layout/footer.js" defer></script>
  <script>lucide.createIcons();</script>
</body>
</html>
