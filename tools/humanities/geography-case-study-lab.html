<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geography Case Study Lab | StudyBase Tools</title>
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="sbx-shell" style="max-width:860px;padding:1.5rem 1rem 3rem;">
    <a href="/tools/humanities/" style="color:#64748b;font-size:0.9rem;">← Humanities</a>
    <div style="margin:1rem 0 1.3rem;display:flex;gap:10px;align-items:center;">
      <i data-lucide="map" style="width:28px;height:28px;color:#0ea5e9;"></i>
      <h1 style="font-size:1.85rem;font-weight:700;margin:0;">Geography Case Study Lab</h1>
    </div>
    <div style="background:white;border:1px solid #e2e8f0;border-radius:14px;padding:1.15rem;">
      <input placeholder="Case study name (e.g. Holderness Coast)" style="width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:8px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <textarea placeholder="Key facts / data" style="height:78px;border:1px solid #cbd5e1;border-radius:10px;padding:8px;"></textarea>
        <textarea placeholder="Players + evaluation" style="height:78px;border:1px solid #cbd5e1;border-radius:10px;padding:8px;"></textarea>
      </div>
      <div style="margin-top:8px;font-size:0.82rem;color:#64748b;">Link every case study to the specific question command word.</div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/assets/js/layout/navbar.js" defer></script>
  <script src="/assets/js/layout/footer.js" defer></script>
  <script>lucide.createIcons();</script>
</body>
</html>
