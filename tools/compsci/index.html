<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Science Tools | StudyBase Tools</title>
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css">
  <link rel="stylesheet" href="/assets/css/premium-system.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    function initTailwind() {
      if (window.tailwind) {
        window.tailwind.config = {
          theme: {
            extend: {
              colors: {
                'sb-dark': '#0f172a',
                'sb-accent': '#0ea5e9',
              }
            }
          }
        };
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTailwind);
    } else {
      initTailwind();
    }
  </script>
  <style>
    .sbx-shell{max-width:1100px;padding:0.75rem 1rem 4rem}
    .back-link {
      color: #64748b;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: #0f172a; }
    a { color: #0ea5e9; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-weight: 700; border-radius: 11px; padding: 9px 16px; font-size: 0.93rem; cursor: pointer; transition: all 0.15s ease; }
  </style>
</head>
<body>
  <script src="/assets/js/layout/navbar.js" defer></script>
<div class="max-w-[1100px] mx-auto px-6 py-8">
<a href="/tools/" class="text-slate-500 hover:text-slate-700 text-sm flex items-center gap-1 mb-6">← All tools</a>

    <div class="flex items-center gap-4 mb-6">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-sky-400 to-cyan-400 flex items-center justify-center">
        <i data-lucide="cpu" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Computer Science &amp; Coding</h1>
        <p class="text-slate-600">Theory and practical tools for students aiming for the top marks in CS.</p>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <a href="computer-science-toolkit.html" class="group block p-5 bg-white border border-slate-200 rounded-2xl hover:border-sky-200 hover:shadow-md transition-all">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="cpu" class="w-5 h-5 text-sky-600"></i>
          <span class="font-semibold">Computer Science Toolkit</span>
        </div>
        <p class="text-sm text-slate-600">Binary, Boolean algebra, Big O, data structures, SQL and algorithms.</p>
      </a>
      <a href="code-practice-pad.html" class="group block p-5 bg-white border border-slate-200 rounded-2xl hover:border-sky-200 hover:shadow-md transition-all">
        <div class="flex items-center gap-2 mb-2">
          <i data-lucide="code-2" class="w-5 h-5 text-sky-600"></i>
          <span class="font-semibold">Code Practice Pad</span>
        </div>
        <p class="text-sm text-slate-600">Local Python + pseudocode editor with timers and algorithm challenges.</p>
      </a>
    </div>
</div>

  <script src="/assets/js/layout/footer.js" defer></script>
  <script>lucide.createIcons();</script>
</body>
</html>
