<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Oral Prep | StudyBase Tools</title>
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="sbx-shell" style="max-width:860px;padding:1.5rem 1rem 3rem;">
    <a href="/tools/languages/" style="color:#64748b;font-size:0.9rem;">← Languages &amp; EPQ</a>
    <div style="margin:1rem 0 1.3rem;display:flex;gap:10px;align-items:center;">
      <i data-lucide="mic" style="width:28px;height:28px;color:#0ea5e9;"></i>
      <h1 style="font-size:1.85rem;font-weight:700;margin:0;">French Oral Prep</h1>
    </div>
    <div style="background:white;border:1px solid #e2e8f0;border-radius:14px;padding:1.15rem;">
      <div style="margin-bottom:8px;font-weight:700;">Speaking cards (60–90s each)</div>
      <div style="display:grid;gap:7px;">
        <div style="background:#f8fafc;padding:9px;border-radius:9px;">“Quels sont les avantages des réseaux sociaux ?” — Give 3 developed points + opinion.</div>
        <div style="background:#f8fafc;padding:9px;border-radius:9px;">Photo card practice — describe, react, speculate.</div>
      </div>
      <button onclick="alert('Start 2-minute timer in your head. Record yourself on phone.')" style="margin-top:10px;padding:8px 16px;background:#0f172a;color:white;border-radius:10px;font-weight:700;font-size:0.9rem;">Start timed practice</button>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/assets/js/layout/navbar.js" defer></script>
  <script src="/assets/js/layout/footer.js" defer></script>
  <script>lucide.createIcons();</script>
</body>
</html>
