<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Substance safety</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #fff7ed, #f8fafc); color: #0f172a; }
    .card { width: 100%; height: 100vh; display: grid; align-content: center; gap: 8px; padding: 22px; border: 1px solid rgba(249, 115, 22, .28); background: rgba(255, 255, 255, .78); }
    .eyebrow { font-size: 11px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; color: #c2410c; }
    h1 { margin: 0; font-size: clamp(18px, 6vw, 34px); line-height: 1.02; letter-spacing: -.03em; }
    p { margin: 0; max-width: 58ch; font-size: clamp(12px, 2.8vw, 15px); line-height: 1.45; color: #475569; }
  </style>
</head>
<body>
  <section class="card">
    <div class="eyebrow">Substance safety</div>
    <h1>Pressure is not a reason</h1>
    <p>You can step back, say no, and ask for help if something feels unsafe.</p>
  </section>
</body>
</html>
