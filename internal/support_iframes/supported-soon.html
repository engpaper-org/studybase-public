<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyBase support slots</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #eff6ff, #f8fafc); color: #0f172a; }
    a { color: inherit; text-decoration: none; }
    .card { width: 100%; height: 100vh; display: grid; align-content: center; gap: 8px; padding: 22px; border: 1px solid rgba(148, 163, 184, 0.35); background: rgba(255, 255, 255, 0.72); }
    .eyebrow { font-size: 11px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; color: #2563eb; }
    h1 { margin: 0; font-size: clamp(18px, 6vw, 34px); line-height: 1.02; letter-spacing: -.03em; }
    p { margin: 0; max-width: 58ch; font-size: clamp(12px, 2.8vw, 15px); line-height: 1.45; color: #475569; }
  </style>
</head>
<body>
  <a class="card" href="https://internal.studybase.site/popup/supported-soon" target="_blank" rel="noopener">
    <div class="eyebrow">StudyBase support</div>
    <h1>Support slots are coming soon</h1>
    <p>Small, student-friendly placements help keep StudyBase useful, fast, and available.</p>
  </a>
</body>
</html>
