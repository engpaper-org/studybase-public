<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/config/privacyConfig.js"></script>
  <script src="/assets/js/privacy/checkCookieConsent.js"></script>
  <script src="/assets/js/auth/iframeCheck.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyBase Digital Wellbeing Support Banner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    img,
    svg,
    a,
    button {
      -webkit-user-drag: none;
      user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    :root {
      --theme-primary: #134e4b;
      --theme-secondary: #0f766e;
      --theme-accent: #5eead4;
      --text: #0f172a;
      --muted: #475569;
      --soft: #64748b;
      --border: #5eead4;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      container-type: size;
    }

    .slot {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: clamp(12px, 4cqi, 32px);
      border-radius: clamp(14px, 4cqi, 28px);
      border: 1px solid var(--border);
      background: linear-gradient(145deg, #f0fdfa 0%, #ccfbf1 100%);
      box-shadow: 
        0 12px 32px -12px rgba(13, 148, 136, 0.22),
        0 4px 6px -4px rgba(13, 148, 136, 0.12),
        inset 0 0 0 1px rgba(255,255,255,0.7);
      isolation: isolate;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), 
                  box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slot:hover {
      transform: translateY(-4px) scale(1.005);
      box-shadow: 
        0 24px 48px -12px rgba(13, 148, 136, 0.28),
        0 8px 16px -6px rgba(13, 148, 136, 0.18),
        inset 0 0 0 1px rgba(255,255,255,0.85);
    }
    .slot:active {
      transform: scale(0.985);
    }

    .slot::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.026) 1px, transparent 1px);
      background-size: clamp(22px, 8cqi, 42px) clamp(22px, 8cqi, 42px);
      mask-image: radial-gradient(circle at center, black 0%, transparent 76%);
      opacity: 0.72;
      z-index: -4;
    }

    .slot::after {
      content: "";
      position: absolute;
      inset: -110%;
      background: linear-gradient(105deg, transparent 43%, rgba(255, 255, 255, 0.72) 50%, transparent 57%);
      /* softShine removed */
      z-index: -1;
    }

    /* Colorful soft background orbs */
    .slot::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -25%;
      width: 60%;
      height: 75%;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.18) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
    }
    .slot::after {
      content: '';
      position: absolute;
      bottom: -20%;
      left: -20%;
      width: 50%;
      height: 65%;
      background: radial-gradient(circle, rgba(13, 148, 136, 0.12) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
    }

    .slot:focus-visible {
      box-shadow:
        0 24px 48px -12px rgba(13, 148, 136, 0.32),
        0 0 0 3px rgba(13, 148, 136, 0.28);
    }

    /* Subtle entrance animation */
    .content {
      animation: bannerFadeIn 420ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    }
    @keyframes bannerFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .orb {
      position: absolute;
      width: clamp(80px, 42cqi, 220px);
      aspect-ratio: 1;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(21, 151, 255, 0.16), transparent 68%);
      filter: blur(5px);
      z-index: -3;
      animation: orbMove 9s ease-in-out infinite;
    }

    .orb.one { left: -18%; top: -18%; }
    .orb.two { right: -22%; bottom: -22%; animation-delay: -3s; }

    .content {
      width: min(90%, 720px);
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      text-align: center;
      gap: clamp(8px, 3cqi, 18px);
      /* gentleFloat animation removed */
      pointer-events: none;
    }

    .logo {
      align-self: start;
      width: min(78%, 330px);
      max-height: clamp(30px, 17cqh, 74px);
      object-fit: contain;
      opacity: 0.96;
      filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.07));
    }

    .message {
      display: grid;
      gap: clamp(7px, 2.4cqi, 13px);
      place-items: center;
    }

    h1 {
      max-width: 560px;
      color: #134e4b;
      font-size: clamp(17px, 6.8cqi, 34px);
      line-height: 1.02;
      letter-spacing: -0.055em;
      font-weight: 950;
      text-wrap: balance;
    }

    p {
      max-width: 520px;
      color: #475569;
      font-size: clamp(10px, 3.1cqi, 15px);
      line-height: 1.42;
      font-weight: 650;
      text-wrap: balance;
    }

    .cta {
      color: #0f766e;
      font-size: clamp(9px, 2.4cqi, 12px);
      font-weight: 800;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }
    .slot:hover .cta {
      color: #115e59;
    }

    .default-title,
    .default-text,
    .wide-title,
    .wide-text,
    .short-title,
    .short-text,
    .tall-title,
    .tall-text,
    .tiny-title,
    .tiny-text,
    .default-cta,
    .wide-cta,
    .short-cta,
    .tall-cta,
    .tiny-cta {
      display: none;
    }

    .default-title,
    .default-text,
    .default-cta { display: block; }

    @keyframes softShine {
      0%, 66% { transform: translateX(-58%); opacity: 0; }
      76% { opacity: 1; }
      100% { transform: translateX(58%); opacity: 0; }
    }

    @keyframes orbMove {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(18px, 14px) scale(1.08); }
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @container (min-aspect-ratio: 4 / 1) {
      .slot { padding: 10px clamp(18px, 4cqi, 36px); }
      .content {
        width: 94%;
        max-width: 1180px;
        height: auto;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-rows: 1fr;
        gap: clamp(18px, 5cqi, 48px);
      }
      .logo {
        align-self: center;
        width: min(30cqi, 290px);
        max-height: 68px;
      }
      .message {
        justify-items: start;
        text-align: left;
        gap: 5px;
      }
      .default-title, .default-text, .default-cta,
      .short-title, .short-text, .short-cta,
      .tall-title, .tall-text, .tall-cta,
      .tiny-title, .tiny-text, .tiny-cta { display: none; }
      .wide-title, .wide-text { display: block; }
      .wide-cta { display: none; }
      h1 {
        max-width: 760px;
        font-size: clamp(17px, 2.7cqi, 30px);
        letter-spacing: -0.045em;
      }
      p {
        max-width: 780px;
        font-size: clamp(10px, 1.35cqi, 14px);
        line-height: 1.36;
      }
    }

    @container (max-height: 120px) {
      .slot { padding: 9px 16px; }
      .content {
        width: 96%;
        height: auto;
        grid-template-columns: auto 1fr;
        grid-template-rows: 1fr;
        gap: clamp(10px, 3cqi, 20px);
      }
      .logo {
        align-self: center;
        width: min(34cqi, 210px);
        max-height: 52px;
      }
      .message {
        justify-items: start;
        text-align: left;
        gap: 3px;
      }
      .default-title, .default-text, .default-cta,
      .wide-title, .wide-text, .wide-cta,
      .tall-title, .tall-text, .tall-cta,
      .tiny-title, .tiny-text, .tiny-cta { display: none; }
      .short-title, .short-text, .short-cta { display: block; }
      h1 {
        font-size: clamp(13px, 4cqh, 20px);
        letter-spacing: -0.04em;
        max-width: none;
      }
      .short-text {
        max-width: 780px;
        font-size: clamp(8px, 1.45cqi, 12px);
        line-height: 1.25;
      }
      .cta { font-size: clamp(8px, 1.35cqi, 11px); }
    }

    @container (max-aspect-ratio: 2 / 3) {
      .slot { padding: clamp(14px, 7cqi, 24px); }
      .content {
        width: 92%;
        grid-template-rows: auto 1fr auto;
        gap: clamp(10px, 5cqi, 22px);
      }
      .logo {
        width: min(92%, 240px);
        max-height: clamp(34px, 10cqh, 62px);
      }
      .message { gap: clamp(8px, 4cqi, 13px); }
      .default-title, .default-text, .default-cta,
      .wide-title, .wide-text, .wide-cta,
      .short-title, .short-text, .short-cta,
      .tiny-title, .tiny-text, .tiny-cta { display: none; }
      .tall-title, .tall-text, .tall-cta { display: block; }
      h1 {
        max-width: 240px;
        font-size: clamp(18px, 8.4cqi, 30px);
        line-height: 1.02;
      }
      p {
        max-width: 235px;
        font-size: clamp(10px, 4.1cqi, 13px);
        line-height: 1.36;
      }
    }

    @container (max-width: 230px) {
      .slot { padding: 12px; }
      .content { width: 94%; }
      .logo {
        width: 90%;
        max-height: 44px;
      }
      .default-title, .default-text, .default-cta,
      .wide-title, .wide-text, .wide-cta,
      .short-title, .short-text, .short-cta,
      .tall-title, .tall-text, .tall-cta { display: none; }
      .tiny-title, .tiny-text, .tiny-cta { display: block; }
      h1 {
        font-size: clamp(15px, 9cqi, 21px);
        max-width: 180px;
      }
      p {
        max-width: 180px;
        font-size: clamp(9px, 4.2cqi, 12px);
      }
    }

    @container (max-aspect-ratio: 1 / 1) and (min-aspect-ratio: 2 / 3) {
      .content { width: 88%; }
      .logo { width: min(86%, 300px); }
      h1 { max-width: 320px; }
      p { max-width: 300px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="slot" id="supportBanner" aria-label="StudyBase digital wellbeing support banner" tabindex="0" role="link">
    <section class="content">
      <img
        draggable="false"
        class="logo"
        src="/assets/images/site-icons/navbar-digitalwellbeing.svg"
        alt="StudyBase Digital Wellbeing Support"
      />

      <div class="message">
        <h1 class="default-title" id="defaultTitle"></h1>
        <h1 class="wide-title" id="wideTitle"></h1>
        <h1 class="short-title" id="shortTitle"></h1>
        <h1 class="tall-title" id="tallTitle"></h1>
        <h1 class="tiny-title" id="tinyTitle"></h1>

        <p class="default-text" id="defaultText"></p>
        <p class="wide-text" id="wideText"></p>
        <p class="short-text" id="shortText"></p>
        <p class="tall-text" id="tallText"></p>
        <p class="tiny-text" id="tinyText"></p>

        <p class="cta default-cta">Click the banner to open support.</p>
        <p class="cta wide-cta">Click the banner to open support.</p>
        <p class="cta short-cta">Click for support.</p>
        <p class="cta tall-cta">Click for support.</p>
        <p class="cta tiny-cta">Click banner.</p>
      </div>

    </section>
  </main>

  <script>
    const variants = [
      {
        title: "Digital Wellbeing Support",
        shortTitle: "Digital wellbeing.",
        tinyTitle: "Wellbeing.",
        defaultText: "If an online habit feels hard to stop, small steps and private support can help you regain control.",
        wideText: "If an online habit feels hard to stop, you are not alone. Small steps and private support can help you regain control without shame.",
        shortText: "If an online habit feels hard to stop, support can help.",
        tallText: "Small steps and private support can help you reset your online routine.",
        tinyText: "Support helps.",
        supportHref: "https://www.nhs.uk/live-well/addiction-support/"
      },
      {
        title: "Noticing a pattern is a strong first step.",
        shortTitle: "Notice the pattern.",
        tinyTitle: "Notice it.",
        defaultText: "If scrolling affects sleep, mood, focus, or relationships, pause and ask for support.",
        wideText: "If scrolling affects sleep, mood, focus, confidence, or relationships, it may be time to pause, reset, and ask for support.",
        shortText: "If it affects sleep, mood, or focus, take a pause.",
        tallText: "If an online habit affects your day, a pause can help.",
        tinyText: "Pause early.",
        supportHref: "https://www.nhs.uk/live-well/addiction-support/"
      },
      {
        title: "You can make the next choice smaller.",
        shortTitle: "Make it smaller.",
        tinyTitle: "Small step.",
        defaultText: "Try one safer step: move your device, change a setting, or talk to someone trusted.",
        wideText: "Try one safer step: move your device away, change a setting, talk to someone trusted, or do something offline for ten minutes.",
        shortText: "Move away, change setting, or talk to someone trusted.",
        tallText: "Move your device away or do something offline for ten minutes.",
        tinyText: "Step away.",
        supportHref: "https://www.nhs.uk/live-well/addiction-support/"
      }
    ];

    const chosen = variants[Math.floor(Math.random() * variants.length)];

    document.getElementById('defaultTitle').textContent = chosen.title;
    document.getElementById('wideTitle').textContent = chosen.title;
    document.getElementById('shortTitle').textContent = chosen.shortTitle;
    document.getElementById('tallTitle').textContent = chosen.shortTitle;
    document.getElementById('tinyTitle').textContent = chosen.tinyTitle;

    document.getElementById('defaultText').textContent = chosen.defaultText;
    document.getElementById('wideText').textContent = chosen.wideText;
    document.getElementById('shortText').textContent = chosen.shortText;
    document.getElementById('tallText').textContent = chosen.tallText;
    document.getElementById('tinyText').textContent = chosen.tinyText;

    const banner = document.getElementById('supportBanner');

    const openSupport = () => {
      try {
        window.parent.postMessage({
          type: 'show-external-warning',
          url: chosen.supportHref
        }, '*');
      } catch (e) {
        window.open(chosen.supportHref, '_blank', 'noopener,noreferrer');
      }
    };

    banner.addEventListener('click', openSupport);
    banner.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openSupport();
      }
    });

    document.addEventListener('dragstart', (event) => {
      if (event.target && event.target.closest('img, svg, a, button')) {
        event.preventDefault();
      }
    });
  </script>
</body>
</html>
