<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="/assets/js/auth/iframeCheck.js"></script>
  <meta name="description" content="This version of StudyBase has been disabled due to security reasons." data-studybase-education-meta="true">
  <meta name="classification" content="Education" data-studybase-education-meta="true">
  <meta name="category" content="Education" data-studybase-education-meta="true">
  <meta name="audience" content="Students, teachers, and learners" data-studybase-education-meta="true">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="/assets/js/config/siteConfig.js"></script>

  <title>StudyBase unavailable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #111827;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(460px, 100%);
      text-align: center;
    }

    .logo {
      width: 154px;
      max-width: 75%;
      height: auto;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1;
      letter-spacing: -0.06em;
      font-weight: 800;
    }

    p {
      margin: 18px auto 0;
      max-width: 390px;
      color: #5b6472;
      font-size: 1rem;
      line-height: 1.65;
      font-weight: 500;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 28px;
      min-height: 50px;
      padding: 0 22px;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.18);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .button:hover {
      background: #000000;
      transform: translateY(-1px);
      box-shadow: 0 16px 36px rgba(17, 24, 39, 0.22);
    }

    .url {
      margin-top: 16px;
      color: #8a93a3;
      font-size: 0.82rem;
      font-weight: 600;
      word-break: break-word;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px;
      }

      .logo {
        margin-bottom: 24px;
      }
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <img class="logo" src="https://studybase.site/assets/images/site-icons/navbar-lockup.svg" alt="StudyBase">

    <h1>StudyBase has moved.</h1>

    <p>
      This version has been disabled for security reasons. Please use the newest working StudyBase domain instead.
    </p>

    <a class="button" href="https://takemetoaworkingstudybase.site/">
      Open newest StudyBase
