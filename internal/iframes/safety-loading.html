    <meta charset="UTF-8">

    <meta name="classification" content="Education" data-studybase-education-meta="true">
    <meta name="category" content="Education" data-studybase-education-meta="true">
    <meta name="subject" content="A-Level and GCSE revision, study resources, educational tools" data-studybase-education-meta="true">
    <meta name="audience" content="Students, teachers, and learners" data-studybase-education-meta="true">
    <meta name="educational-use" content="Revision, exam preparation, independent study" data-studybase-education-meta="true">
    <meta name="learning-resource-type" content="Revision resource" data-studybase-education-meta="true">
    <meta property="og:site_name" content="StudyBase" data-studybase-education-meta="true">
    <meta property="og:type" content="website" data-studybase-education-meta="true">
    <meta property="og:locale" content="en_GB" data-studybase-education-meta="true">
    <script src="/assets/js/config/siteConfig.js"></script>
    <link rel="stylesheet" href="/assets/css/main/studybase.css?v=20260509-dark3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBase Loading Screen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css?v=20260526-remaster">
</head>
<body class="m-0 p-0 h-screen w-screen overflow-hidden bg-sky-900 font-sans relative">

    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-sky-600 via-sky-800 to-slate-900 z-0"></div>

    <img id="loading-image" src="" alt="StudyBase Loading" class="absolute inset-0 w-full h-full object-cover z-10">

    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent z-10"></div>

    <div class="absolute bottom-12 left-0 right-0 z-30 flex flex-col items-center">
        <h1 class="text-lg font-black tracking-[0.5em] text-white uppercase drop-shadow-md">Loading</h1>
        <div class="flex gap-1 mt-2">
            <div class="w-2 h-2 bg-white rounded-full animate-bounce [animation-delay:-0.3s] shadow-lg"></div>
            <div class="w-2 h-2 bg-white rounded-full animate-bounce [animation-delay:-0.15s] shadow-lg"></div>
            <div class="w-2 h-2 bg-white rounded-full animate-bounce shadow-lg"></div>
        </div>
    </div>

    <div class="absolute bottom-6 left-6 z-30 flex items-center gap-2 opacity-80 drop-shadow-md">
        <i data-lucide="book-open" class="w-4 h-4 text-white"></i>
        <span class="text-[10px] text-white tracking-widest uppercase font-bold">StudyBase</span>
    </div>

    <script>
        // Set this to the total number of loading screen images you have in the folder
        const MAX_SCREENS = 5; 

        function getSeenImages() {
            try { return JSON.parse(localStorage.getItem('loading_image_rotation') || '[]'); } 
            catch (e) { return []; }
        }

        function saveSeenImages(arr) {
            try { localStorage.setItem('loading_image_rotation', JSON.stringify(arr)); } 
            catch (e) { }
        }

        function displayRandomImage() {
            let seen = getSeenImages();
            
            // Reset if all images have been shown
            if (seen.length >= MAX_SCREENS) {
                seen = [];
            }

            // Generate an array of all possible image numbers [1, 2, 3, ..., MAX_SCREENS]
            const allPossible = Array.from({ length: MAX_SCREENS }, (_, i) => i + 1);

            // Filter out the numbers we have already seen
            const available = allPossible.filter(num => !seen.includes(num));

            // Pick a random number from the remaining available ones
            const pickedNumber = available[Math.floor(Math.random() * available.length)];

            // Save the newly picked number to history
            seen.push(pickedNumber);
            saveSeenImages(seen);

            // Apply to DOM directly using the generated path
            const imgElement = document.getElementById('loading-image');
            imgElement.src = `/assets/images/loading-screens/${pickedNumber}.png`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            displayRandomImage();
            lucide.createIcons();
        });
    </script>
</body>
</html>
