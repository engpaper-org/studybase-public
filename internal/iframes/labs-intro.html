<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/config/privacyConfig.js?v=20260714"></script>
  <script src="/assets/js/privacy/checkCookieConsent.js?v=20260712"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/assets/js/auth/iframeCheck.js"></script>
  <title>StudyBase Labs Intro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .intro {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 48%, rgba(34, 191, 128, 0.18), transparent 34%),
        radial-gradient(circle at 18% 18%, rgba(112, 255, 203, 0.25), transparent 28%),
        radial-gradient(circle at 82% 78%, rgba(34, 191, 128, 0.16), transparent 32%),
        #ffffff;
      animation: finalFade 0.35s ease forwards;
      animation-delay: 2.78s;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
      opacity: 0;
      animation: fadeIn 0.7s ease forwards;
    }

    .bg-ring {
      position: absolute;
      width: min(84vw, 720px);
      height: min(84vw, 720px);
      border-radius: 50%;
      border: 1px solid rgba(34, 191, 128, 0.18);
      box-shadow:
        0 0 80px rgba(34, 191, 128, 0.12),
        inset 0 0 70px rgba(34, 191, 128, 0.08);
      opacity: 0;
      transform: scale(0.65);
      animation: ringIn 1.1s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .bg-ring::before,
    .bg-ring::after {
      content: "";
      position: absolute;
      inset: 42px;
      border-radius: inherit;
      border: 1px dashed rgba(34, 191, 128, 0.22);
      animation: spin 7s linear infinite;
    }

    .bg-ring::after {
      inset: 92px;
      animation-direction: reverse;
      opacity: 0.55;
    }

    .stage {
      position: relative;
      z-index: 5;
      width: min(88vw, 980px);
      height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
      animation: stagePunch 0.32s cubic-bezier(.2, 1.2, .4, 1) forwards;
      animation-delay: 2.24s;
    }

    .logo-wrap {
      position: relative;
      width: 100%;
      display: grid;
      place-items: center;
      transform: scale(0.78);
      opacity: 0;
      filter: blur(12px);
      animation:
        logoReveal 0.9s cubic-bezier(.16, 1, .3, 1) forwards,
        logoFloat 1.8s ease-in-out infinite;
      animation-delay: 0.16s, 1s;
    }

    .logo {
      width: min(88vw, 980px);
      max-height: 34vh;
      object-fit: contain;
      filter: drop-shadow(0 28px 48px rgba(0, 0, 0, 0.09));
    }

    .shine {
      position: absolute;
      inset: -90%;
      background: linear-gradient(
        105deg,
        transparent 42%,
        rgba(255, 255, 255, 0.96) 50%,
        transparent 58%
      );
      opacity: 0;
      transform: translateX(-70%);
      animation: shine 1.45s ease forwards;
      animation-delay: 0.8s;
      pointer-events: none;
    }

    .spark {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #22bf80;
      box-shadow: 0 0 22px rgba(34, 191, 128, 0.65);
      opacity: 0;
      animation: sparkFloat 2s ease-in-out infinite;
    }

    .spark:nth-of-type(1) {
      left: 16%;
      top: 35%;
      animation-delay: 0.1s;
    }

    .spark:nth-of-type(2) {
      left: 26%;
      top: 67%;
      animation-delay: 0.35s;
    }

    .spark:nth-of-type(3) {
      right: 18%;
      top: 32%;
      animation-delay: 0.6s;
    }

    .spark:nth-of-type(4) {
      right: 28%;
      top: 68%;
      animation-delay: 0.85s;
    }

    .spark:nth-of-type(5) {
      left: 50%;
      top: 22%;
      animation-delay: 1.05s;
    }

    .spark:nth-of-type(6) {
      left: 45%;
      bottom: 20%;
      animation-delay: 1.3s;
    }

    .burst {
      position: absolute;
      z-index: 10;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #22bf80;
      box-shadow:
        0 0 20px rgba(34, 191, 128, 0.7),
        0 0 80px rgba(34, 191, 128, 0.42),
        0 0 160px rgba(34, 191, 128, 0.24);
      transform: scale(0);
      opacity: 0;
      animation: burstCore 0.62s cubic-bezier(.1, .8, .2, 1) forwards;
      animation-delay: 2.32s;
    }

    .burst-ring {
      position: absolute;
      z-index: 9;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid rgba(34, 191, 128, 0.85);
      transform: scale(0);
      opacity: 0;
      animation: burstRing 0.72s cubic-bezier(.1, .8, .2, 1) forwards;
      animation-delay: 2.28s;
    }

    .rays {
      position: absolute;
      z-index: 8;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .ray {
      position: absolute;
      width: 14px;
      height: 170px;
      border-radius: 999px;
      background: linear-gradient(
        to top,
        rgba(34, 191, 128, 0),
        rgba(34, 191, 128, 0.9),
        rgba(34, 191, 128, 0)
      );
      opacity: 0;
      transform-origin: 50% 100%;
      animation: rayBurst 0.58s cubic-bezier(.1, .8, .2, 1) forwards;
      animation-delay: 2.3s;
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: radial-gradient(
        circle at center,
        rgba(255, 255, 255, 1),
        rgba(34, 191, 128, 0.34),
        transparent 68%
      );
      opacity: 0;
      pointer-events: none;
      animation: flashOut 0.5s ease forwards;
      animation-delay: 2.42s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes ringIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes logoReveal {
      0% {
        transform: scale(0.78);
        opacity: 0;
        filter: blur(12px);
      }

      70% {
        transform: scale(1.025);
        opacity: 1;
        filter: blur(0);
      }

      100% {
        transform: scale(1);
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-5px) scale(1.006);
      }
    }

    @keyframes shine {
      0% {
        opacity: 0;
        transform: translateX(-70%);
      }

      25% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateX(70%);
      }
    }

    @keyframes sparkFloat {
      0% {
        transform: translateY(18px) scale(0.7);
        opacity: 0;
      }

      28% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-26px) scale(1.15);
        opacity: 0;
      }
    }

    @keyframes stagePunch {
      0% {
        transform: scale(1);
        filter: blur(0);
      }

      70% {
        transform: scale(1.08);
        filter: blur(1px);
      }

      100% {
        transform: scale(1.13);
        filter: blur(8px);
        opacity: 0;
      }
    }

    @keyframes burstCore {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      30% {
        opacity: 1;
      }

      100% {
        transform: scale(52);
        opacity: 1;
      }
    }

    @keyframes burstRing {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      25% {
        opacity: 1;
      }

      100% {
        transform: scale(8);
        opacity: 0;
      }
    }

    @keyframes rayBurst {
      0% {
        opacity: 0;
        transform: rotate(var(--r)) translateY(-72px) scaleY(0);
      }

      35% {
        opacity: 0.85;
      }

      100% {
        opacity: 0;
        transform: rotate(var(--r)) translateY(-230px) scaleY(1);
      }
    }

    @keyframes flashOut {
      0% {
        opacity: 0;
      }

      25% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    @keyframes finalFade {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @media (max-width: 640px) {
      .stage {
        width: 94vw;
      }

      .logo {
        width: 94vw;
        max-height: 23vh;
      }

      .bg-ring {
        width: 96vw;
        height: 96vw;
      }

      .ray {
        height: 120px;
      }
    }
  </style>
</head>

<body>
  <main class="intro">
    <div class="grid"></div>
    <div class="bg-ring"></div>

    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <section class="stage" aria-label="StudyBase Labs opening transition">
      <div class="logo-wrap">
        <img
          class="logo"
          src="https://studybase.site/assets/images/site-icons/navbar-labs.svg"
          alt="StudyBase Labs"
        />
        <div class="shine"></div>
      </div>
    </section>

    <div class="burst-ring"></div>

    <div class="rays">
      <div class="ray" style="--r: 0deg;"></div>
      <div class="ray" style="--r: 45deg;"></div>
      <div class="ray" style="--r: 90deg;"></div>
      <div class="ray" style="--r: 135deg;"></div>
      <div class="ray" style="--r: 180deg;"></div>
      <div class="ray" style="--r: 225deg;"></div>
      <div class="ray" style="--r: 270deg;"></div>
      <div class="ray" style="--r: 315deg;"></div>
    </div>

    <div class="burst"></div>
    <div class="flash"></div>
  </main>

  <script>
    const INTRO_LENGTH = 3000;

    setTimeout(() => {
      window.parent.postMessage({
        type: "STUDYBASE_INTRO_COMPLETE",
        source: "studybase-opening-transition",
        completed: true
      }, "*");
    }, INTRO_LENGTH);
  </script>
</body>
</html>
