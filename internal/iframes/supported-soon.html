<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/assets/js/auth/iframeCheck.js"></script>
  <title>StudyBase Promo Placeholder</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --sb-blue: #1597ff;
      --sb-cyan: #35d9ff;
      --text: #050505;
      --muted: rgba(0, 0, 0, 0.56);
      --soft: rgba(0, 0, 0, 0.36);
      --border: rgba(0, 0, 0, 0.08);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      container-type: size;
    }

    .slot {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: clamp(12px, 5cqi, 30px);
      border-radius: clamp(12px, 4cqi, 28px);
      border: 1px solid var(--border);
      background:
        radial-gradient(circle at 22% 14%, rgba(53, 217, 255, 0.22), transparent 34%),
        radial-gradient(circle at 86% 84%, rgba(21, 151, 255, 0.18), transparent 38%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.97), rgba(255, 255, 255, 0.76));
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.62),
        0 18px 46px rgba(0, 0, 0, 0.06);
      isolation: isolate;
    }

    .slot::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.028) 1px, transparent 1px);
      background-size: clamp(22px, 8cqi, 42px) clamp(22px, 8cqi, 42px);
      mask-image: radial-gradient(circle at center, black 0%, transparent 76%);
      opacity: 0.75;
      z-index: -4;
    }

    .slot::after {
      content: "";
      position: absolute;
      inset: -110%;
      background: linear-gradient(
        105deg,
        transparent 43%,
        rgba(255, 255, 255, 0.72) 50%,
        transparent 57%
      );
      animation: softShine 8s ease-in-out infinite;
      z-index: -1;
    }

    .orb {
      position: absolute;
      width: clamp(80px, 42cqi, 220px);
      aspect-ratio: 1;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(21, 151, 255, 0.16), transparent 68%);
      filter: blur(5px);
      z-index: -3;
      animation: orbMove 9s ease-in-out infinite;
    }

    .orb.one {
      left: -18%;
      top: -18%;
    }

    .orb.two {
      right: -22%;
      bottom: -22%;
      animation-delay: -3s;
    }

    .content {
      width: min(88%, 520px);
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      text-align: center;
      gap: clamp(8px, 3cqi, 18px);
      animation: gentleFloat 5.5s ease-in-out infinite;
    }

    .logo {
      align-self: start;
      width: min(78%, 330px);
      max-height: clamp(30px, 17cqh, 74px);
      object-fit: contain;
      opacity: 0.96;
      filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.07));
    }

    .message {
      display: grid;
      gap: clamp(7px, 2.2cqi, 12px);
      place-items: center;
    }

    h1 {
      max-width: 440px;
      color: var(--text);
      font-size: clamp(15px, 6.4cqi, 31px);
      line-height: 1.04;
      letter-spacing: -0.055em;
      font-weight: 950;
      text-wrap: balance;
    }

    p {
      max-width: 390px;
      color: var(--muted);
      font-size: clamp(10px, 3.1cqi, 14px);
      line-height: 1.42;
      font-weight: 650;
      text-wrap: balance;
    }

    .mini-row {
      align-self: end;
      color: var(--soft);
      font-size: clamp(8px, 2.4cqi, 11px);
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @keyframes softShine {
      0%, 66% {
        transform: translateX(-58%);
        opacity: 0;
      }

      76% {
        opacity: 1;
      }

      100% {
        transform: translateX(58%);
        opacity: 0;
      }
    }

    @keyframes orbMove {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(18px, 14px) scale(1.08);
      }
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    /* Very wide banner slots */
    @container (min-aspect-ratio: 4 / 1) {
      .slot {
        padding: 10px clamp(16px, 4cqi, 32px);
      }

      .content {
        width: 92%;
        height: auto;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: 1fr;
        gap: clamp(14px, 4cqi, 30px);
      }

      .logo {
        align-self: center;
        width: min(34cqi, 260px);
        max-height: 62px;
      }

      .message {
        justify-items: start;
        text-align: left;
        gap: 4px;
      }

      h1 {
        font-size: clamp(15px, 3.6cqi, 26px);
      }

      p {
        font-size: clamp(9px, 1.6cqi, 13px);
        max-width: 460px;
      }

      .mini-row {
        align-self: center;
      }
    }

    /* Very short slots */
    @container (max-height: 120px) {
      .slot {
        padding: 9px 14px;
      }

      .content {
        width: 94%;
        height: auto;
        grid-template-columns: auto 1fr;
        grid-template-rows: 1fr;
        gap: 12px;
      }

      .logo {
        align-self: center;
        width: min(38cqi, 190px);
        max-height: 48px;
      }

      .message {
        justify-items: start;
        text-align: left;
        gap: 0;
      }

      h1 {
        font-size: clamp(13px, 4cqh, 20px);
        letter-spacing: -0.04em;
      }

      p,
      .mini-row {
        display: none;
      }
    }

    /* Narrow/tall side slots like your screenshot */
    @container (max-aspect-ratio: 2 / 3) {
      .slot {
        padding: clamp(14px, 7cqi, 24px);
      }

      .content {
        width: 92%;
        grid-template-rows: auto 1fr auto;
        gap: clamp(10px, 5cqi, 22px);
      }

      .logo {
        width: min(92%, 240px);
        max-height: clamp(34px, 10cqh, 62px);
      }

      h1 {
        max-width: 230px;
        font-size: clamp(17px, 8.2cqi, 28px);
        line-height: 1.02;
      }

      p {
        max-width: 230px;
        font-size: clamp(10px, 4.1cqi, 13px);
        line-height: 1.35;
      }

      .mini-row {
        font-size: clamp(8px, 3.2cqi, 10px);
        white-space: normal;
        line-height: 1.2;
      }
    }

    /* Tiny narrow slots */
    @container (max-width: 230px) {
      .slot {
        padding: 12px;
      }

      .content {
        width: 94%;
      }

      .logo {
        width: 90%;
        max-height: 44px;
      }

      h1 {
        font-size: clamp(15px, 9cqi, 21px);
        max-width: 180px;
      }

      p {
        display: none;
      }

      .mini-row {
        font-size: 8px;
      }
    }

    /* Square-ish compact slots */
    @container (max-aspect-ratio: 1 / 1) and (min-aspect-ratio: 2 / 3) {
      .content {
        width: 88%;
      }

      .logo {
        width: min(86%, 300px);
      }

      h1 {
        max-width: 300px;
      }

      p {
        max-width: 290px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="slot" aria-label="StudyBase future promo slot">
    <div class="orb one"></div>
    <div class="orb two"></div>

    <section class="content">
      <img
        class="logo"
        src="https://studybase.site/assets/images/site-icons/navbar-lockup.svg"
        alt="StudyBase"
      />

      <div class="message">
        <h1>Future promos may appear here.</h1>
        <p>
          This space is reserved for occasional StudyBase updates,
          featured resources, or partner promotions.
        </p>
      </div>

      <div class="mini-row">
        StudyBase promo space
      </div>
    </section>
  </main>
</body>
</html>
