<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Mix</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; overflow: hidden; }
    .cover-float {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      will-change: transform;
    }
    @keyframes entrance {
      0% { transform: scale(0) rotate(180deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(var(--dx1), var(--dy1)) rotate(var(--r1)); }
      50% { transform: translate(var(--dx2), var(--dy2)) rotate(var(--r2)); }
      75% { transform: translate(var(--dx3), var(--dy3)) rotate(var(--r3)); }
    }
    @keyframes blast {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: scale(0.2) rotate(var(--blast-rot)) translate(var(--blast-x), var(--blast-y)); opacity: 0; }
    }
    .cover-float.entering { animation: entrance 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .cover-float.drifting { animation: drift var(--drift-dur) ease-in-out infinite; }
    .cover-float.blasting { animation: blast 0.7s cubic-bezier(0.55,0,1,0.45) forwards; }
    .genre-btn {
      transition: transform 0.2s, box-shadow 0.2s, outline 0.2s;
      outline: 3px solid transparent;
    }
    .genre-btn:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(124,58,237,0.3); }
    .genre-btn.selected { outline: 3px solid #fff; transform: scale(1.12); box-shadow: 0 0 20px rgba(255,255,255,0.4); }
    .confirm-btn {
      transition: transform 0.2s, opacity 0.3s;
    }
    .confirm-btn:disabled { opacity: 0.4; transform: scale(0.95); }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 10px rgba(124,58,237,0.5); }
      50% { box-shadow: 0 0 30px rgba(124,58,237,0.8); }
    }
    .confirm-btn:not(:disabled) { animation: pulse-glow 1.5s ease-in-out infinite; }
    .ui-layer {
      opacity: 0;
      animation: fadeUp 0.8s 0.5s ease forwards;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 <script src="/_sdk/telemetry_sdk.js"></script></head>
 <body data-template-id="__page-root" class="w-full relative" style="min-height: calc(100 * min(var(--vh,1vh),1vh)); background: rgb(26, 16, 51);">
  <div id="cover-container" class="absolute inset-0 pointer-events-none z-0"></div>
  <main class="relative z-10 flex flex-col items-center justify-center text-center px-6 py-8 ui-layer" style="min-height:calc(100 * min(var(--vh,1vh),1vh))">
   <h1 data-template-id="main-heading" class="canva-text text-4xl md:text-5xl font-black tracking-tight mb-2" style="color: rgb(255, 255, 255); font-weight: 900; font-style: normal; font-size: 36px;">Choose Your Mix</h1>
   <p data-template-id="subtitle" class="canva-text text-base md:text-lg mb-8 max-w-md" style="color: rgb(196, 181, 253); font-weight: 400; font-style: normal; font-size: 16px;">Tap your vibes, then let's build your playlist</p>
   <div class="flex flex-wrap justify-center gap-3 max-w-lg mb-6"><button data-template-id="btn-hiphop" class="canva-button genre-btn px-5 py-2.5 rounded-full font-bold" style="background: rgb(124, 58, 237); color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Hip Hop</button> <button data-template-id="btn-electronic" class="canva-button genre-btn px-5 py-2.5 rounded-full font-bold" style="background: rgb(236, 72, 153); color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Electronic</button> <button data-template-id="btn-indie" class="canva-button genre-btn px-5 py-2.5 rounded-full font-bold" style="background: rgb(249, 115, 22); color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Indie</button> <button data-template-id="btn-jazz" class="canva-button genre-btn px-5 py-2.5 rounded-full font-bold" style="background: rgb(14, 165, 233); color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Jazz</button> <button data-template-id="btn-lofi" class="canva-button genre-btn px-5 py-2.5 rounded-full font-bold" style="background: rgb(16, 185, 129); color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Lo-Fi</button> <button data-template-id="btn-rock" class="canva-button genre-btn px-5 py-2.5 rounded-full font-bold" style="background: rgb(239, 68, 68); color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Rock</button>
   </div><button data-template-id="confirm-btn" class="canva-button confirm-btn px-8 py-3 rounded-full font-bold text-lg" disabled="" style="background: rgb(124, 58, 237); color: rgb(255, 255, 255); font-weight: 700; font-style: normal; font-size: 16px;">Make My Playlist</button>
  </main>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
    const coverUrls = [
      'https://studybase.site/assets/images/m-covers/rap.jpg',
      'https://studybase.site/assets/images/m-covers/hip.jpg',
      'https://studybase.site/assets/images/m-covers/drill.jpg',
      'https://studybase.site/assets/images/m-covers/grime.jpg',
      'https://studybase.site/assets/images/m-covers/house.jpg',
      'https://studybase.site/assets/images/m-covers/indie.jpg',
      'https://studybase.site/assets/images/m-covers/jazz.jpg',
      'https://studybase.site/assets/images/m-covers/pop.jpg',
      'https://studybase.site/assets/images/m-covers/rock.jpg',
      'https://studybase.site/assets/images/m-covers/rnb.jpg',
      'https://studybase.site/assets/images/m-covers/country.jpg'
    ];

    const container = document.getElementById('cover-container');
    const rand = (min, max) => Math.random() * (max - min) + min;

    coverUrls.forEach((url, i) => {
      const img = document.createElement('img');
      img.src = url;
      img.className = 'cover-float entering';
      img.style.top = rand(5, 80) + '%';
      img.style.left = rand(5, 80) + '%';
      img.style.animationDelay = (i * 0.12) + 's';
      container.appendChild(img);

      setTimeout(() => {
        img.classList.remove('entering');
        img.classList.add('drifting');
        img.style.setProperty('--dx1', rand(-60, 60) + 'px');
        img.style.setProperty('--dy1', rand(-60, 60) + 'px');
        img.style.setProperty('--r1', rand(-15, 15) + 'deg');
        img.style.setProperty('--dx2', rand(-80, 80) + 'px');
        img.style.setProperty('--dy2', rand(-80, 80) + 'px');
        img.style.setProperty('--r2', rand(-20, 20) + 'deg');
        img.style.setProperty('--dx3', rand(-50, 50) + 'px');
        img.style.setProperty('--dy3', rand(-50, 50) + 'px');
        img.style.setProperty('--r3', rand(-10, 10) + 'deg');
        img.style.setProperty('--drift-dur', rand(4, 8) + 's');
      }, 600 + i * 120);
    });

    // Genre selection
    const selected = new Set();
    const confirmBtn = document.querySelector('[data-template-id="confirm-btn"]');

    document.querySelectorAll('.genre-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-template-id');
        if (selected.has(id)) {
          selected.delete(id);
          btn.classList.remove('selected');
        } else {
          selected.add(id);
          btn.classList.add('selected');
        }
        confirmBtn.disabled = selected.size === 0;
      });
    });

    confirmBtn.addEventListener('click', () => {
      if (selected.size === 0) return;
      const covers = container.querySelectorAll('.cover-float');
      covers.forEach((img, i) => {
        img.classList.remove('drifting');
        img.style.setProperty('--blast-x', rand(-600, 600) + 'px');
        img.style.setProperty('--blast-y', rand(-600, 600) + 'px');
        img.style.setProperty('--blast-rot', rand(-360, 360) + 'deg');
        img.style.animationDelay = (i * 0.05) + 's';
        img.classList.add('blasting');
      });

      document.querySelector('main').style.transition = 'opacity 0.5s';
      document.querySelector('main').style.opacity = '0';

      setTimeout(() => {
        window.parent.postMessage('DONE', '*');
      }, 1200);
    });
  </script>
