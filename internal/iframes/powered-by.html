<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<script src="/assets/js/auth/iframeCheck.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4faff">
<title>Powered by intro</title>
<style>*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
body{font-family:"Segoe UI Variable Display","Segoe UI",Arial,sans-serif;background:#f4faff;color:#082443;-webkit-font-smoothing:antialiased}
main{position:relative;isolation:isolate;overflow:hidden;min-height:100%;display:grid;place-items:center;padding:32px 20px 40px}
.wash{position:absolute;z-index:-1;inset:-25%;pointer-events:none;background:radial-gradient(ellipse at 30% 28%,#b0f3ff90,transparent 43%),radial-gradient(ellipse at 76% 75%,#9dc5ff75,transparent 43%);animation:light 2.5s ease-out both}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
h1{margin:0;font-weight:600;line-height:1.08;letter-spacing:-.055em;font-size:clamp(42px,10vw,100px)}
.powered-label{display:block;font-size:clamp(13px,1.8vw,17px);font-weight:500;letter-spacing:.17em;text-transform:uppercase;color:#59758e;margin-bottom:14px;animation:reveal .55s .3s both}
.domain{display:block;animation:reveal .7s .45s both}
.domain span{color:#087dcc;font-weight:400}
.brand-pair{position:relative;display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:32px}
.brand-pair::before{content:"";position:absolute;inset:-40px -70px;z-index:-1;background:radial-gradient(ellipse,#7fd8ff30,transparent 70%);animation:reveal .8s both}
.brand-mark{width:100px;height:100px;display:grid;place-items:center;border-radius:27px;background:linear-gradient(145deg,#ffffffdf,#ffffff66);border:1px solid #fff;box-shadow:0 12px 35px #2163950b,inset 0 1px 0 #fff;animation:brand-in .8s cubic-bezier(.2,.8,.2,1) both}
.brand-mark img{display:block;object-fit:contain;max-width:82%;max-height:82%}
.studybase-mark{--offset:-16px;--tilt:-5deg}
.mas0ng-mark{--offset:16px;--tilt:5deg;animation-delay:.1s}
.collaboration{font-size:25px;font-weight:300;line-height:1;color:#7b9ab4;animation:reveal .45s .2s both}
.progress-track{position:fixed;z-index:5;bottom:0;left:0;width:100%;height:8px;background:#cbdfea;overflow:hidden}
.progress-fill{width:100%;height:100%;background:linear-gradient(90deg,#36cfec,#0087ed);transform:scaleX(0);transform-origin:left;will-change:transform}
@keyframes reveal{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes brand-in{from{opacity:0;transform:translate(var(--offset),8px) rotate(var(--tilt)) scale(.94)}to{opacity:1;transform:none}}
@keyframes light{from{opacity:.4;transform:translate(-2%,2%) scale(.95)}to{opacity:1;transform:none}}
@media(max-width:480px){.brand-pair{gap:19px;margin-bottom:28px}.brand-mark{width:84px;height:84px;border-radius:23px}.brand-mark img{max-width:78%;max-height:78%}.collaboration{font-size:22px}}
@media(max-height:420px){main{padding:20px}.brand-pair{margin-bottom:20px}.brand-mark{width:66px;height:66px;border-radius:18px}h1{font-size:clamp(36px,8vw,62px)}.powered-label{font-size:12px;margin-bottom:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}}
.more{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:26px;min-height:42px;padding:10px 19px;border:1px solid #adc9df;border-radius:30px;background:#ffffff80;color:#345c7c;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.01em;animation:reveal .5s .65s both;transition:background .2s,border-color .2s}.more:hover{background:#fff;border-color:#528bb7}.more:focus-visible{outline:2px solid #086bb7;outline-offset:4px}@media(max-height:420px){.more{margin-top:18px;min-height:38px}}@media(prefers-reduced-motion:reduce){.more{transition:none}}
</style>
</head>
<body>
<main>
<div class="wash" aria-hidden="true"></div>
<div class="center">
<div class="brand-pair" role="group" aria-label="Studybase and mas0ng.com">
  <div class="brand-mark studybase-mark">
    <img src="https://studybase.site/assets/images/site-icons/genie-avatar.svg" alt="Studybase" width="88" height="88" decoding="async" fetchpriority="high">
  </div>
  <span class="collaboration" aria-hidden="true">×</span>
  <div class="brand-mark mas0ng-mark">
    <img src="https://mas0ng.com/public_assets/site_branding/favicon/black.svg" alt="mas0ng.com" width="76" height="76" decoding="async" fetchpriority="high">
  </div>
</div>
<h1><span class="powered-label">Powered by</span><span class="domain">mas0ng<span>.com</span></span></h1>
<a class="more" href="https://mas0ng.com/?campaign=mgo" target="_blank" rel="noopener noreferrer">Find out more <span aria-hidden="true">↗</span></a>
</div>
</main>
<div id="intro-progress" class="progress-track" role="progressbar" aria-label="Intro progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="progress-fill" class="progress-fill" style="transform: scaleX(1);"></div></div>
<script>// Keep the progress indicator and automatic handoff on the same three-second clock.
const duration = 3000;
const progress = document.getElementById('intro-progress');
const fill = document.getElementById('progress-fill');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let started = performance.now();
let frame;
let finished = false;
function showProgress(value) {
  fill.style.transform = `scaleX(${value})`;
  progress.setAttribute('aria-valuenow', String(Math.round(value * 100)));
}
function finish() {
  if (finished) return;
  finished = true;
  cancelAnimationFrame(frame);
  showProgress(1);
  window.dispatchEvent(new CustomEvent('introcomplete'));
  window.parent.postMessage({ type: 'studybase:continue', source: 'studybase-intro', version: 1 }, '*');
}
function tick(now) {
  if (finished) return;
  const value = Math.min(1, Math.max(0, (now - started) / duration));
  showProgress(reduced.matches ? Math.floor(value * 4) / 4 : value);
  if (value >= 1) finish();
  else frame = requestAnimationFrame(tick);
}
frame = requestAnimationFrame(tick);
const finishTimer = setTimeout(finish, duration);
window.addEventListener('pagehide', () => {
  finished = true;
  clearTimeout(finishTimer);
  cancelAnimationFrame(frame);
}, { once: true });</script>


</body></html>
