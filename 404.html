<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>
    <link rel="icon" href="/assets/siteIcons/main.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/assets/js/loginAnimationCheck.js" defer></script>
    <script src="/assets/js/sessionManager.js" defer></script>
    <script>const PAGE_ID = "404";</script>

    <!-- Cookie consent banner and Google Analytics -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

        const hasConsented = localStorage.getItem('site_consent_granted') === 'true';

        gtag('consent', 'default', {
            'ad_storage': hasConsented ? 'granted' : 'denied',
            'ad_user_data': hasConsented ? 'granted' : 'denied',
            'ad_personalization': hasConsented ? 'granted' : 'denied',
            'analytics_storage': hasConsented ? 'granted' : 'denied'
        });

        gtag('js', new Date());
        gtag('config', 'G-N7LHC0S1T1');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N7LHC0S1T1"></script>
    <script src="/assets/js/cookieConsent.js"></script>
    <!-- End of consent and analytics -->

    <script>
        (function () {
            function isInIframe() {
                try {
                    return window.self !== window.top;
                } catch (e) {
                    return true;
                }
            }

            window.__SB_IS_IFRAME__ = isInIframe();
            document.documentElement.classList.toggle('is-iframe', window.__SB_IS_IFRAME__);

            if (!window.__SB_IS_IFRAME__) {
                const sharedScripts = [
                    '/assets/js/navbar.js',
                    '/assets/js/footer.js'
                ];

                sharedScripts.forEach((src) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.defer = true;
                    document.head.appendChild(script);
                });
            }
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        html, body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        @keyframes rise {
            0% {
                transform: translateY(12vh) scale(0.55);
                opacity: 0;
            }
            15% {
                opacity: 0.75;
            }
            100% {
                transform: translateY(-115vh) scale(1.2);
                opacity: 0;
            }
        }

        @keyframes rotateBorder {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.42), rgba(255,255,255,0.08));
            border: 1px solid rgba(255,255,255,0.26);
            border-radius: 9999px;
            backdrop-filter: blur(2px);
            animation: rise linear infinite;
            pointer-events: none;
        }

        .loading-border-container {
            position: relative;
            padding: 4px;
            border-radius: 2rem;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
        }

        .loading-border-container::before {
            content: "";
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: conic-gradient(
                transparent,
                transparent,
                rgba(255,255,255,0.18),
                #60a5fa,
                rgba(255,255,255,0.18),
                transparent
            );
            animation: rotateBorder 3s linear infinite;
        }

        .inner-card {
            position: relative;
            z-index: 1;
            border-radius: 1.75rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(248,250,252,0.96) 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.65);
        }

        .floaty {
            animation: floaty 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-sky-700 text-slate-900 flex flex-col overflow-x-hidden">
    <div class="absolute inset-0 -z-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-sky-400 via-sky-600 to-blue-800"></div>
    <div class="absolute inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(255,255,255,0.20),_transparent_42%)]"></div>
        <div class="absolute -top-24 left-[8%] h-72 w-72 rounded-full bg-white/10 blur-3xl"></div>
        <div class="absolute bottom-[-4rem] right-[8%] h-80 w-80 rounded-full bg-cyan-300/10 blur-3xl"></div>
        <div id="bubbles-container" class="absolute inset-0"></div>
    </div>

    <div id="navbar-root"></div>

    <main class="flex-1 flex items-center justify-center px-4 py-12 sm:px-6 sm:py-16">
        <div class="w-full max-w-2xl relative z-10">
            <div class="loading-border-container shadow-[0_22px_80px_rgba(2,6,23,0.28)]">
                <section class="inner-card overflow-hidden">
                    <div class="px-7 py-9 sm:px-10 sm:py-12 text-center">
                        <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-50 text-blue-600 shadow-sm floaty">
                            <i data-lucide="search-x" class="h-8 w-8"></i>
                        </div>

                        <p class="mb-3 text-[11px] font-black uppercase tracking-[0.28em] text-blue-500">Error 404</p>

                        <h1 class="text-5xl sm:text-7xl font-black tracking-tight text-slate-900">404</h1>
                        <h2 class="mt-4 text-2xl sm:text-4xl font-extrabold tracking-tight text-slate-900">
                            This page has gone missing.
                        </h2>

                        <p class="mx-auto mt-5 max-w-xl text-sm sm:text-base leading-relaxed text-slate-600">
                            The page you were trying to open has either been moved, removed, or never existed in the first place.
                            You can head back to the homepage and keep browsing from there.
                        </p>

                        
                    </div>
                </section>
            </div>

            <div class="mt-7 flex flex-col items-center text-center">
                <p class="text-xs sm:text-sm font-black uppercase tracking-[0.45em] text-white/90 drop-shadow-md">Page Not Found</p>
                <div class="mt-3 flex gap-1.5">
                    <span class="h-2.5 w-2.5 rounded-full bg-white/90 animate-bounce [animation-delay:-0.3s]"></span>
                    <span class="h-2.5 w-2.5 rounded-full bg-white/90 animate-bounce [animation-delay:-0.15s]"></span>
                    <span class="h-2.5 w-2.5 rounded-full bg-white/90 animate-bounce"></span>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-root"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const container = document.getElementById('bubbles-container');

            for (let i = 0; i < 36; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                const size = Math.random() * 52 + 16;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}vw`;
                bubble.style.animationDuration = `${Math.random() * 9 + 7}s`;
                bubble.style.animationDelay = `-${Math.random() * 16}s`;
                bubble.style.opacity = `${Math.random() * 0.45 + 0.18}`;

                container.appendChild(bubble);
            }

            lucide.createIcons();
        });
    </script>
</body>
</html>
