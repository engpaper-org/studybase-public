    <meta charset="UTF-8">

    <script>
        (function () {
            "use strict";

            function isInIframe() {
                try { return window.self !== window.top; }
                catch (e) { return true; }
            }

            var inIframe = isInIframe();
            var path = window.location.pathname || "";
            var is404File = /\/404\.html$/i.test(path);

            // GitHub Pages can serve this file for unknown routes while keeping the unknown URL
            // in the address bar. Normalise normal page views to /404.html?routeAnalytics=...
            // using the same parameter as the direct-access iframe guard.
            if (!inIframe && !is404File) {
                var missedRoute = path + window.location.search + window.location.hash;
                var target = new URL("/404.html", window.location.origin);
                target.searchParams.set("routeAnalytics", missedRoute || "/");
                window.location.replace(target.toString());
            }
        })();
    </script>

<body class="sb404-page">

    <main class="sb404-main">

                <h1 class="sb404-title">Page not found</h1>

                    Sorry, we couldn’t find the page you were looking for. 
                    It may have been moved or no longer exists.
                </p>

                        The file at this URL was not found.
                    </p>

                         onerror="this.style.display='none';">
                </div>

                </div>

                <div class="sbx-actions sb404-actions" id="sb404-actions"></div>
            </div>
        </div>
    </main>

    <div id="footer-root"></div>

    <script>
        (function () {
            "use strict";

            function isInFrame() {
                try { return window.self !== window.top; } catch (e) { return true; }
            }

            function safeDecode(value) {
                if (!value) return "";
                try { return decodeURIComponent(value); } catch (e) { return value; }
            }

            function currentShownUrl() {
                return window.location.pathname + window.location.search + window.location.hash;
            }

            function getRouteInfo(showRouteDetails) {
                if (!showRouteDetails) return null;

                const params = new URLSearchParams(window.location.search);
                const routeAnalytics = params.get("routeAnalytics");
                const requestedUrl = safeDecode(routeAnalytics || currentShownUrl());

                return {
                    label: "Requested file",
                    value: requestedUrl,
                    help: "The file at this URL was not found."
                };
            }

            const inFrame = isInFrame() || document.documentElement.classList.contains('is-iframe');
            const routeInfo = getRouteInfo(!inFrame);

            if (inFrame) {
                const navRoot = document.getElementById('navbar-root');
                const footRoot = document.getElementById('footer-root');
                if (navRoot) navRoot.remove();
                if (footRoot) footRoot.remove();
                document.body.classList.add('is-iframe');
                document.querySelectorAll('#sbx-navbar, #sbx-footer').forEach(el => el.remove());
            }

            if (!inFrame) {
                ['/assets/js/layout/navbar.js', '/assets/js/layout/footer.js'].forEach(src => {
                    const s = document.createElement('script');
                    s.src = src;
                    s.defer = true;
                    document.head.appendChild(s);
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                const actions = document.getElementById('sb404-actions');
                const title = document.querySelector('.sb404-title');
                const copy = document.getElementById('sb404-copy');
                const card = document.getElementById('sb404-route-card');
                const label = document.getElementById('sb404-route-label');
                const value = document.getElementById('sb404-route-value');
                const help = document.getElementById('sb404-route-help');

                if (inFrame) {
                    if (card) card.remove();
                    if (title) title.textContent = "Page not found";
                    if (copy) copy.textContent = "Sorry, we couldn’t find the page you were looking for.";
                    if (actions) actions.innerHTML = '';
                    return;
                }

                if (routeInfo && card && label && value && help) {
                    card.classList.add('is-visible');
                    label.textContent = routeInfo.label;
                    value.textContent = routeInfo.value;
                    help.textContent = routeInfo.help;
                    if (title) title.textContent = "File not found";
                    if (copy) copy.textContent = "The file at this URL was not found.";
                }

                if (!actions) return;

                actions.innerHTML = `
                    <a href="/index.html" class="sbx-btn sbx-btn-primary">Go to homepage</a>
                    <a href="/support/help_center.html" class="sbx-btn">Visit Help Centre</a>
                `;
            });
        })();
    </script>
