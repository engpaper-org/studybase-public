<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact StudyBase about A-Level revision resources, paper links and support.">
  <title>StudyBase | Contact</title>
  <link rel="icon" href="/assets/images/site-icons/main.ico">
  <link rel="stylesheet" href="/assets/css/main/studybase-remastered.css?v=20260526-remaster">
  <script src="/assets/js/config/siteConfig.js"></script>
  <script src="/assets/js/layout/navbar.js" defer></script>
  <script src="/assets/js/layout/footer.js" defer></script>
</head>
<body>
  <main>
    <section class="sbx-section">
      <div class="sbx-shell sbx-feature-grid">
        <div>
          <span class="sbx-kicker">Contact</span>
          <h1 class="sbx-h1">Tell us what needs fixing or building next.</h1>
          <p class="sbx-lede">Send questions about A-Level routes, broken links, paper pages, access checks or support content.</p>
        </div>
        <form class="sbx-panel sbx-form">
          <label>Your email<input type="email" placeholder="you@example.com"></label>
          <label>What is this about?<select><option>Broken link</option><option>Subject route</option><option>Access check</option><option>Other</option></select></label>
          <label>Message<textarea placeholder="Write the details here."></textarea></label>
          <button class="sbx-btn sbx-btn-primary" type="button">Prepare message</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
