<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Removed</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0a0a0a] text-gray-100 font-sans h-screen w-screen flex items-center justify-center selection:bg-red-500 selection:text-white p-4">

    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-[#0a0a0a] to-black z-0"></div>

    <div class="max-w-lg w-full bg-[#111] border border-gray-800 rounded-2xl shadow-2xl p-8 md:p-10 z-10 opacity-0 animate-fade-in-up relative overflow-hidden text-center">
        
        <div id="top-accent" class="absolute top-0 left-0 w-full h-1 bg-gray-600"></div>

        <div class="flex justify-center mb-6">
            <span id="status-badge" class="text-xs font-bold tracking-widest px-3 py-1.5 rounded-md border shadow-sm">
                LOADING...
            </span>
        </div>

        <div class="flex justify-center mb-6">
            <div id="icon-container" class="p-4 rounded-full border">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" id="status-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
        </div>

        <h1 class="text-3xl font-bold text-white mb-6 tracking-tight">Resource Removed</h1>
        
        <div id="dynamic-message" class="text-gray-300 text-sm leading-relaxed mb-8 bg-gray-900/50 p-5 rounded-lg border border-gray-800/50">
            </div>

        

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const state = urlParams.get('state');

        const topAccent = document.getElementById('top-accent');
        const badge = document.getElementById('status-badge');
        const iconContainer = document.getElementById('icon-container');
        const icon = document.getElementById('status-icon');
        const messageBox = document.getElementById('dynamic-message');

        if (state === 'perm') {
            // Permanent Removal Styling (Red)
            topAccent.className = "absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-700 via-red-500 to-red-700";
            
            badge.textContent = "PERMANENTLY REMOVED";
            badge.className = "text-xs font-bold text-red-500 tracking-widest bg-red-500/10 px-3 py-1.5 rounded-md border border-red-500/20";
            
            iconContainer.className = "bg-red-500/10 p-4 rounded-full border border-red-500/20 shadow-[0_0_20px_rgba(239,68,68,0.15)]";
            icon.className = "h-12 w-12 text-red-500";

            messageBox.innerHTML = `
                <p>Due to recent safety concerns brought to our attention, we can no longer host this content.</p>
                <p class="mt-4 text-red-400 font-medium border-t border-gray-700/50 pt-4">This removal is permanent to ensure the safety, integrity, and compliance of our platform.</p>
            `;
        } 
        else if (state === 'temp') {
            // Temporary Removal Styling (Yellow/Amber)
            topAccent.className = "absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-600 via-amber-400 to-amber-600";
            
            badge.textContent = "TEMPORARILY SUSPENDED";
            badge.className = "text-xs font-bold text-amber-500 tracking-widest bg-amber-500/10 px-3 py-1.5 rounded-md border border-amber-500/20";
            
            iconContainer.className = "bg-amber-500/10 p-4 rounded-full border border-amber-500/20 shadow-[0_0_20px_rgba(245,158,11,0.15)]";
            icon.className = "h-12 w-12 text-amber-500";
            
            // Swap icon to a clock/pause symbol for temporary
            icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />`;

            messageBox.innerHTML = `
                <p>Due to recent safety concerns brought to our attention, we have temporarily suspended this content.</p>
                <p class="mt-4 text-amber-400 font-medium border-t border-gray-700/50 pt-4">We are actively looking for a better, safer way to bring this experience back in the future.</p>
            `;
        } 
        else {
            // Default / Not Found Styling (Gray)
            topAccent.className = "absolute top-0 left-0 w-full h-1 bg-gray-600";
            
            badge.textContent = "UNAVAILABLE";
            badge.className = "text-xs font-bold text-gray-400 tracking-widest bg-gray-800 px-3 py-1.5 rounded-md border border-gray-700";
            
            iconContainer.className = "bg-gray-800 p-4 rounded-full border border-gray-700";
            icon.className = "h-12 w-12 text-gray-400";

            messageBox.innerHTML = `
                <p>The requested resource has been removed or is no longer available on our servers.</p>
            `;
        }
    </script>
</body>
</html>
